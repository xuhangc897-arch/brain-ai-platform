<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>海报制作与分享交流</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #dbe3ef;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --teal: #0f766e;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 24px 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .identity-pill {
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      min-height: 40px;
      padding: 0 14px;
      background: var(--primary);
      color: #fff;
    }

    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: var(--teal); }
    .btn.secondary:hover { background: #0f5f59; }
    .btn.danger { background: var(--red); }
    .btn.ghost { background: #eef4ff; color: var(--primary-dark); }

    .progress {
      display: grid;
      grid-template-columns: repeat(8, minmax(88px, 1fr));
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 10px;
      background: #f8fbff;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: left;
    }

    .progress-step strong {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 999px;
      background: #eaf1ff;
      color: var(--primary-dark);
      font-size: 12px;
    }

    .progress-step span {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .progress-step.is-active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .progress-step.is-active strong {
      background: #fff;
      color: var(--primary);
    }

    .progress-step.is-done {
      border-color: rgba(22, 163, 74, 0.25);
      background: #f0fdf4;
      color: #166534;
    }

    .main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 24px 40px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel + .panel { margin-top: 16px; }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0 0 6px;
      line-height: 1.25;
    }

    .panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel-body {
      padding: 20px;
    }

    .step-layout {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 16px;
    }

    .poster-step-stack {
      display: grid;
      gap: 16px;
    }

    .poster-plan-fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .poster-plan-fields .field {
      margin-bottom: 0;
    }

    .poster-plan-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .poster-plan-item:first-child {
      padding-top: 0;
    }

    .poster-plan-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .poster-plan-item h4 {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
    }

    .poster-plan-item p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .poster-page-head { margin-bottom: 16px; color: var(--primary-dark); font-weight: 800; }
    .record-actions { display: flex; gap: 8px; margin-top: 10px; }
    .record-actions .btn, .qa-record-card .btn { min-height: 34px; }
    .score-record-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .score-record-card { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .score-record-card h4 { margin: 0; }
    .score-record-card p { margin: 6px 0 12px; color: var(--muted); }
    .score-rubric-list { display: grid; gap: 10px; }
    .record-dialog { width: min(620px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
    .record-dialog::backdrop { background: rgba(20, 24, 30, .55); }
    .record-form { max-height: calc(100dvh - 30px); overflow-y: auto; padding: 22px; }
    .record-dialog-head, .record-dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .record-dialog-head h3 { margin: 0; }
    .record-dialog-head { margin-bottom: 16px; }
    .record-dialog-actions { justify-content: flex-end; margin-top: 18px; }
    .score-modal-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .score-modal-list .score-rule { margin-top: 5px; }
    @media (max-width: 560px) { .score-modal-list { grid-template-columns: 1fr; } }

    .poster-example-image-wrap {
      margin: 24px auto;
      text-align: center;
    }

    .poster-example-image {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    .reflection-prompt textarea::placeholder {
      color: #98a2b3;
      opacity: 1;
    }

    .reflection-prompt textarea:focus::placeholder {
      color: transparent;
    }

    .reflection-page-stack {
      display: grid;
      width: min(100%, 1100px);
      margin: 0 auto;
      gap: 18px;
    }

    .reflection-score-list {
      display: grid;
      gap: 12px;
    }

    .reflection-score-list .reading-card {
      width: 100%;
      margin: 0;
    }

    .reflection-score-list .reading-card + .reading-card {
      margin-top: 0;
    }

    .reflection-fields-stack {
      display: grid;
      gap: 0;
    }

    .reflection-fields-stack .field {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .reflection-fields-stack .field:first-child {
      padding-top: 0;
    }

    .reflection-fields-stack .field:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .reflection-fields-stack textarea {
      width: 100%;
      min-height: 140px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .single-step-layout {
      display: grid;
      gap: 16px;
      width: 100%;
    }

    .final-step-action {
      margin-left: auto;
    }

    .share-record-form {
      display: grid;
      gap: 18px;
    }

    .share-presenter-grid,
    .qa-record-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .share-speaking-points textarea {
      min-height: 130px;
    }

    .qa-records-section {
      display: grid;
      gap: 12px;
    }

    .qa-records-head h4 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .qa-records-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .qa-record-card {
      position: relative;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fbff;
    }

    .qa-record-card .delete-qa-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .qa-record-number {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .qa-record-grid textarea {
      min-height: 110px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: #344054;
      font-size: 14px;
      font-weight: 800;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .reading-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .reading-card + .reading-card { margin-top: 12px; }
    .reading-card h4 { margin: 0 0 8px; }
    .reading-card p { margin: 0; color: var(--muted); }

    .task-hero {
      padding: 18px;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: linear-gradient(135deg, #eff6ff, #f8fbff);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.08);
    }

    .task-hero h3,
    .task-card h4 {
      margin: 0 0 8px;
      color: #1e3a8a;
    }

    .task-hero p,
    .task-card p {
      margin: 0 0 10px;
      color: #344054;
    }

    .task-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .task-card + .task-card { margin-top: 12px; }
    .task-card ul, .task-card ol { margin: 8px 0 0; padding-left: 22px; color: #344054; }
    .task-card li { margin: 6px 0; }
    .tip-box { margin-top: 10px; padding: 12px; border-radius: 8px; background: #f8fbff; border: 1px solid var(--line); color: #344054; }
    .poster-reference { display: grid; gap: 12px; margin-top: 16px; }
    .poster-reference-svg { display: block; width: 100%; max-width: 920px; height: auto; margin: 0 auto; border: 1px solid var(--line); border-radius: 8px; background: #eaf4ff; }

    .checklist {
      display: grid;
      gap: 8px;
      padding-left: 18px;
      color: #344054;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 9px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f8fbff;
      color: #344054;
      font-weight: 900;
    }

    td select,
    td input {
      min-width: 82px;
      padding: 7px 8px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .summary-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .summary-card strong {
      display: block;
      color: var(--primary);
      font-size: 22px;
    }

    .summary-card span {
      color: var(--muted);
      font-size: 12px;
    }



    .score-workspace { display: grid; gap: 18px; }
    .score-group-actions, .best-poster-picker { display: flex; flex-wrap: wrap; gap: 10px; }
    .score-delete-btn { background: #fee2e2; color: #b91c1c; }
    .score-delete-btn:hover { background: #fecaca; }
    .best-poster-btn { min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); }
    .best-poster-btn.is-active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .score-rule { margin-top: 12px; border-radius: 8px; background: #f8fbff; border: 1px solid var(--line); }
    .score-rule summary { padding: 10px 12px; color: var(--primary-dark); cursor: pointer; font-size: 13px; font-weight: 900; }
    .score-rule p { margin: 0; padding: 0 12px 12px; color: var(--muted); font-size: 13px; }
    .score-footer-card { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    @media (max-width: 900px) {
      .step-layout,
      .form-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .progress {
        grid-template-columns: repeat(7, 132px);
        justify-content: start;
      }

      .brand-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 680px) {
      .share-presenter-grid,
      .qa-record-grid {
        grid-template-columns: 1fr;
      }

      .final-step-action {
        width: 100%;
      }
    }

    .progress-step.is-locked {
      opacity: 0.45;
      filter: grayscale(0.85);
      cursor: not-allowed;
    }

    .progress-step.is-locked:hover {
      transform: none;
      box-shadow: none;
    }

    .knowledge-page { display: grid; gap: 16px; }
    .knowledge-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .knowledge-card h4 { margin: 0 0 10px; }
    .knowledge-card p { margin: 0 0 12px; font-weight: 700; line-height: 1.7; }
    .knowledge-options { display: grid; gap: 9px; }
    .knowledge-option { display: flex; gap: 9px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
    .knowledge-option input { width: auto; margin-top: 4px; }
    .knowledge-option.is-selected,
    .knowledge-option:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .knowledge-complete { padding: 22px; border: 1px solid var(--line); border-radius: 12px; text-align: center; background: var(--panel); }

    .report-archive-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 20px 0; }
    .report-archive-card { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--panel); }
    .report-archive-card h3 { margin: 0 0 8px; font-size: 17px; }
    .report-archive-card p { min-height: 2.5em; color: var(--muted); }
    .report-archive-card button { width: 100%; }
    .report-archive-viewer { width: 100%; height: min(75vh, 900px); border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .report-archive-hint { color: var(--muted); }

  </style>
  <link rel="stylesheet" href="assets/experiment-theme.css">
  <style>
    html[data-theme="archive"] .btn.ghost,
    html[data-theme="archive"] .progress-step,
    html[data-theme="archive"] .progress-step strong,
    html[data-theme="archive"] .panel-head,
    html[data-theme="archive"] .tip-box,
    html[data-theme="archive"] th,
    html[data-theme="archive"] .score-rule,
    html[data-theme="archive"] .knowledge-option.is-selected {
      background: #f4ead8;
      color: #65471f;
      border-color: #d8bd91;
    }
    html[data-theme="archive"] .task-card,
    html[data-theme="archive"] .qa-record-card,
    html[data-theme="archive"] .score-record-card,
    html[data-theme="archive"] .reading-card,
    html[data-theme="archive"] .knowledge-card,
    html[data-theme="archive"] .summary-card,
    html[data-theme="archive"] table {
      background: #fffaf2;
      border-color: #d8bd91;
      color: #33271c;
    }
    html[data-theme="archive"] .task-card p,
    html[data-theme="archive"] .task-card li,
    html[data-theme="archive"] .tip-box { color: #33271c; }
    html[data-theme="archive"] .poster-page-head,
    html[data-theme="archive"] .task-hero h3,
    html[data-theme="archive"] .score-rule summary,
    html[data-theme="archive"] .summary-card strong { color: #65471f; }
    html[data-theme="archive"] .record-dialog { background: #fffaf2; border-color: #d8bd91; color: #33271c; }
    html[data-theme="archive"] input:focus,
    html[data-theme="archive"] textarea:focus,
    html[data-theme="archive"] select:focus {
      border-color: #9b7135;
      box-shadow: 0 0 0 3px rgba(155, 113, 53, .16);
    }
  </style>
  <script src="assets/experiment-theme.js"></script>
  <link rel="stylesheet" href="assets/ai-assistant.css">
  <link rel="stylesheet" href="assets/voice-assistant.css">
  <link rel="stylesheet" href="assets/memory-partner.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand-title">
          <h1>海报制作与分享交流</h1>
          <span id="identityPill" class="identity-pill"></span>
        </div>
        <div class="top-actions">
          <div class="theme-switch" role="group" aria-label="主题模式">
            <button class="theme-option" type="button" data-theme-option="science" aria-label="切换到科技模式" aria-pressed="true">科技模式</button>
            <button class="theme-option" type="button" data-theme-option="archive" aria-label="切换到档案模式" aria-pressed="false">档案模式</button>
          </div>
          <button class="btn secondary" id="devModeBtn" type="button">开发者模式</button>
          <button class="btn secondary" id="homeBtn" type="button">回到首页</button>
          <button class="btn danger" id="resetBtn" type="button">重置本模块</button>
        </div>
      </div>
      <nav id="progress" class="progress" aria-label="海报活动进度"></nav>
    </div>
  </header>

  <main id="main" class="main"></main>
  <dialog id="recordDialog" class="record-dialog" aria-labelledby="recordDialogTitle"></dialog>

  <script src="assets/experiment-registry.js"></script>
  <script src="assets/platform-core.js"></script>
  <script src="auth.js"></script>
  <script src="assets/experiment-uploader.js"></script>
  <script src="assets/experiment-bridge.js"></script>
  <script src="assets/experiment-page-runtime.js"></script>
  <script src="assets/experiment-integration.js"></script>
  <script src="assets/knowledge-pretest.js"></script>
  <script src="assets/knowledge-assessment.js"></script>
  <script src="assets/experiment-submission.js"></script>
  <script src="assets/report-archive.js"></script>
  <script src="assets/student-memory.js"></script>
  <script src="assets/learning-diagnosis.js"></script>
  <script>
    checkLogin();
  </script>
  <script>
    const pageRuntime = window.BrainExperimentPageRuntime.create("poster");
    const CONTEXT_KEY = pageRuntime.contextKey;
    const STORAGE_KEY = pageRuntime.storageKey;
    const DEV_MODE_KEY = "devMode";

    const steps = [
      { id: "plan", title: "制定初步方案", minutes: "15分钟", taskDescription: "阅读海报应包含的内容，在纸上完成初步方案。" },
      { id: "make", title: "制作海报", minutes: "30分钟", taskDescription: "根据第一步的初步方案完成正式海报，保持整洁美观。" },
      { id: "share", title: "分享交流", minutes: "10分钟", taskDescription: "指派一位小小讲解员介绍海报，并记录交流中的问题和回答。" },
      { id: "questions", title: "提问交流", minutes: "15分钟", taskDescription: "认真观看其他小组的科学海报，提出问题并记录对方的回答。" },
      { id: "score", title: "海报评分", minutes: "20分钟", taskDescription: "根据海报评分表的四个维度对每组海报评分，并为最优海报点赞。" },
      { id: "reflection", title: "总结反思", minutes: "10分钟", taskDescription: "总结交流收获、海报改进方向、小组合作情况和探究成果的应用。" },
      { id: "posttest", title: "侦探小结", minutes: "15分钟", taskDescription: "完成课程知识后测。" }
    ];

    const knowledgeQuestions = window.BrainKnowledgePretestQuestions;
    const knowledgeAssessmentApi = window.BrainKnowledgeAssessment;

    const indicators = [
      { key: "question", dimension: "科学性", title: "研究问题明确性", rule: "1分：未写出研究问题；2分：写出问题但非疑问句；3分：用疑问句表述但问题不清晰；4分：用疑问句清晰表述问题，问题简洁完整" },
      { key: "conclusion", dimension: "科学性", title: "实验结论推理严谨性", rule: "1分：结论与实验数据无关；2分：结论部分引用实验数据但逻辑不通；3分：结论基于数据推导但存在明显漏洞；4分：结论推导过程严密，证据链完整" },
      { key: "layout", dimension: "美观性", title: "排版布局合理", rule: "1分：信息堆砌混乱无分区；2分：信息合理分区但重点模糊；3分：分区清晰合理，重点基本明确；4分：信息排版合理，重点突出且表述完整" },
      { key: "beauty", dimension: "美观性", title: "整体美观度", rule: "1分：色彩或文字杂乱影响辨识；2分：海报各元素不协调；3分：整体整洁但缺乏美观；4分：设计整洁美观，图文搭配吸引力较强" },
      { key: "formCreative", dimension: "创意性", title: "形式创新", rule: "1分：完全套用模板布局无修改；2分：局部布局结构调整；3分：重构模板布局形成新的布局；4分：重构海报模板布局并加入新的图案或元素" },
      { key: "contentCreative", dimension: "创意性", title: "内容创新", rule: "1分：内容完全复制学习单内容；2分：仅调整学习单表述；3分：新增少量原创内容；4分：新增大量与主题相关原创内容" },
      { key: "expression", dimension: "交流展示", title: "表达清晰度", rule: "1分：回答问题完全依赖海报文字；2分：表达碎片化、逻辑混乱；3分：能根据海报回答但缺乏重点；4分：条理清晰、重点突出、语言流畅" },
      { key: "interaction", dimension: "交流展示", title: "问答互动质量", rule: "1分：无法回答提问或回答无关；2分：仅能回答基础问题；3分：能根据部分证据回答但存在漏洞；4分：准确回应问题，结合证据完整阐述" }
    ];

    const groupLabels = ["第1组", "第2组", "第3组", "第4组", "第5组", "第6组"];

    const defaultState = {
      studentName: "",
      studentAge: "",
      studentId: "",
      groupId: "",
      currentStep: 0,
      maxUnlockedStep: 0,
      stepPages: {},
      dataReaderSeen: false,
      fields: {
        researchQuestion: "",
        hypothesis: "",
        researchPlan: "",
        dataDisplay: "",
        conclusion: "",
        limitation: "",
        lifeApplication: "",
        division: "",
        layoutSketch: "",
        chartPlan: "表格",
        aiSupport: "",
        visualPlan: "",
        presenter: "",
        presenterStudentId: "",
        speakingPoints: "",
        askedQuestions: "",
        answers: "",
        bestPoster: "",
        reflectionGain: "",
        reflectionImprove: "",
        teamReflection: "",
        nextUse: ""
      },
      qaRecords: [],
      questions: [],
      scores: {},
      posterGroups: groupLabels.slice(),
      knowledgeAssessment: knowledgeAssessmentApi.emptyTimeline(),
      knowledgeDraftT5: knowledgeAssessmentApi.createDraft("T5", knowledgeQuestions, true),
      savedAt: ""
    };

    let state = loadState();
    let dataReaderOpen = !state.dataReaderSeen && state.currentStep === 0;
    let archiveViewerUrl = "";
    const progress = document.getElementById("progress");
    const main = document.getElementById("main");
    const identityPill = document.getElementById("identityPill");

    function loadState() {
      return pageRuntime.loadState({
        defaultState,
        mergeState,
        applyContext(merged, context) {
          merged.studentName = context.studentName || merged.studentName || "";
          merged.studentAge = context.studentAge || merged.studentAge || "";
          merged.studentId = context.studentId || merged.studentId;
          merged.groupId = context.groupId || merged.groupId;
        }
      });
    }

    function mergeState(base, incoming) {
      const merged = structuredClone(base);
      Object.assign(merged, incoming);
      merged.fields = Object.assign({}, base.fields, incoming.fields || {});
      const legacyQuestion = String(incoming.fields?.askedQuestions ?? "");
      const legacyAnswer = String(incoming.fields?.answers ?? "");
      if (Array.isArray(incoming.qaRecords) && (incoming.qaRecords.length || (!legacyQuestion && !legacyAnswer))) {
        merged.qaRecords = incoming.qaRecords.filter((item) => hasText(item?.question) || hasText(item?.answer)).map((item) => ({
          question: String(item?.question ?? ""),
          answer: String(item?.answer ?? ""),
          studentId: item?.studentId || "",
          studentName: item?.studentName || "",
          className: item?.className || "",
          groupName: item?.groupName || item?.groupId || "",
          createdAt: item?.createdAt || ""
        }));
      } else {
        merged.qaRecords = legacyQuestion || legacyAnswer ? [{ question: legacyQuestion, answer: legacyAnswer }] : [];
      }
      merged.questions = Array.isArray(incoming.questions)
        ? incoming.questions.filter((item) => hasText(item?.group) || hasText(item?.question) || hasText(item?.answer))
        : base.questions;
      merged.stepPages = Object.assign({}, incoming.stepPages || {});
      merged.scores = Object.assign({}, base.scores, incoming.scores || {});
      merged.posterGroups = Array.isArray(incoming.posterGroups) && incoming.posterGroups.length ? incoming.posterGroups : base.posterGroups.slice();
      merged.knowledgeAssessment = knowledgeAssessmentApi.mergeTimelines(incoming.knowledgeAssessment, knowledgeAssessmentApi.readTimeline());
      merged.knowledgeDraftT5 = knowledgeAssessmentApi.normalizeDraft(incoming.knowledgeDraftT5, "T5", knowledgeQuestions, true);
      return merged;
    }

    function saveState() {
      pageRuntime.saveState(state);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPosterGroups() {
      if (!Array.isArray(state.posterGroups) || !state.posterGroups.length) {
        state.posterGroups = groupLabels.slice();
      }
      return state.posterGroups;
    }

    function addPosterGroup() {
      const groups = getPosterGroups();
      const nextNumber = groups.length + 1;
      groups.push(`第${nextNumber}组`);
      saveState();
      renderApp();
    }

    function deletePosterGroup() {
      const groups = getPosterGroups();
      if (groups.length <= 1) {
        alert("至少保留一个组别");
        return;
      }
      const deletedGroupNumber = groups.length;
      const deletedGroup = groups.pop();
      indicators.forEach((indicator) => {
        delete state.scores[`${indicator.key}_${deletedGroupNumber}`];
      });
      state.scoreRecords = (state.scoreRecords || []).filter((item) => item.targetGroup !== deletedGroup);
      if (state.fields.bestPoster === deletedGroup) {
        state.fields.bestPoster = "";
      }
      saveState();
      renderApp();
    }

    function renderApp() {
      normalizeStepAccess();
      if (!state.studentId || !state.groupId) {
        main.innerHTML = `
          <section class="panel">
            <div class="panel-head">
              <h2>需要先填写学生编号和小组编号</h2>
              <p>请回到首页录入身份信息后再进入海报制作模块。</p>
            </div>
            <div class="panel-body">
              <button class="btn" type="button" onclick="location.href='index.html'">回到首页</button>
            </div>
          </section>
        `;
        return;
      }
      identityPill.textContent = `${state.studentName ? `姓名：${state.studentName}　` : ""}${state.studentAge ? `年龄：${state.studentAge}　` : ""}学生：${state.studentId}　小组：${state.groupId}`;
      renderProgress();
      renderStep();
    }


    function clampStepIndex(value) {
      const index = Number(value);
      if (!Number.isInteger(index)) return 0;
      return Math.min(Math.max(index, 0), steps.length - 1);
    }

    function normalizeStepAccess() {
      const legacyCurrent = clampStepIndex(state.currentStep);
      if (!Number.isInteger(Number(state.maxUnlockedStep))) {
        state.maxUnlockedStep = legacyCurrent;
      } else {
        state.maxUnlockedStep = clampStepIndex(state.maxUnlockedStep);
      }
      state.currentStep = isDeveloperMode() ? legacyCurrent : Math.min(legacyCurrent, state.maxUnlockedStep);
    }

    function isDeveloperMode() {
      return sessionStorage.getItem(DEV_MODE_KEY) === "true";
    }

    function enableDeveloperMode() {
      const password = window.prompt("请输入开发者密码");
      if (password !== "memory") {
        alert("密码错误，无法开启开发者模式。");
        return;
      }
      sessionStorage.setItem(DEV_MODE_KEY, "true");
      alert("开发者模式已开启，可自由切换步骤。");
      renderApp();
    }

    function showStepMessage(message) {
      alert(message);
    }

    function goToStep(targetStep) {
      const target = clampStepIndex(targetStep);
      if (!isDeveloperMode() && target > state.maxUnlockedStep) {
        showStepMessage("请先完成前一步内容，再进入下一步。");
        return;
      }
      state.currentStep = target;
      dataReaderOpen = false;
      state.dataReaderSeen = true;
      if (!isDeveloperMode()) saveState();
      renderApp();
      window.scrollTo(0, 0);
    }

    function goNextStep() {
      if (!validateStep(steps[state.currentStep].id)) {
        showStepMessage("请先完成本步骤内容。");
        return;
      }
      if (state.currentStep < steps.length - 1) {
        if (!isDeveloperMode()) state.maxUnlockedStep = Math.max(state.maxUnlockedStep || 0, state.currentStep + 1);
        state.currentStep += 1;
        if (!isDeveloperMode()) saveState();
        renderApp();
        window.scrollTo(0, 0);
      }
    }

    function hasText(value) {
      return String(value ?? "").trim().length > 0;
    }

    function validateStep(stepId) {
      if (isDeveloperMode()) return true;
      const fields = state.fields || {};
      if (stepId === "plan") return true;
      if (stepId === "make") return true;
      if (stepId === "share") {
        return ["presenter", "presenterStudentId", "speakingPoints"].every((key) => hasText(fields[key]))
          && Array.isArray(state.qaRecords)
          && state.qaRecords.some((item) => hasText(item.question) && hasText(item.answer));
      }
      if (stepId === "questions") return Array.isArray(state.questions) && state.questions.some((item) => hasText(item.group) && hasText(item.type) && hasText(item.question) && hasText(item.answer));
      if (stepId === "score") {
        const groups = getPosterGroups();
        const scores = state.scores || {};
        const allScored = groups.every((_, groupIndex) => indicators.every((indicator) => Number(scores[indicator.key + '_' + (groupIndex + 1)]) > 0));
        return allScored && hasText(fields.bestPoster);
      }
      if (stepId === "reflection") return ["reflectionGain", "reflectionImprove", "teamReflection", "nextUse"].every((key) => hasText(fields[key]));
      if (stepId === "posttest") return Boolean(state.knowledgeAssessment?.T5);
      return true;
    }

    function renderProgress() {
      normalizeStepAccess();
      progress.innerHTML = '<button class="progress-step ' + (dataReaderOpen ? 'is-active' : '') + '" type="button" id="openDataReader"><strong>0</strong><span>读取实验数据</span></button>' + steps.map((step, index) => {
        const isActive = !dataReaderOpen && index === state.currentStep;
        const isDone = index < state.maxUnlockedStep;
        const isLocked = !isDeveloperMode() && index > state.maxUnlockedStep;
        const cls = isActive ? "is-active" : isDone ? "is-done" : isLocked ? "is-locked" : "";
        const lockedAttrs = isLocked ? ' aria-disabled="true" title="请先完成前一步内容，再进入下一步。"' : '';
        return `<button class="progress-step ${cls}" type="button" data-step="${index}"${lockedAttrs}><strong>${index + 1}</strong><span>${step.title}</span></button>`;
      }).join("");
      progress.querySelector("#openDataReader").addEventListener("click", openDataReader);
      progress.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          goToStep(Number(button.dataset.step));
        });
      });
    }

    function renderStep() {
      if (dataReaderOpen) {
        renderDataReader();
        return;
      }
      const step = steps[state.currentStep];
      const pageCount = getPageCount(step.id);
      const page = Math.min(Math.max(Number(state.stepPages[step.id]) || 0, 0), pageCount - 1);
      state.stepPages[step.id] = page;
      main.innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <h2>${state.currentStep + 1}. ${step.title}</h2>
            <p>建议时长：${step.minutes}</p>
          </div>
          <div class="panel-body">
            <div class="poster-page-head" aria-live="polite">${step.title} ${page + 1}/${pageCount}</div>
            ${getStepHtml(step.id, page)}
            ${renderNavigation(page, pageCount)}
          </div>
        </section>
      `;
      bindInputs();
      bindStepEvents();
    }

    function openDataReader() {
      dataReaderOpen = true;
      renderApp();
    }

    function renderDataReader() {
      if (archiveViewerUrl) URL.revokeObjectURL(archiveViewerUrl);
      archiveViewerUrl = "";
      main.innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <h2>读取实验数据</h2>
          </div>
          <div class="panel-body">
            <p class="report-archive-hint">选择一份档案，即可在本页查看 PDF，并参考其中的研究问题、数据和结论制作海报。</p>
            <div id="reportArchiveList" class="report-archive-grid" role="status">正在读取档案…</div>
            <div id="reportArchiveViewer"></div>
            <div class="actions"><button class="btn" type="button" id="beginPosterPlan">下一页</button></div>
          </div>
        </section>`;
      document.getElementById("beginPosterPlan").addEventListener("click", () => {
        if (archiveViewerUrl) URL.revokeObjectURL(archiveViewerUrl);
        archiveViewerUrl = "";
        state.dataReaderSeen = true;
        dataReaderOpen = false;
        saveState();
        renderApp();
        window.scrollTo(0, 0);
      });
      loadReportArchives();
    }

    async function loadReportArchives() {
      const list = document.getElementById("reportArchiveList");
      const client = window.BrainReportArchiveClient;
      const result = client && await client.list();
      if (!list || !dataReaderOpen) return;
      if (!result?.ok) {
        list.textContent = "暂时无法读取云端档案，请检查网络或登录状态后重试。";
        return;
      }
      list.innerHTML = (result.items || []).map((item) => `
        <article class="report-archive-card">
          <h3>${escapeHtml(item.label)}</h3>
          <p>${item.archived ? "PDF 已存入平台" : item.submitted ? "正式数据已提交，PDF 待生成" : "尚未找到正式提交"}</p>
          <button class="btn ${item.archived ? "" : "secondary"}" type="button" data-archive-id="${escapeHtml(item.experimentId)}" ${item.submitted ? "" : "disabled"}>
            ${item.archived ? "在平台内查看" : item.submitted ? "生成并查看 PDF" : "暂无档案"}
          </button>
        </article>`).join("");
      list.querySelectorAll("[data-archive-id]").forEach((button) => {
        button.addEventListener("click", async () => {
          const item = result.items.find((entry) => entry.experimentId === button.dataset.archiveId);
          if (!item) return;
          button.disabled = true;
          button.textContent = "正在打开…";
          const archive = item.archived ? { ok: true } : await client.generate(item.experimentId, item.submissionId);
          const pdf = archive?.ok ? await client.view(item.experimentId, item.submissionId) : archive;
          if (!pdf?.ok || !pdf.pdfBase64) {
            button.disabled = false;
            button.textContent = item.archived || archive?.ok ? "重试打开 PDF" : "重试生成 PDF";
            const message = button.closest(".report-archive-card")?.querySelector("p");
            if (message) message.textContent = pdf?.code === "UNAUTHORIZED"
              ? "登录状态已失效，请重新登录后重试。"
              : `PDF ${archive?.ok ? "打开" : "生成"}失败（${pdf?.code || "UNKNOWN_ERROR"}），请稍后重试。`;
            return;
          }
          const viewer = document.getElementById("reportArchiveViewer");
          if (!viewer) return;
          viewer.innerHTML = `<h3>${escapeHtml(item.label)} · 侦探小结档案</h3>`;
          const frame = document.createElement("iframe");
          frame.className = "report-archive-viewer";
          frame.title = `${item.label} PDF`;
          if (archiveViewerUrl) URL.revokeObjectURL(archiveViewerUrl);
          const bytes = Uint8Array.from(atob(pdf.pdfBase64), (character) => character.charCodeAt(0));
          archiveViewerUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
          frame.src = archiveViewerUrl;
          viewer.appendChild(frame);
          viewer.scrollIntoView({ behavior: "smooth", block: "start" });
          if (!item.archived) loadReportArchives();
          else { button.disabled = false; button.textContent = "在平台内查看"; }
        });
      });
    }

    function getPageCount(stepId) {
      return { plan: 2, make: 2, share: 2, questions: 2, score: 2, reflection: 3, posttest: 20 }[stepId] || 1;
    }

    function renderNavigation(page, pageCount) {
      const isFinalStep = state.currentStep === steps.length - 1;
      return `
        <div class="actions">
          <button class="btn ghost" type="button" id="prevStep">上一页</button>
          ${isFinalStep && page === pageCount - 1
            ? (state.knowledgeAssessment?.T5 ? '<button class="btn secondary final-step-action" type="button" id="reviewReportBtn">生成记忆侦探报告</button>' : '<button class="btn" type="button" id="posttestSubmit">提交侦探小结</button>')
            : '<button class="btn" type="button" id="nextStep">下一页</button>'}
        </div>
      `;
    }

    function getStepHtml(stepId, page) {
      return {
        plan: renderPlanStep,
        make: renderMakeStep,
        share: renderShareStep,
        questions: renderQuestionsStep,
        score: renderScoreStep,
        reflection: renderReflectionStep,
        posttest: renderPosttestStep
      }[stepId](page);
    }

    function renderPosttestStep(page) {
      const record = state.knowledgeAssessment?.T5;
      if (record) {
        return `<div class="knowledge-complete"><h3>侦探小结已完成</h3><p>作答已提交并锁定，现在可以生成最终报告。</p></div>`;
      }
      const draft = state.knowledgeDraftT5;
      const pageIds = draft.questionOrder.slice(page, page + 1);
      const cards = pageIds.map((questionId, pageIndex) => {
        const question = knowledgeAssessmentApi.getQuestion(knowledgeQuestions, questionId);
        const selectedAnswer = draft.answers[questionId] || "";
        return `<article class="knowledge-card">
          <h4>第 ${page + pageIndex + 1} 题</h4>
          <p>${escapeHtml(question.question)}</p>
          <div class="knowledge-options">${Object.entries(question.options).map(([key, value]) => `
            <label class="knowledge-option ${selectedAnswer === key ? "is-selected" : ""}">
              <input type="radio" name="posttest-${questionId}" data-knowledge-answer="${questionId}" value="${key}" ${selectedAnswer === key ? "checked" : ""}>
              <span>${key}　${escapeHtml(value)}</span>
            </label>`).join("")}</div>
        </article>`;
      }).join("");
      return `<div class="task-hero"><h3>侦探小结 · 知识后测</h3><p>共 20 题，每页一题。提交后答案将锁定，学生端不显示分数、答案或解析。</p></div>
        <div class="knowledge-page" style="margin-top:16px;">${cards}</div>`;
    }

    function renderPlanStep(page) {
      const items = [
        ["研究问题", "写清楚你们小组想探究的问题。"],
        ["研究假设", "写出你们对研究结果的预测。"],
        ["研究计划", "简单描述实验步骤。"],
        ["实验数据呈现方式", "可以采用表格、柱状图、折线图等形式，图表要标清标题和单位。"],
        ["研究结论", "根据证据概括结论，并说明是否支持假设。"],
        ["反思不足", "可以从实验设计、数据呈现、结论分析和团队合作等方面反思。"],
        ["启示", "联系生活实际，说明本研究可以如何应用于生活。"],
        ["小组分工", "写出每个成员的姓名和任务。"]
      ];
      return `<div class="panel"><div class="panel-head"><h3>制定初步方案</h3><p>在纸上规划海报，确保包含以下内容。</p></div>
        <div class="panel-body poster-plan-fields">${items.slice(page * 4, page * 4 + 4).map(([title, description]) =>
          `<div class="poster-plan-item"><h4>${title}</h4><p>${description}</p></div>`).join("")}</div></div>`;
    }

    function renderMakeStep(page) {
      return page === 0 ? `
        <div class="poster-step-stack">
          <div class="panel">
            <div class="panel-head"><h3>二、制作海报</h3><p>根据第一步的初步方案完成正式海报。</p></div>
            <div class="panel-body">
              <div class="task-card"><p>根据初步方案正式制作海报：使用彩笔进行海报制作，保持整洁美观，可以添加图画或图标使海报更加生动。</p></div>
              <div class="task-card"><p>你可以与右下角的 AI 助手对话，获取海报布局、图表选择、文字表达和美化设计等方面的灵感。</p></div>
              <div class="tip-box">提示：海报初步方案要简单清晰，确保所有内容都能放进去。</div>
            </div>
          </div>
        </div>` : `<div class="poster-step-stack"><div class="panel">
            <div class="panel-head"><h3>参考海报</h3><p>以下为参考海报，同学们可以根据自己的探究内容进行调整。</p></div>
            <div class="panel-body">
              <div class="poster-example-image-wrap">
                <picture>
                  <source srcset="assets/poster-example.webp" type="image/webp">
                  <img src="assets/poster-example.webp" alt="海报示例" class="poster-example-image" width="1492" height="1054" loading="lazy" decoding="async">
                </picture>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderShareStep(page) {
      return page === 0 ? `
        <div class="single-step-layout">
          <div class="panel">
            <div class="panel-body">
              <div class="task-card"><p>每组指派一位代表作为本组的“小小讲解员”站在海报旁，当其他同学或者老师提问时，“小小讲解员”要进行回答。</p></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>分享交流记录</h3></div>
            <div class="panel-body share-record-form">
              <div class="share-presenter-grid">
                ${field("presenter", "小小讲解员", "input")}

      const fillScores = () => {

      recordDialog.querySelector("#cancelRecordTop").addEventListener("click", () => recordDialog.close());
      recordDialog.querySelector("#recordForm").addEventListener("submit", (event) => {
        event.preventDefault();
        if (score) {
          const target = Number(recordDialog.querySelector("#scoreTarget").value);
          recordDialog.querySelectorAll("[data-modal-score]").forEach((select) => {
            const value = Number(select.value);
            state.scores[`${select.dataset.modalScore}_${target}`] = value;
            savePosterScoreRecord(select.dataset.modalScore, target, value);
          });
        } else if (qa) {
          const item = { ...(current || {}), question: recordDialog.querySelector("#qaQuestion").value.trim(), answer: recordDialog.querySelector("#qaAnswer").value.trim(), ...getStudentIdentityFields() };
          if (!item.question || !item.answer) { alert("请完整填写问题和回答。"); return; }
          if (index < 0) state.qaRecords.push(item); else state.qaRecords[index] = item;
        } else {
          const item = { ...(current || {}), group: recordDialog.querySelector("#questionGroup").value, type: recordDialog.querySelector("#questionType").value, question: recordDialog.querySelector("#questionText").value.trim(), answer: recordDialog.querySelector("#questionAnswer").value.trim(), ...getStudentIdentityFields() };
          if (!item.group || !item.question || !item.answer) { alert("请完整填写提问对象、问题和回答。"); return; }
          if (index < 0) state.questions.push(item); else state.questions[index] = item;
        }
        saveState();
        recordDialog.close();
        renderApp();

    recordDialog.addEventListener("close", () => requestAnimationFrame(() => {
      const target = dialogReturnFocus?.isConnected ? dialogReturnFocus : main.querySelector("#addQaRecordBtn, #addQuestionBtn, #addScoreBtn");

    function bindStepEvents() {
      const prev = document.getElementById("prevStep");
      const next = document.getElementById("nextStep");
      if (prev) prev.addEventListener("click", () => {
        const stepId = steps[state.currentStep].id;
        const page = state.stepPages[stepId] || 0;
        if (page > 0) {
          state.stepPages[stepId] = page - 1;
          saveState();
          renderStep();
          window.scrollTo(0, 0);
        } else if (state.currentStep > 0) {
          const previousId = steps[state.currentStep - 1].id;
          state.stepPages[previousId] = getPageCount(previousId) - 1;
          saveState();
          goToStep(state.currentStep - 1);
        } else openDataReader();
      });
      if (next) next.addEventListener("click", () => {
        const stepId = steps[state.currentStep].id;
        const page = state.stepPages[stepId] || 0;
        if (stepId === "posttest" && !state.knowledgeDraftT5.answers[state.knowledgeDraftT5.questionOrder[page]]) {
          showStepMessage("请先完成本页题目。");
          return;
        }
        if (page < getPageCount(stepId) - 1) {
          state.stepPages[stepId] = page + 1;
          saveState();
          renderStep();
          window.scrollTo(0, 0);
        } else {
          state.stepPages[steps[state.currentStep + 1].id] = 0;
          goNextStep();
        }
      });
      const reviewReport = document.getElementById("reviewReportBtn");
      if (reviewReport) reviewReport.addEventListener("click", () => generateReviewReport("poster"));
      main.querySelectorAll("[data-knowledge-answer]").forEach((input) => {
        input.addEventListener("change", () => {
          state.knowledgeDraftT5.answers[input.dataset.knowledgeAnswer] = input.value;
          saveState();
          input.closest(".knowledge-options")?.querySelectorAll(".knowledge-option").forEach((option) => {
            option.classList.toggle("is-selected", option.querySelector("input")?.checked === true);
          });
        });
      });
      const submitPosttest = document.getElementById("posttestSubmit");
      if (submitPosttest) submitPosttest.addEventListener("click", submitPosttestOnce);
    }

    function submitPosttestOnce() {
      const result = knowledgeAssessmentApi.submitStage(state.knowledgeAssessment, "T5", knowledgeQuestions, state.knowledgeDraftT5);
      if (result.unanswered?.length) {
        showStepMessage("请先完成全部 20 道题目。");
        return;
      }
      state.knowledgeAssessment = result.timeline;
      saveState();
      renderApp();
      showStepMessage("侦探小结已完成，作答已锁定。");
    }

    function savePosterScoreRecord(indicatorKey, groupNumber, value) {
      if (!indicatorKey || !groupNumber) return;
      if (!Array.isArray(state.scoreRecords)) state.scoreRecords = [];

      const indicator = indicators.find((item) => item.key === indicatorKey) || {};
      const targetGroup = getPosterGroups()[Number(groupNumber) - 1] || `第${groupNumber}组`;
      const recordKey = `${indicatorKey}_${groupNumber}`;
      const existing = state.scoreRecords.find((item) => item.recordKey === recordKey);
      const data = {
        recordKey,
        indicatorKey,
        dimension: indicator.dimension || "",
        title: indicator.title || "",
        targetGroup,
        score: value || "",
        createdAt: new Date().toLocaleString(),
        ...getStudentIdentityFields()
      };

      if (existing) {
        Object.assign(existing, data);
      } else {
        state.scoreRecords.push(data);
      }
    }

    async function generateReviewReport(activityType) {
      if (!state.knowledgeAssessment?.T5) {
        showStepMessage("请先完成侦探小结。");
        return;
      }
      const button = document.getElementById("reviewReportBtn");
      if (button) button.disabled = true;
      saveState();
      const result = await submitPosterRecord();
      if (result?.ok) window.BrainExperimentBridge.finishReport(activityType, result.submissionId || "");
      else alert(result?.queued ? "正式提交尚未上传成功，请保持联网后重试。" : "正式提交失败，请稍后重试。");
      if (button) button.disabled = false;
    }
    function submitPosterRecord() {
      return window.BrainExperimentBridge.submitExperimentState({
        moduleId: "poster",
        state
      });
    }

    async function hydrateKnowledgeTimeline() {
      const submissionApi = window.BrainExperimentSubmission;
      const session = window.BrainPlatform?.identity?.readStudentSession?.() || {};
      if (!submissionApi?.getLatest || session.isGuest || !session.sessionToken) return;
      const before = knowledgeAssessmentApi.normalizeTimeline(state.knowledgeAssessment);
      const sources = [before, knowledgeAssessmentApi.readTimeline()];
      for (const experimentId of ["screening", "memory", "nback", "interference", "strategies"]) {
        try {
          const result = await submissionApi.getLatest(experimentId);
          if (result?.ok) sources.push(result.submission?.knowledgeAssessment, result.state?.knowledgeAssessment);
        } catch (error) {
          // Missing or offline historical stages remain explicitly unavailable.
        }
      }
      const merged = knowledgeAssessmentApi.mergeTimelines(...sources);
      const beforeIds = knowledgeAssessmentApi.stages.map((stage) => before[stage]?.assessmentId || "").join("|");
      const afterIds = knowledgeAssessmentApi.stages.map((stage) => merged[stage]?.assessmentId || "").join("|");
      if (beforeIds !== afterIds) {
        state.knowledgeAssessment = knowledgeAssessmentApi.writeTimeline(merged);
        saveState();
        renderApp();
      }
    }

    function getScore(indicatorKey, groupNumber) {
      return Number(state.scores[`${indicatorKey}_${groupNumber}`] || 0);
    }

    function summarizeScores() {
      return getPosterGroups().map((group, groupIndex) => {
        const groupNumber = groupIndex + 1;
        const dimensionScores = {};
        indicators.forEach((indicator) => {
          dimensionScores[indicator.dimension] = (dimensionScores[indicator.dimension] || 0) + getScore(indicator.key, groupNumber);
        });
        const total = Object.values(dimensionScores).reduce((sum, value) => sum + value, 0);
        return { group, total, dimensionScores };
      });
    }

    function getTopGroup() {
      const summary = summarizeScores();
      const max = Math.max(...summary.map((item) => item.total));
      if (!max) return "";
      return summary.filter((item) => item.total === max).map((item) => item.group).join("、");
    }
