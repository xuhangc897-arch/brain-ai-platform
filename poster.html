<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记忆侦探社：校园委托行动</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #dbe3ef;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --teal: #0f766e;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 24px 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .identity-pill {
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      min-height: 40px;
      padding: 0 14px;
      background: var(--primary);
      color: #fff;
    }

    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: var(--teal); }
    .btn.secondary:hover { background: #0f5f59; }
    .btn.danger { background: var(--red); }
    .btn.ghost { background: #eef4ff; color: var(--primary-dark); }

    .progress {
      display: grid;
      grid-template-columns: repeat(8, minmax(88px, 1fr));
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 10px;
      background: #f8fbff;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: left;
    }

    .progress-step strong {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 999px;
      background: #eaf1ff;
      color: var(--primary-dark);
      font-size: 12px;
    }

    .progress-step span {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .progress-step.is-active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .progress-step.is-active strong {
      background: #fff;
      color: var(--primary);
    }

    .progress-step.is-done {
      border-color: rgba(22, 163, 74, 0.25);
      background: #f0fdf4;
      color: #166534;
    }

    .main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 24px 40px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel + .panel { margin-top: 16px; }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0 0 6px;
      line-height: 1.25;
    }

    .panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .panel-body {
      padding: 20px;
    }

    .step-layout {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 16px;
    }

    .poster-step-stack {
      display: grid;
      gap: 16px;
    }

    .poster-plan-fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .poster-plan-fields .field {
      margin-bottom: 0;
    }

    .poster-plan-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .poster-plan-item:first-child {
      padding-top: 0;
    }

    .poster-plan-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .poster-plan-item h4 {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
    }

    .poster-plan-item p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .poster-page-head { margin-bottom: 16px; color: var(--primary-dark); font-weight: 800; }
    .record-actions { display: flex; gap: 8px; margin-top: 10px; }
    .record-actions .btn, .qa-record-card .btn { min-height: 34px; }
    .score-record-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .score-record-card { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .score-record-card h4 { margin: 0; }
    .score-record-card p { margin: 6px 0 12px; color: var(--muted); }
    .record-dialog { width: min(620px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
    .record-dialog.is-score { width: min(1080px, calc(100vw - 32px)); }
    .record-dialog::backdrop { background: rgba(20, 24, 30, .55); }
    .record-form { max-height: calc(100dvh - 30px); overflow-y: auto; padding: 22px; }
    .record-dialog-head, .record-dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .record-dialog-head h3 { margin: 0; }
    .record-dialog-head { margin-bottom: 16px; }
    .record-dialog-actions { justify-content: flex-end; margin-top: 18px; }
    .score-modal-list { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 22px; }
    .score-modal-list .field { margin: 0; padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .score-modal-list label { display: block; margin-bottom: 12px; }
    .score-modal-list select { width: 100%; min-height: 54px; padding: 10px 14px; }
    .record-dialog.is-score .record-form { padding: 30px 36px; }
    @media (max-width: 560px) {
      .record-dialog.is-score .record-form { padding: 20px; }
      .score-modal-list .field { padding: 14px; }
    }

    .poster-example-image-wrap {
      margin: 12px auto;
      text-align: center;
    }

    .poster-example-image {
      display: block;
      width: auto;
      max-width: min(100%, 900px);
      max-height: 55dvh;
      height: auto;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    .reflection-prompt textarea::placeholder {
      color: #98a2b3;
      opacity: 1;
    }

    .reflection-prompt textarea:focus::placeholder {
      color: transparent;
    }

    #questionText { min-height: 160px; }
    #questionText::placeholder { color: #8b9199; font-size: 14px; line-height: 1.5; opacity: 1; }

    .reflection-page-stack {
      display: grid;
      width: min(100%, 1100px);
      margin: 0 auto;
      gap: 18px;
    }

    .reflection-score-list {
      display: grid;
      gap: 12px;
    }

    .reflection-score-list .reading-card {
      width: 100%;
      margin: 0;
    }

    .reflection-score-list .reading-card + .reading-card {
      margin-top: 0;
    }

    .reflection-fields-stack {
      display: grid;
      gap: 0;
    }

    .reflection-fields-stack .field {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .reflection-fields-stack .field:first-child {
      padding-top: 0;
    }

    .reflection-fields-stack .field:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .reflection-fields-stack textarea {
      width: 100%;
      min-height: 140px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .single-step-layout {
      display: grid;
      gap: 16px;
      width: 100%;
    }

    .final-step-action {
      margin-left: auto;
    }

    .share-record-form {
      display: grid;
      gap: 18px;
    }

    .share-presenter-grid,
    .qa-record-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .share-speaking-points textarea {
      min-height: 130px;
    }

    .qa-records-section {
      display: grid;
      gap: 12px;
    }

    .qa-records-head h4 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .qa-records-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .qa-record-card {
      position: relative;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fbff;
    }
    .qa-record-card strong, .qa-record-card p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .qa-record-card p { margin: 8px 0; }

    .qa-record-card .delete-qa-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .qa-record-number {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .qa-record-grid textarea {
      min-height: 110px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: #344054;
      font-size: 14px;
      font-weight: 800;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .reading-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .reading-card + .reading-card { margin-top: 12px; }
    .reading-card h4 { margin: 0 0 8px; }
    .reading-card p { margin: 0; color: var(--muted); }

    .task-hero {
      padding: 18px;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: linear-gradient(135deg, #eff6ff, #f8fbff);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.08);
    }

    .task-hero h3,
    .task-card h4 {
      margin: 0 0 8px;
      color: #1e3a8a;
    }

    .task-hero p,
    .task-card p {
      margin: 0 0 10px;
      color: #344054;
    }

    .task-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .task-card + .task-card { margin-top: 12px; }
    .task-card ul, .task-card ol { margin: 8px 0 0; padding-left: 22px; color: #344054; }
    .task-card li { margin: 6px 0; }
    .tip-box { margin-top: 10px; padding: 12px; border-radius: 8px; background: #f8fbff; border: 1px solid var(--line); color: #344054; }
    .poster-reference { display: grid; gap: 12px; margin-top: 16px; }
    .poster-reference-svg { display: block; width: 100%; max-width: 920px; height: auto; margin: 0 auto; border: 1px solid var(--line); border-radius: 8px; background: #eaf4ff; }

    .checklist {
      display: grid;
      gap: 8px;
      padding-left: 18px;
      color: #344054;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .summary-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .summary-card strong {
      display: block;
      color: var(--primary);
      font-size: 22px;
    }

    .summary-card span {
      color: var(--muted);
      font-size: 12px;
    }



    .score-workspace { display: grid; gap: 18px; }
    .score-group-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .score-delete-btn { background: #fee2e2; color: #b91c1c; }
    .score-delete-btn:hover { background: #fecaca; }
    .score-footer-card { display: flex; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .score-footer-card label { flex: none; color: var(--ink); font-size: 16px; }
    .score-footer-card select { width: 160px; min-width: 0; }
    @media (max-width: 900px) {
      .step-layout,
      .form-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .progress {
        grid-template-columns: repeat(8, 132px);
        justify-content: start;
      }

      .brand-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 680px) {
      .share-presenter-grid,
      .qa-record-grid {
        grid-template-columns: 1fr;
      }

      .final-step-action {
        width: 100%;
      }
    }

    .progress-step.is-locked {
      opacity: 0.45;
      filter: grayscale(0.85);
      cursor: not-allowed;
    }

    .progress-step.is-locked:hover {
      transform: none;
      box-shadow: none;
    }

    .knowledge-page { display: grid; gap: 16px; }
    .knowledge-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .knowledge-card h4 { margin: 0 0 10px; }
    .knowledge-card p { margin: 0 0 12px; font-weight: 700; line-height: 1.7; }
    .knowledge-options { display: grid; gap: 9px; }
    .knowledge-option { display: flex; gap: 9px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
    .knowledge-option input { width: auto; margin-top: 4px; }
    .knowledge-option.is-selected,
    .knowledge-option:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .knowledge-complete { padding: 22px; border: 1px solid var(--line); border-radius: 12px; text-align: center; background: var(--panel); }

    .report-archive-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 20px 0; }
    .report-archive-card { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--panel); }
    .report-archive-card h3 { margin: 0 0 8px; font-size: 17px; }
    .report-archive-card p { min-height: 2.5em; color: var(--muted); }
    .report-archive-card button { width: 100%; }
    .report-archive-viewer { display: block; width: 100%; height: calc(100dvh - 110px); border: 0; border-radius: 8px; background: #fff; }
    .archive-dialog { width: min(1100px, calc(100vw - 24px)); height: calc(100dvh - 24px); max-height: none; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
    .archive-dialog::backdrop { background: rgba(20, 24, 30, .65); }
    .archive-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .archive-dialog-head h3 { margin: 0; font-size: 17px; }
    .archive-dialog-head .btn { flex: 0 0 auto; }
    .report-archive-hint { color: var(--muted); }
    .commission-tasks { display: grid; gap: 8px; margin: 12px 0; padding-left: 24px; }
    .commission-tasks li { padding-left: 4px; }
    .commission-note { margin: 18px 0 0; color: var(--muted); }
    .commission-form { display: grid; gap: 12px; }
    .commission-form textarea { min-height: 74px; }
    .commission-actions { margin-top: 18px; }
    .commission-dialog { width: min(900px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
    .commission-dialog::backdrop { background: rgba(20, 24, 30, .55); }
    .commission-dialog-body { padding: 24px; max-height: calc(100dvh - 30px); overflow-y: auto; }
    .commission-dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .commission-dialog-head h3 { margin: 0; }
    .commission-dialog-count { color: var(--muted); margin: 4px 0 0; }
    .commission-dialog-content { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); align-items: center; gap: 18px; margin: 18px 0; }
    .commission-portrait-wrap { display: grid; place-items: end center; height: min(42dvh, 340px); overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: radial-gradient(circle at 50% 30%, #f4ead8, var(--bg) 72%); }
    .commission-portrait { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
    .commission-dialog-quote { margin: 0; padding: 18px; border: 1px solid var(--line); border-radius: 8px; line-height: 1.8; background: var(--bg); }
    .commission-dialog-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
    .commission-dialog-actions .btn:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 560px) { .commission-dialog-body { padding: 18px; } .commission-dialog-content { grid-template-columns: 1fr; gap: 10px; } .commission-portrait-wrap { height: min(24dvh, 190px); } .commission-dialog-quote { padding: 12px; line-height: 1.6; } .commission-dialog-actions .btn { flex: 1 1 auto; } }
    @media (max-width: 680px) {
      .topbar-inner { padding: 8px 12px; }
      .brand-row { gap: 6px; margin-bottom: 6px; }
      .brand-title h1 { font-size: 17px; }
      .identity-pill { font-size: 11px; }
      .top-actions { gap: 5px; }
      .top-actions .btn, .top-actions .theme-option { min-height: 34px; padding: 0 8px; font-size: 12px; }
      .progress-step { min-height: 38px; padding: 5px 8px; }
      .main { padding: 12px 10px 24px; }
      .panel-head, .panel-body { padding: 12px; }
      .poster-page-head { margin-bottom: 9px; }
      .poster-plan-item { padding: 10px 0; }
      .poster-plan-item p { margin-bottom: 0; }
      .actions { margin-top: 12px; padding-top: 12px; }
      .report-archive-grid { margin: 12px 0; }
      .report-archive-card { padding: 12px; }
      .poster-example-image { max-height: 40dvh; }
      .reflection-fields-stack textarea { min-height: 100px; }
      .score-record-grid { grid-template-columns: 1fr; }
      .score-footer-card { gap: 10px; }
      .score-footer-card select { flex: 1; width: auto; }
      .archive-dialog { width: calc(100vw - 12px); height: calc(100dvh - 12px); padding: 8px; }
      .report-archive-viewer { height: calc(100dvh - 95px); }
    }

  </style>
  <link rel="stylesheet" href="assets/experiment-theme.css">
  <style>
    html[data-theme="archive"] .btn.ghost,
    html[data-theme="archive"] .progress-step,
    html[data-theme="archive"] .progress-step strong,
    html[data-theme="archive"] .panel-head,
    html[data-theme="archive"] .tip-box,
    html[data-theme="archive"] .knowledge-option.is-selected {
      background: #f4ead8;
      color: #65471f;
      border-color: #d8bd91;
    }
    html[data-theme="archive"] .task-card,
    html[data-theme="archive"] .qa-record-card,
    html[data-theme="archive"] .score-record-card,
    html[data-theme="archive"] .reading-card,
    html[data-theme="archive"] .knowledge-card,
    html[data-theme="archive"] .summary-card,
    html[data-theme="archive"] .score-footer-card {
      background: #fffaf2;
      border-color: #d8bd91;
      color: #33271c;
    }
    html[data-theme="archive"] .task-card p,
    html[data-theme="archive"] .task-card li,
    html[data-theme="archive"] .tip-box { color: #33271c; }
    html[data-theme="archive"] .poster-page-head,
    html[data-theme="archive"] .task-hero h3,
    html[data-theme="archive"] .summary-card strong { color: #65471f; }
    html[data-theme="archive"] .record-dialog { background: #fffaf2; border-color: #d8bd91; color: #33271c; }
    html[data-theme="archive"] .commission-dialog { background: #fffaf2; border-color: #d8bd91; color: #33271c; }
    html[data-theme="archive"] .commission-dialog-quote { background: #f4ead8; border-color: #d8bd91; }
    html[data-theme="archive"] .archive-dialog { background: #fffaf2; border-color: #d8bd91; }
    html[data-theme="archive"] input:focus,
    html[data-theme="archive"] textarea:focus,
    html[data-theme="archive"] select:focus {
      border-color: #9b7135;
      box-shadow: 0 0 0 3px rgba(155, 113, 53, .16);
    }
  </style>
  <script src="assets/experiment-theme.js"></script>
  <link rel="stylesheet" href="assets/ai-assistant.css">
  <link rel="stylesheet" href="assets/voice-assistant.css">

  <script>
    const pageRuntime = window.BrainExperimentPageRuntime.create("poster");
    const CONTEXT_KEY = pageRuntime.contextKey;
    const STORAGE_KEY = pageRuntime.storageKey;
    const DEV_MODE_KEY = "devMode";

    const steps = [
      { id: "plan", title: "制定初步方案", minutes: "15分钟", taskDescription: "回看四份实验档案，阅读委托海报应包含的内容，在纸上完成初步方案。" },
      { id: "make", title: "制作海报", minutes: "30分钟", taskDescription: "根据第一步的初步方案完成正式海报，保持整洁美观。" },
      { id: "share", title: "分享交流", minutes: "10分钟", taskDescription: "指派一位小小讲解员介绍海报，并记录交流中的问题和回答。" },
      { id: "questions", title: "提问交流", minutes: "15分钟", taskDescription: "认真观看其他小组的委托海报，提出问题并记录对方的回答。" },
      { id: "score", title: "海报评分", minutes: "20分钟", taskDescription: "根据海报评分表的四个维度对每组海报评分，并为最优海报点赞。" },
      { id: "reflection", title: "总结反思", minutes: "10分钟", taskDescription: "总结交流收获、海报改进方向、小组合作情况和探究成果的应用。" },
      { id: "posttest", title: "侦探小结", minutes: "15分钟", taskDescription: "完成课程知识后测。" }
    ];

    const knowledgeQuestions = window.BrainKnowledgePretestQuestions;
    const knowledgeAssessmentApi = window.BrainKnowledgeAssessment;

    const indicators = [
      { key: "question", dimension: "科学性", title: "研究问题明确性", rule: "1分：未写出研究问题；2分：写出问题但非疑问句；3分：用疑问句表述但问题不清晰；4分：用疑问句清晰表述问题，问题简洁完整" },
      { key: "conclusion", dimension: "科学性", title: "实验结论推理严谨性", rule: "1分：结论与实验数据无关；2分：结论部分引用实验数据但逻辑不通；3分：结论基于数据推导但存在明显漏洞；4分：结论推导过程严密，证据链完整" },
      { key: "layout", dimension: "美观性", title: "排版布局合理", rule: "1分：信息堆砌混乱无分区；2分：信息合理分区但重点模糊；3分：分区清晰合理，重点基本明确；4分：信息排版合理，重点突出且表述完整" },
      { key: "beauty", dimension: "美观性", title: "整体美观度", rule: "1分：色彩或文字杂乱影响辨识；2分：海报各元素不协调；3分：整体整洁但缺乏美观；4分：设计整洁美观，图文搭配吸引力较强" },
      { key: "formCreative", dimension: "创意性", title: "形式创新", rule: "1分：完全套用模板布局无修改；2分：局部布局结构调整；3分：重构模板布局形成新的布局；4分：重构海报模板布局并加入新的图案或元素" },
      { key: "contentCreative", dimension: "创意性", title: "内容创新", rule: "1分：内容完全复制学习单内容；2分：仅调整学习单表述；3分：新增少量原创内容；4分：新增大量与主题相关原创内容" },
      { key: "expression", dimension: "交流展示", title: "表达清晰度", rule: "1分：回答问题完全依赖海报文字；2分：表达碎片化、逻辑混乱；3分：能根据海报回答但缺乏重点；4分：条理清晰、重点突出、语言流畅" },
      { key: "interaction", dimension: "交流展示", title: "问答互动质量", rule: "1分：无法回答提问或回答无关；2分：仅能回答基础问题；3分：能根据部分证据回答但存在漏洞；4分：准确回应问题，结合证据完整阐述" }
    ];

    const groupLabels = ["第1组", "第2组", "第3组", "第4组", "第5组", "第6组"];

    const backupCommissions = [
      { title: "开放日小向导", text: "三天后我要带家长参观校园，介绍六个地点。我常把科学教室和科技活动室的介绍说混。带队时还要记住家长刚问的问题；如果某个教室临时不能参观，我得马上调整路线。怎样准备，才能讲清楚又不带错路？", task: "三天后带家长参观校园，介绍六个地点并回答问题。", difficulty: "科学教室与科技活动室的介绍容易说混，临时调整路线时可能带错路。", limits: "三天准备时间；带队时会被提问；教室可能临时不能参观。" },
      { title: "运动会检录助手", text: "我负责提醒同学参加检录。上午有几个名称相近的项目，检录时间也很接近。现场不断有人来问时间；刚刚又通知其中一个项目推迟了。我怕按旧时间通知，或把同学带到错误地点。请帮我设计值班时能用的办法。", task: "在运动会现场提醒同学按时到正确地点检录。", difficulty: "相近项目、临近时间容易混淆；项目推迟后可能仍按旧时间通知。", limits: "现场持续有人询问；项目时间可能临时改变。" },
      { title: "科学节展台讲解员", text: "下周我要向低年级同学演示一个实验。我需要记住讲解要点和操作顺序，但一被提问就可能忘记讲到哪一步。有两个概念很相似，我也容易说反。若当天演示材料临时替换，我还得调整讲解。请帮我准备。", task: "下周向低年级同学演示实验，按顺序完成操作和讲解。", difficulty: "被提问后可能忘记进度；两个相似概念容易说反。", limits: "演示材料可能临时替换，需要现场调整。" },
      { title: "校园剧舞台提醒员", text: "周五演出时，我要提醒演员按顺序上场、拿道具。两场戏的道具很像，排练时就拿错过。正式演出不能一直翻完整剧本；如果前一场提前结束，我还要及时改变提醒顺序。怎样减少漏提醒和拿错道具？", task: "周五演出时提醒演员按顺序上场并拿对道具。", difficulty: "两场戏的道具相似，容易漏提醒或拿错。", limits: "演出时不能一直翻完整剧本；前一场可能提前结束。" },
      { title: "图书漂流管理员", text: "我下周负责登记借还书。几本书的书名很像，借阅规则也有两种。午休时几位同学可能接连来借书、还书，中途还会改选另一本。我常记不清刚才谁借了什么，也怕几天后把规则记混。请帮我设计登记与核对办法。", task: "下周午休登记同学借还书，并在之后核对记录。", difficulty: "书名和借阅规则容易混淆，连续接待时记不清谁借了什么。", limits: "多位同学接连办理借还；中途可能改选书。" },
      { title: "小组展示负责人", text: "下周我们要做课堂展示。我需要记住自己的讲解内容，还要根据前一位组员实际讲了什么，调整接下来的话。有两张图表很相似，排练时我已经解释错过一次。如果老师临时缩短展示时间，我们还得决定保留哪些内容。请帮我们设计准备和现场应对方案。", task: "下周带领小组完成课堂展示并衔接组员讲解。", difficulty: "两张相似图表曾解释错；需要根据前一位组员的内容调整接下来的话。", limits: "老师可能临时缩短展示时间。" }
    ];
    const backupCommissionPortraits = {
      "开放日小向导": "open-day-guide.webp",
      "运动会检录助手": "sports-checkin.webp",
      "科学节展台讲解员": "science-presenter.webp",
      "校园剧舞台提醒员": "stage-cue.webp",
      "图书漂流管理员": "book-drift.webp",
      "小组展示负责人": "group-presentation.webp"
    };

    const defaultState = {
      studentName: "",
      studentAge: "",
      studentId: "",
      groupId: "",
      currentStep: 0,
      maxUnlockedStep: 0,
      stepPages: {},
      currentView: "commission",
      commission: { source: "", client: "", original: "", task: "", difficulty: "", limits: "" },
      fields: {
        researchQuestion: "",
        hypothesis: "",
        researchPlan: "",
        dataDisplay: "",
        conclusion: "",
        limitation: "",
        lifeApplication: "",
        division: "",
        layoutSketch: "",
        chartPlan: "表格",
        aiSupport: "",
        visualPlan: "",
        presenter: "",
        presenterStudentId: "",
        speakingPoints: "",
        askedQuestions: "",
        answers: "",
        bestPoster: "",
        reflectionGain: "",
        reflectionImprove: "",
        teamReflection: "",
        nextUse: ""
      },
      qaRecords: [],
      questions: [],
      scores: {},
      posterGroups: groupLabels.slice(),
      knowledgeAssessment: knowledgeAssessmentApi.emptyTimeline(),
      knowledgeDraftT5: knowledgeAssessmentApi.createDraft("T5", knowledgeQuestions, true),
      savedAt: ""
    };

    let state = loadState();
    let commissionOpen = state.currentStep === 0 && state.currentView === "commission";
    let backupCommissionIndex = 0;
    let archiveViewerUrl = "";
    const progress = document.getElementById("progress");
    const main = document.getElementById("main");
    const identityPill = document.getElementById("identityPill");

    function loadState() {
      return pageRuntime.loadState({
        defaultState,
        mergeState,
        applyContext(merged, context) {
          merged.studentName = context.studentName || merged.studentName || "";
          merged.studentAge = context.studentAge || merged.studentAge || "";
          merged.studentId = context.studentId || merged.studentId;
          merged.groupId = context.groupId || merged.groupId;
        }
      });
    }

    function mergeState(base, incoming) {
      const merged = structuredClone(base);
      Object.assign(merged, incoming);
      merged.fields = Object.assign({}, base.fields, incoming.fields || {});
      const legacyQuestion = String(incoming.fields?.askedQuestions ?? "");
      const legacyAnswer = String(incoming.fields?.answers ?? "");
      if (Array.isArray(incoming.qaRecords) && (incoming.qaRecords.length || (!legacyQuestion && !legacyAnswer))) {
        merged.qaRecords = incoming.qaRecords.filter((item) => hasText(item?.question) || hasText(item?.answer)).map((item) => ({
          question: String(item?.question ?? ""),
          answer: String(item?.answer ?? ""),
          studentId: item?.studentId || "",
          studentName: item?.studentName || "",
          className: item?.className || "",
          groupName: item?.groupName || item?.groupId || "",
          createdAt: item?.createdAt || ""
        }));
      } else {
        merged.qaRecords = legacyQuestion || legacyAnswer ? [{ question: legacyQuestion, answer: legacyAnswer }] : [];
      }
      merged.questions = Array.isArray(incoming.questions)
        ? incoming.questions.filter((item) => hasText(item?.group) || hasText(item?.question) || hasText(item?.answer))
        : base.questions;
      merged.stepPages = Object.assign({}, incoming.stepPages || {});
      merged.commission = Object.assign({}, base.commission, incoming.commission || {});
      merged.scores = Object.assign({}, base.scores, incoming.scores || {});
      merged.posterGroups = Array.isArray(incoming.posterGroups) && incoming.posterGroups.length ? incoming.posterGroups : base.posterGroups.slice();
      merged.knowledgeAssessment = knowledgeAssessmentApi.mergeTimelines(incoming.knowledgeAssessment, knowledgeAssessmentApi.readTimeline());
      merged.knowledgeDraftT5 = knowledgeAssessmentApi.normalizeDraft(incoming.knowledgeDraftT5, "T5", knowledgeQuestions, true);
      return merged;
    }

    function saveState() {
      pageRuntime.saveState(state);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPosterGroups() {
      if (!Array.isArray(state.posterGroups) || !state.posterGroups.length) {
        state.posterGroups = groupLabels.slice();
      }
      return state.posterGroups;
    }

    function addPosterGroup() {
      const groups = getPosterGroups();
      const nextNumber = groups.length + 1;
      groups.push(`第${nextNumber}组`);
      state.stepPages.score = getPageCount("score") - 1;
      saveState();
      renderApp();
    }

    function deletePosterGroup() {
      const groups = getPosterGroups();
      if (groups.length <= 1) {
        alert("至少保留一个组别");
        return;
      }
      const deletedGroupNumber = groups.length;
      const deletedGroup = groups.pop();
      indicators.forEach((indicator) => {
        delete state.scores[`${indicator.key}_${deletedGroupNumber}`];
      });
      state.scoreRecords = (state.scoreRecords || []).filter((item) => item.targetGroup !== deletedGroup);
      if (state.fields.bestPoster === deletedGroup) {
        state.fields.bestPoster = "";
      }
      saveState();
      renderApp();
    }

    function renderApp() {
      normalizeStepAccess();
      if (!state.studentId || !state.groupId) {
        main.innerHTML = `
          <section class="panel">
            <div class="panel-head">
              <h2>需要先填写学生编号和小组编号</h2>
              <p>请回到首页录入身份信息后再进入海报制作模块。</p>
            </div>
            <div class="panel-body">
              <button class="btn" type="button" onclick="location.href='index.html'">回到首页</button>
            </div>
          </section>
        `;
        return;
      }
      identityPill.textContent = `${state.studentName ? `姓名：${state.studentName}　` : ""}${state.studentAge ? `年龄：${state.studentAge}　` : ""}学生：${state.studentId}　小组：${state.groupId}`;
      renderProgress();
      renderStep();
    }


    function clampStepIndex(value) {
      const index = Number(value);
      if (!Number.isInteger(index)) return 0;
      return Math.min(Math.max(index, 0), steps.length - 1);
    }

    function normalizeStepAccess() {
      const legacyCurrent = clampStepIndex(state.currentStep);
      if (!Number.isInteger(Number(state.maxUnlockedStep))) {
        state.maxUnlockedStep = legacyCurrent;
      } else {
        state.maxUnlockedStep = clampStepIndex(state.maxUnlockedStep);
      }
      state.currentStep = isDeveloperMode() ? legacyCurrent : Math.min(legacyCurrent, state.maxUnlockedStep);
    }

    function isDeveloperMode() {
      return sessionStorage.getItem(DEV_MODE_KEY) === "true";
    }

    function enableDeveloperMode() {
      const password = window.prompt("请输入开发者密码");
      if (password !== "memory") {
        alert("密码错误，无法开启开发者模式。");
        return;
      }
      sessionStorage.setItem(DEV_MODE_KEY, "true");
      alert("开发者模式已开启，可自由切换步骤。");
      renderApp();
    }

    function showStepMessage(message) {
      alert(message);
    }

    function goToStep(targetStep) {
      const target = clampStepIndex(targetStep);
      if (commissionOpen && !commissionIsComplete() && !isDeveloperMode()) {
        showStepMessage("请先完成校园委托档案，再进入下一步。");
        return;
      }
      if (!isDeveloperMode() && target > state.maxUnlockedStep) {
        showStepMessage("请先完成前一步内容，再进入下一步。");
        return;
      }
      state.currentStep = target;
      commissionOpen = false;
      state.currentView = "step";
      if (!isDeveloperMode()) saveState();
      renderApp();
      window.scrollTo(0, 0);
    }

    function goNextStep() {
      if (!validateStep(steps[state.currentStep].id)) {
        showStepMessage("请先完成本步骤内容。");
        return;
      }
      if (state.currentStep < steps.length - 1) {
        if (!isDeveloperMode()) state.maxUnlockedStep = Math.max(state.maxUnlockedStep || 0, state.currentStep + 1);
        state.currentStep += 1;
        if (!isDeveloperMode()) saveState();
        renderApp();
        window.scrollTo(0, 0);
      }
    }

    function hasText(value) {
      return String(value ?? "").trim().length > 0;
    }

    function commissionIsComplete() {
      return ["task", "difficulty", "limits"].every((key) => hasText(state.commission?.[key]));
    }

    function validateStep(stepId) {
      if (isDeveloperMode()) return true;
      const fields = state.fields || {};
      if (stepId === "plan") return true;
      if (stepId === "make") return true;
      if (stepId === "share") {
        return ["presenter", "presenterStudentId", "speakingPoints"].every((key) => hasText(fields[key]))
          && Array.isArray(state.qaRecords)
          && state.qaRecords.some((item) => hasText(item.question) && hasText(item.answer));
      }
      if (stepId === "questions") return Array.isArray(state.questions) && state.questions.some((item) => hasText(item.group) && hasText(item.question) && hasText(item.answer));
      if (stepId === "score") {
        const groups = getPosterGroups();
        const scores = state.scores || {};
        const allScored = groups.every((_, groupIndex) => indicators.every((indicator) => Number(scores[indicator.key + '_' + (groupIndex + 1)]) > 0));
        return allScored && hasText(fields.bestPoster);
      }
      if (stepId === "reflection") return ["reflectionGain", "reflectionImprove", "teamReflection", "nextUse"].every((key) => hasText(fields[key]));
      if (stepId === "posttest") return Boolean(state.knowledgeAssessment?.T5);
      return true;
    }

    function renderProgress() {
      normalizeStepAccess();
      progress.innerHTML = '<button class="progress-step ' + (commissionOpen ? 'is-active' : '') + '" type="button" id="openCommission"><strong>0</strong><span>接受校园委托</span></button>' + steps.map((step, index) => {
        const isActive = !commissionOpen && index === state.currentStep;
        const isDone = index < state.maxUnlockedStep;
        const isLocked = !isDeveloperMode() && index > state.maxUnlockedStep;
        const cls = isActive ? "is-active" : isDone ? "is-done" : isLocked ? "is-locked" : "";
        const lockedAttrs = isLocked ? ' aria-disabled="true" title="请先完成前一步内容，再进入下一步。"' : '';
        return `<button class="progress-step ${cls}" type="button" data-step="${index}"${lockedAttrs}><strong>${index + 1}</strong><span>${step.title}</span></button>`;
      }).join("");
      progress.querySelector("#openCommission").addEventListener("click", openCommission);
      progress.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          goToStep(Number(button.dataset.step));
        });
      });
    }

    function renderStep() {
      if (!document.getElementById("archiveDialog").open) {
        if (archiveViewerUrl) URL.revokeObjectURL(archiveViewerUrl);
        archiveViewerUrl = "";
      }
      if (commissionOpen) {
        renderCommissionStep();
        return;
      }
      const step = steps[state.currentStep];
      const pageCount = getPageCount(step.id);
      const page = Math.min(Math.max(Number(state.stepPages[step.id]) || 0, 0), pageCount - 1);
      state.stepPages[step.id] = page;
      main.innerHTML = `
        <section class="panel">
          <div class="panel-head">
            <h2>${state.currentStep + 1}. ${step.title}</h2>
            <p>建议时长：${step.minutes}</p>
          </div>
          <div class="panel-body">
            <div class="poster-page-head" aria-live="polite">${step.title} ${page + 1}/${pageCount}</div>
            ${getStepHtml(step.id, page)}
            ${renderNavigation(page, pageCount)}
          </div>
        </section>
      `;
      bindInputs();
      bindStepEvents();
      if (step.id === "plan" && page < getArchivePageCount()) loadReportArchives();
    }

    function openCommission() {
      commissionOpen = true;
      state.currentStep = 0;
      state.currentView = "commission";
      saveState();
      renderApp();
      window.scrollTo(0, 0);
    }

    function renderCommissionStep() {
      const page = Math.min(Math.max(Number(state.stepPages.commission) || 0, 0), 3);
      state.stepPages.commission = page;
      main.innerHTML = `
        <section class="panel">
          <div class="panel-head">

          </div>
          <div class="panel-body">
            <div class="poster-page-head" aria-live="polite">接受校园委托 ${page + 1}/4</div>
            ${page === 0 ? `<div class="panel"><div class="panel-head"><h3>校园里的新委托</h3></div><div class="panel-body">
              <p>完成四次实验历练后，记忆侦探社开始接受校园内的委托。每组先寻找一位在学习或校园活动中遇到记忆难题的同学，了解他具体要完成什么、在哪一步出错、有哪些时间和条件限制。</p>
              <ol class="commission-tasks">
                <li><strong>建立委托档案：</strong>记录一件真实发生或即将发生的事，而不是只写“记性不好”。</li>
                <li><strong>分析线索：</strong>结合前四个实验的知识与本组数据，判断问题可能出在暂时记住信息、处理变化、信息干扰或提前学习的哪个环节。</li>
              </ol>
            </div></div>` : page === 1 ? `<div class="panel"><div class="panel-head"><h3>从线索到行动</h3></div><div class="panel-body"><ol class="commission-tasks" start="3">
                <li><strong>设计行动方案：</strong>提出这位同学能够实际采用的办法，并解释每个关键办法的依据。</li>
                <li><strong>交付侦探海报：</strong>让委托人看懂“问题是什么、为什么会发生、下次具体怎么做”。</li>
                <li><strong>验证并修改：</strong>请委托人尝试按海报处理一次类似任务或一个临时变化，再根据反馈改进方案。</li>
              </ol>
              <p class="commission-note">最终成果：一张交给委托人使用的“记忆难题解决海报”。</p>
              <p class="commission-note">暂时找不到身边的委托人？可以查看六份备选委托。</p>
              <div class="commission-actions"><button class="btn secondary" id="showBackupCommissions" type="button">查看六份备选委托</button></div>
            </div></div>` : page === 2 ? `<div class="panel"><div class="panel-head"><h3>建立委托档案 · 任务</h3><p>记录委托人和一件真实发生或即将发生的事。</p></div><div class="panel-body">
              ${state.commission.source ? `<p class="report-archive-hint">已采用备选委托：${escapeHtml(state.commission.source)}</p>` : ""}
              <div class="commission-form">
                <div class="field"><label for="commissionClient">委托人称呼（可用昵称）</label><input id="commissionClient" data-commission-field="client" value="${escapeHtml(state.commission.client)}"></div>
                <div class="field"><label for="commissionOriginal">真实事件或委托人的原话</label><textarea id="commissionOriginal" data-commission-field="original">${escapeHtml(state.commission.original)}</textarea></div>
                <div class="field"><label for="commissionTask">具体要完成的任务与时间</label><textarea id="commissionTask" data-commission-field="task" required>${escapeHtml(state.commission.task)}</textarea></div>
              </div>
            </div></div>` : `<div class="panel"><div class="panel-head"><h3>建立委托档案 · 难点</h3><p>写清出错环节和现实限制，便于设计可用的办法。</p></div><div class="panel-body">
              <div class="commission-form">
                <div class="field"><label for="commissionDifficulty">在哪一步出错或可能出错</label><textarea id="commissionDifficulty" data-commission-field="difficulty" required>${escapeHtml(state.commission.difficulty)}</textarea></div>
                <div class="field"><label for="commissionLimits">时间、条件或工具限制</label><textarea id="commissionLimits" data-commission-field="limits" required>${escapeHtml(state.commission.limits)}</textarea></div>
              </div>
            </div></div>`}
            <div class="actions">${page > 0 ? '<button class="btn ghost" type="button" id="previousCommissionPage">上一页</button>' : '<span></span>'}<button class="btn" type="button" id="nextCommissionPage">下一页</button></div>
          </div>
        </section>`;
      main.querySelectorAll("[data-commission-field]").forEach((input) => input.addEventListener("input", () => {
        state.commission[input.dataset.commissionField] = input.value;
        saveState();
      }));
      document.getElementById("showBackupCommissions")?.addEventListener("click", openBackupCommissions);
      document.getElementById("previousCommissionPage")?.addEventListener("click", () => {
        state.stepPages.commission = page - 1;
        saveState();
        renderApp();
        window.scrollTo(0, 0);
      });
      document.getElementById("nextCommissionPage").addEventListener("click", () => {
        if (page < 3) state.stepPages.commission = page + 1;
        else {
          if (!commissionIsComplete()) { showStepMessage("请填写具体任务、出错环节和限制条件。"); return; }
          commissionOpen = false;
          state.currentView = "step";
          state.stepPages.plan = 0;
        }
        saveState();
        renderApp();
        window.scrollTo(0, 0);
      });
    }

    function openBackupCommissions() {
      backupCommissionIndex = Math.max(0, backupCommissions.findIndex((item) => item.title === state.commission.source));
      renderBackupCommission();
      document.getElementById("commissionDialog").showModal();
      document.getElementById("closeCommissionDialog").focus();
    }

    function renderBackupCommission() {
      const item = backupCommissions[backupCommissionIndex];
      const dialog = document.getElementById("commissionDialog");
      dialog.innerHTML = `<div class="commission-dialog-body">
        <div class="commission-dialog-head"><div><h3 id="commissionDialogTitle">${escapeHtml(item.title)}</h3><p class="commission-dialog-count">备选委托 ${backupCommissionIndex + 1}/6</p></div><button class="btn ghost" id="closeCommissionDialog" type="button" aria-label="关闭备选委托">关闭</button></div>
        <div class="commission-dialog-content">
          <div class="commission-portrait-wrap"><img class="commission-portrait" src="assets/commission-characters/${backupCommissionPortraits[item.title]}" alt="${escapeHtml(item.title)}的半身肖像" decoding="async"></div>
          <p class="commission-dialog-quote">“${escapeHtml(item.text)}”</p>
        </div>
        <div class="commission-dialog-actions">
          <button class="btn ghost" id="previousBackupCommission" type="button" ${backupCommissionIndex === 0 ? "disabled" : ""}>上一位</button>
          <button class="btn ghost" id="nextBackupCommission" type="button" ${backupCommissionIndex === backupCommissions.length - 1 ? "disabled" : ""}>下一位</button>
          <button class="btn" id="useBackupCommission" type="button">采用这份委托</button>
        </div></div>`;
      dialog.querySelector("#closeCommissionDialog").addEventListener("click", () => dialog.close());
      dialog.querySelector("#previousBackupCommission").addEventListener("click", () => { backupCommissionIndex -= 1; renderBackupCommission(); dialog.querySelector("#previousBackupCommission").focus(); });
      dialog.querySelector("#nextBackupCommission").addEventListener("click", () => { backupCommissionIndex += 1; renderBackupCommission(); dialog.querySelector("#nextBackupCommission").focus(); });
      dialog.querySelector("#useBackupCommission").addEventListener("click", () => {
        state.commission = { source: item.title, client: item.title, original: item.text, task: item.task, difficulty: item.difficulty, limits: item.limits };
        state.stepPages.commission = 2;
        saveState();
        dialog.close();
        renderApp();
        document.getElementById("commissionTask")?.focus();
      });
    }

    async function loadReportArchives() {
      const list = document.getElementById("reportArchiveList");
      const client = window.BrainReportArchiveClient;
      const result = client && await client.list();
      if (!list || !list.isConnected) return;
      if (!result?.ok) {
        list.textContent = "暂时无法读取云端档案，请检查网络或登录状态后重试。";
        return;
      }
      const archivePage = state.stepPages.plan || 0;
      const visibleItems = (result.items || []).slice(archivePage * getArchivePageSize(), (archivePage + 1) * getArchivePageSize());
      list.innerHTML = visibleItems.map((item) => `
        <article class="report-archive-card">
          <h3>${escapeHtml(item.label)}</h3>
          <p>${item.archived ? "PDF 已存入平台" : item.submitted ? "正式数据已提交，PDF 待生成" : "尚未找到正式提交"}</p>
          <button class="btn ${item.archived ? "" : "secondary"}" type="button" data-archive-id="${escapeHtml(item.experimentId)}" ${item.submitted ? "" : "disabled"}>
            ${item.archived ? "在平台内查看" : item.submitted ? "生成并查看 PDF" : "暂无档案"}
          </button>
        </article>`).join("");
      list.querySelectorAll("[data-archive-id]").forEach((button) => {
        button.addEventListener("click", async () => {
          const item = result.items.find((entry) => entry.experimentId === button.dataset.archiveId);
          if (!item) return;
          button.disabled = true;
          button.textContent = "正在打开…";
          const archive = item.archived ? { ok: true } : await client.generate(item.experimentId, item.submissionId);
          const pdf = archive?.ok ? await client.view(item.experimentId, item.submissionId) : archive;
          if (!pdf?.ok || !pdf.pdfBase64) {
            button.disabled = false;
            button.textContent = item.archived || archive?.ok ? "重试打开 PDF" : "重试生成 PDF";
            const message = button.closest(".report-archive-card")?.querySelector("p");
            if (message) message.textContent = pdf?.code === "UNAUTHORIZED"
              ? "登录状态已失效，请重新登录后重试。"
              : `PDF ${archive?.ok ? "打开" : "生成"}失败（${pdf?.code || "UNKNOWN_ERROR"}），请稍后重试。`;
            return;
          }
          const viewer = document.getElementById("archiveDialog");
          viewer.innerHTML = `<div class="archive-dialog-head"><h3 id="archiveDialogTitle">${escapeHtml(item.label)} · 侦探小结档案</h3><button class="btn ghost" type="button" id="closeArchiveDialog">关闭</button></div>`;
          const frame = document.createElement("iframe");
          frame.className = "report-archive-viewer";
          frame.title = `${item.label} PDF`;
          if (archiveViewerUrl) URL.revokeObjectURL(archiveViewerUrl);
          const bytes = Uint8Array.from(atob(pdf.pdfBase64), (character) => character.charCodeAt(0));
          archiveViewerUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
          frame.src = archiveViewerUrl;
          viewer.appendChild(frame);
          viewer.querySelector("#closeArchiveDialog").addEventListener("click", () => viewer.close());
          viewer.showModal();
          if (!item.archived) loadReportArchives();
          else { button.disabled = false; button.textContent = "在平台内查看"; }
        });
      });
    }

    document.getElementById("archiveDialog").addEventListener("close", () => {
      if (archiveViewerUrl) URL.revokeObjectURL(archiveViewerUrl);
      archiveViewerUrl = "";
      if (!commissionOpen && steps[state.currentStep]?.id === "plan" && (state.stepPages.plan || 0) < getArchivePageCount()) renderApp();
    });

    function getArchivePageSize() { return window.innerWidth <= 680 ? 1 : 4; }
    function getArchivePageCount() { return 4 / getArchivePageSize(); }
    function getPlanCardPageSize() { return window.innerWidth <= 680 ? 2 : 4; }
    function getRecordPageSize() { return window.innerWidth <= 680 ? 1 : 2; }

    function getPageCount(stepId) {
      if (stepId === "plan") return getArchivePageCount() + 8 / getPlanCardPageSize();
      if (stepId === "share") return 1 + Math.max(1, Math.ceil(state.qaRecords.length / getRecordPageSize()));
      if (stepId === "questions") return Math.max(1, Math.ceil(state.questions.length / getRecordPageSize()));
      if (stepId === "score") return Math.ceil(getPosterGroups().length / (window.innerWidth <= 680 ? 1 : 4));
      if (stepId === "reflection") return window.innerWidth <= 680 ? 5 : 3;
      return { make: 2, posttest: 20 }[stepId] || 1;
    }

    function renderNavigation(page, pageCount) {
      const isFinalStep = state.currentStep === steps.length - 1;
      return `
        <div class="actions">
          <button class="btn ghost" type="button" id="prevStep">上一页</button>
          ${isFinalStep && page === pageCount - 1
            ? (state.knowledgeAssessment?.T5 ? '<button class="btn secondary final-step-action" type="button" id="reviewReportBtn">生成记忆侦探报告</button>' : '<button class="btn" type="button" id="posttestSubmit">提交侦探小结</button>')
            : '<button class="btn" type="button" id="nextStep">下一页</button>'}
        </div>
      `;
    }

    function getStepHtml(stepId, page) {
      return {
        plan: renderPlanStep,
        make: renderMakeStep,
        share: renderShareStep,
        questions: renderQuestionsStep,
        score: renderScoreStep,
        reflection: renderReflectionStep,
        posttest: renderPosttestStep
      }[stepId](page);
    }

    function renderPosttestStep(page) {
      const record = state.knowledgeAssessment?.T5;
      if (record) {
        return `<div class="knowledge-complete"><h3>侦探小结已完成</h3><p>作答已提交并锁定，现在可以生成最终报告。</p></div>`;
      }
      const draft = state.knowledgeDraftT5;
      const pageIds = draft.questionOrder.slice(page, page + 1);
      const cards = pageIds.map((questionId, pageIndex) => {
        const question = knowledgeAssessmentApi.getQuestion(knowledgeQuestions, questionId);
        const selectedAnswer = draft.answers[questionId] || "";
        return `<article class="knowledge-card">
          <h4>第 ${page + pageIndex + 1} 题</h4>
          <p>${escapeHtml(question.question)}</p>
          <div class="knowledge-options">${Object.entries(question.options).map(([key, value]) => `
            <label class="knowledge-option ${selectedAnswer === key ? "is-selected" : ""}">
              <input type="radio" name="posttest-${questionId}" data-knowledge-answer="${questionId}" value="${key}" ${selectedAnswer === key ? "checked" : ""}>
              <span>${key}　${escapeHtml(value)}</span>
            </label>`).join("")}</div>
        </article>`;
      }).join("");
      return `<div class="task-hero"><h3>侦探小结 · 知识后测</h3><p>共 20 题，每页一题。提交后答案将锁定，学生端不显示分数、答案或解析。</p></div>
        <div class="knowledge-page" style="margin-top:16px;">${cards}</div>`;
    }

    function renderPlanStep(page) {
      if (page < getArchivePageCount()) return `<div class="panel"><div class="panel-head"><h3>读取实验数据</h3><p>回看四份实验档案，把研究问题、数据和结论作为分析委托的线索。选择档案，可在本页查看 PDF。</p></div>
        <div class="panel-body">
        <div id="reportArchiveList" class="report-archive-grid" role="status">正在读取档案…</div></div></div>`;
      const items = [
        ["具体任务", "委托人要在什么时候、什么场合完成什么事？海报要让他一眼看懂任务。"],
        ["关键出错点", "标出委托人在哪一步容易忘记、混淆或跟不上变化。"],
        ["时间与条件限制", "写出准备时间、现场变化、可用工具等限制，避免提出用不上的办法。"],
        ["可能原因", "对照前四个实验和本组数据，判断问题与暂时记住信息、处理变化、信息干扰或提前学习有什么关系。"],
        ["具体行动步骤", "告诉委托人准备时、任务进行中和出现变化时分别怎么做。"],
        ["办法的依据", "为关键办法配上实验线索或本组数据，解释为什么这样做。"],
        ["临时变化应对", "预想一处现场变化，说明委托人如何核对信息并调整行动。"],
        ["验证与修改", "请委托人尝试一次类似任务，记录反馈，再指出海报中需要修改的地方。"]
      ];
      const contentPage = page - getArchivePageCount();
      const start = contentPage * getPlanCardPageSize();
      return `<div class="panel"><div class="panel-head"><h3>制定初步方案</h3><p>在纸上规划交给委托人使用的海报，确保包含以下内容。</p></div>
        <div class="panel-body poster-plan-fields">${items.slice(start, start + getPlanCardPageSize()).map(([title, description]) =>
          `<div class="poster-plan-item"><h4>${title}</h4><p>${description}</p></div>`).join("")}</div></div>`;
    }

    function renderMakeStep(page) {
      return page === 0 ? `
        <div class="poster-step-stack">
          <div class="panel">
            <div class="panel-head"><h3>二、制作海报</h3><p>根据第一步的初步方案完成正式海报。</p></div>
            <div class="panel-body">
              <div class="task-card"><p>根据初步方案正式制作海报：使用彩笔进行海报制作，保持整洁美观，可以添加图画或图标使海报更加生动。</p></div>
              <div class="task-card"><p>你可以与右下角的 AI 助手对话，获取海报布局、图表选择、文字表达和美化设计等方面的灵感。</p></div>
              <div class="tip-box">提示：海报初步方案要简单清晰，确保所有内容都能放进去。</div>
            </div>
          </div>
        </div>` : `<div class="poster-step-stack"><div class="panel">
            <div class="panel-head"><h3>参考海报</h3><p>以下为通用海报版式示例，请根据自己接受的委托填写各区块内容。</p></div>
            <div class="panel-body">
              <div class="poster-example-image-wrap">
                <picture>
                  <source srcset="assets/poster-example.webp" type="image/webp">
                  <img src="assets/poster-example.webp" alt="仅保留栏目标题的记忆难题解决海报版式示例" class="poster-example-image" width="1492" height="1054" loading="lazy" decoding="async">
                </picture>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderShareStep(page) {
      return page === 0 ? `
        <div class="single-step-layout">
          <div class="panel">
            <div class="panel-body">
              <div class="task-card"><p>每组指派一位代表作为本组的“小小讲解员”站在海报旁，当其他同学或者老师提问时，“小小讲解员”要进行回答。</p></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>分享交流记录</h3></div>
            <div class="panel-body share-record-form">
              <div class="share-presenter-grid">
                ${field("presenter", "小小讲解员", "input")}
                <div class="field"><label>小小讲解员学生编号</label><input data-field="presenterStudentId" value="${escapeHtml(state.fields.presenterStudentId)}" placeholder="请输入学生编号"></div>
              </div>
              <div class="field share-speaking-points">
                <label>讲解要点</label>
                <textarea data-field="speakingPoints">${escapeHtml(state.fields.speakingPoints)}</textarea>
              </div>
            </div>
          </div>
        </div>` : `
        <div class="single-step-layout"><div class="panel"><div class="panel-body">
              <section class="qa-records-section">
                <div class="qa-records-head">
                  <h4>问题与回答记录</h4>
                  <p>记录交流过程中收到的问题以及对应回答。</p>
                </div>
                ${(state.qaRecords || []).slice((page - 1) * getRecordPageSize(), page * getRecordPageSize()).map((item, offset) => {
                  const index = (page - 1) * getRecordPageSize() + offset;
                  return `
                  <article class="qa-record-card">
                    <strong>第 ${index + 1} 条：${escapeHtml(item.question || "未填写问题")}</strong>
                    <p>${escapeHtml(item.answer || "未填写回答")}</p>
                    <button class="btn ghost" type="button" data-edit-qa="${index}">编辑</button>
                    <button class="btn danger" type="button" data-delete-qa="${index}">删除</button>
                  </article>`;
                }).join("")}
                ${state.qaRecords.length ? "" : '<p class="report-archive-hint">暂无记录。点击下方按钮添加。</p>'}
                <button class="btn secondary" type="button" id="addQaRecordBtn">＋添加问题与回答</button>
              </section>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuestionsStep(page) {
      const start = page * getRecordPageSize();
      return `<div class="panel"><div class="panel-head"><h3>提问交流记录</h3></div><div class="panel-body qa-records-section">
            ${state.questions.slice(start, start + getRecordPageSize()).map((item, offset) => `<article class="qa-record-card">
              <strong>第 ${start + offset + 1} 条 · ${escapeHtml(item.group)}</strong>
              <p>问题：${escapeHtml(item.question)}</p><p>回答：${escapeHtml(item.answer)}</p>

            </article>`).join("")}
            ${state.questions.length ? "" : '<p class="report-archive-hint">暂无记录。点击下方按钮添加。</p>'}
            <button class="btn secondary" type="button" id="addQuestionBtn" style="margin-top:14px">＋添加提问</button>
          </div>
        </div>
