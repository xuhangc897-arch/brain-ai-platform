    function renderScoreStep(page) {
      const groups = getPosterGroups();
      const summary = summarizeScores();
      const start = page * (window.innerWidth <= 680 ? 1 : 4);
      const visibleGroups = groups.slice(start, start + (window.innerWidth <= 680 ? 1 : 4));
      return `<div class="score-workspace">
        <div class="score-group-actions"><button class="btn secondary" type="button" id="addScoreBtn">＋添加评分</button><button class="btn ghost" type="button" id="addPosterGroupBtn">＋添加组别</button><button class="btn score-delete-btn" type="button" id="deletePosterGroupBtn">－ 删除组别</button></div>
        <div class="score-record-grid">${visibleGroups.map((group, offset) => {
          const index = start + offset;
          const done = indicators.filter((indicator) => getScore(indicator.key, index + 1)).length;
          return `<article class="score-record-card"><h4>${escapeHtml(group)}</h4><p>${done}/8 项已评分 · 总分 ${summary[index].total}</p><button class="btn ghost" type="button" data-edit-score="${index + 1}">${done ? "查看或修改" : "开始评分"}</button></article>`;
        }).join("")}</div>
        <section class="score-footer-card"><label for="bestPosterSelect">我心中的最优海报</label>
          <select id="bestPosterSelect"><option value="">第X组</option>${groups.map((group) => `<option value="${escapeHtml(group)}" ${state.fields.bestPoster === group ? "selected" : ""}>${escapeHtml(group)}</option>`).join("")}</select></section>
      </div>`;
    }
    function renderReflectionStep(page) {
      if (page === 0) {
        return `<div class="panel"><div class="panel-head"><h3>评分结果</h3><p>根据当前评分自动汇总。</p></div>
          <div class="panel-body reflection-score-list"><div class="reading-card"><h4>当前总分最高</h4><p>${escapeHtml(getTopGroup() || "待完成评分")}</p></div>
          <div class="reading-card"><h4>最优海报点赞</h4><p>${escapeHtml(state.fields.bestPoster || "尚未选择")}</p></div></div></div>`;
      }
      const prompts = [
        ["reflectionGain", "本次交流最大的收获", "可以从倾听他人观点、改进自己表达、理解研究内容等方面总结。"],
        ["reflectionImprove", "海报还可以怎样改进", "可以从内容结构、图表清晰度、文字表达和视觉设计等方面思考。"],
        ["teamReflection", "小组合作反思", "可以从分工、沟通、成员参与和遇到的问题等方面反思。"],
        ["nextUse", "今后如何应用探究成果", "可以思考探究发现如何用于学习、科学表达或日常生活。"]
      ];
      const promptPageSize = window.innerWidth <= 680 ? 1 : 2;
      return `<div class="panel"><div class="panel-head"><h3>总结反思</h3></div>
        <div class="panel-body reflection-fields-stack reflection-prompt">${prompts.slice((page - 1) * promptPageSize, page * promptPageSize).map(([key, label, hint]) => field(key, label, "textarea", hint)).join("")}</div></div>`;
    }
    function field(key, label, type, placeholder = "") {
      const placeholderAttr = placeholder ? ` placeholder="${escapeHtml(placeholder)}"` : "";
      if (type === "input") {
        return `<div class="field"><label>${label}</label><input data-field="${key}" value="${escapeHtml(state.fields[key])}"${placeholderAttr}></div>`;
      }
      return `<div class="field"><label>${label}</label><textarea data-field="${key}"${placeholderAttr}>${escapeHtml(state.fields[key])}</textarea></div>`;
    }

    function bindInputs() {
      main.querySelectorAll("[data-field]").forEach((element) => {
        element.addEventListener("input", () => updateField(element));
        element.addEventListener("change", () => updateField(element));
      });
      main.querySelector("#addQaRecordBtn")?.addEventListener("click", () => openRecordDialog("qa"));
      main.querySelectorAll("[data-edit-qa]").forEach((button) => button.addEventListener("click", () => openRecordDialog("qa", Number(button.dataset.editQa))));
      main.querySelectorAll("[data-delete-qa]").forEach((button) => button.addEventListener("click", () => {
        state.qaRecords.splice(Number(button.dataset.deleteQa), 1);
        saveState();
        renderApp();
      }));
      main.querySelector("#addQuestionBtn")?.addEventListener("click", () => openRecordDialog("question"));
      main.querySelectorAll("[data-edit-question]").forEach((button) => button.addEventListener("click", () => openRecordDialog("question", Number(button.dataset.editQuestion))));
      main.querySelectorAll("[data-delete-question]").forEach((button) => button.addEventListener("click", () => {
        state.questions.splice(Number(button.dataset.deleteQuestion), 1);
        saveState();
        renderApp();
      }));
      main.querySelector("#addScoreBtn")?.addEventListener("click", () => openRecordDialog("score"));
      main.querySelectorAll("[data-edit-score]").forEach((button) => button.addEventListener("click", () => openRecordDialog("score", Number(button.dataset.editScore))));
      const addPosterGroupButton = document.getElementById("addPosterGroupBtn");
      if (addPosterGroupButton) addPosterGroupButton.addEventListener("click", addPosterGroup);
      const deletePosterGroupButton = document.getElementById("deletePosterGroupBtn");
      if (deletePosterGroupButton) deletePosterGroupButton.addEventListener("click", deletePosterGroup);
      main.querySelector("#bestPosterSelect")?.addEventListener("change", (event) => {
        state.fields.bestPoster = event.target.value;
        saveState();
      });
    }

    function updateField(element) {
      state.fields[element.dataset.field] = element.value;
      saveState();
    }

    const recordDialog = document.getElementById("recordDialog");
    let dialogReturnFocus = null;

    function openRecordDialog(kind, index = -1) {
      dialogReturnFocus = document.activeElement;
      const qa = kind === "qa";
      const score = kind === "score";
      const current = qa ? state.qaRecords[index] : score ? null : state.questions[index];
      const title = score ? "海报评分" : qa ? "问题与回答记录" : "提问交流";
      const firstIncompleteGroup = score ? getPosterGroups().findIndex((_, i) => !indicators.every((item) => getScore(item.key, i + 1))) : -1;
      const groupNumber = score ? (index > 0 ? index : Math.max(1, firstIncompleteGroup + 1)) : 0;
      recordDialog.classList.toggle("is-score", score);
      recordDialog.innerHTML = `<form id="recordForm" class="record-form">
        <div class="record-dialog-head"><h3 id="recordDialogTitle">${title}</h3><button class="btn ghost" type="button" id="cancelRecordTop" aria-label="关闭弹窗">×</button></div>
        ${score ? `<div class="field"><label for="scoreTarget">被评分小组</label><select id="scoreTarget" required>${getPosterGroups().map((group, i) => `<option value="${i + 1}" ${i + 1 === groupNumber ? "selected" : ""}>${escapeHtml(group)}</option>`).join("")}</select></div>
          <div class="score-modal-list">${indicators.map((item) => `<div class="field"><label for="score-${item.key}">${escapeHtml(item.dimension)} · ${escapeHtml(item.title)}</label><select id="score-${item.key}" data-modal-score="${item.key}" required>
          <option value="">请选择最符合表现的评分描述</option>${item.rule.split("；").map((description, index) => `<option value="${index + 1}">${escapeHtml(description.trim())}</option>`).join("")}</select></div>`).join("")}</div>`
          : qa ? `<div class="field"><label for="qaQuestion">被问到的问题</label><textarea id="qaQuestion" required>${escapeHtml(current?.question || "")}</textarea></div>
            <div class="field"><label for="qaAnswer">回答摘要</label><textarea id="qaAnswer" required>${escapeHtml(current?.answer || "")}</textarea></div>`
          : `<div class="field"><label for="questionGroup">提问对象</label><input id="questionGroup" type="text" value="${escapeHtml(current?.group || "")}" placeholder="如：第2组或张同学" required></div>
            <div class="field"><label for="questionText">具体问题</label><textarea id="questionText" placeholder="委托难题：你们怎样确认委托人在哪一步遇到困难？&#10;线索与依据：哪项实验结果支持你们的判断？&#10;行动方案：委托人下次遇到类似情况，具体怎么做？&#10;试用与修改：试用后收到什么反馈，方案改了哪里？" required>${escapeHtml(current?.question || "")}</textarea></div>
            <div class="field"><label for="questionAnswer">对方回答摘要</label><textarea id="questionAnswer" required>${escapeHtml(current?.answer || "")}</textarea></div>`}
        <div class="record-dialog-actions"><button class="btn ghost" type="button" id="cancelRecord">取消</button><button class="btn" type="submit">保存记录</button></div>
      </form>`;
      const fillScores = () => {
        const target = Number(recordDialog.querySelector("#scoreTarget").value);
        recordDialog.querySelectorAll("[data-modal-score]").forEach((select) => {
          select.value = String(getScore(select.dataset.modalScore, target) || "");
        });
      };
      if (score) {
        recordDialog.querySelector("#scoreTarget").addEventListener("change", fillScores);
        fillScores();
      }
      recordDialog.querySelector("#cancelRecord").addEventListener("click", () => recordDialog.close());
      recordDialog.querySelector("#cancelRecordTop").addEventListener("click", () => recordDialog.close());
      recordDialog.querySelector("#recordForm").addEventListener("submit", (event) => {
        event.preventDefault();
        if (score) {
          const target = Number(recordDialog.querySelector("#scoreTarget").value);
          recordDialog.querySelectorAll("[data-modal-score]").forEach((select) => {
            const value = Number(select.value);
            state.scores[`${select.dataset.modalScore}_${target}`] = value;
            savePosterScoreRecord(select.dataset.modalScore, target, value);
          });
        } else if (qa) {
          const item = { ...(current || {}), question: recordDialog.querySelector("#qaQuestion").value.trim(), answer: recordDialog.querySelector("#qaAnswer").value.trim(), ...getStudentIdentityFields() };
          if (!item.question || !item.answer) { alert("请完整填写问题和回答。"); return; }
          if (index < 0) {
            state.qaRecords.push(item);
            state.stepPages.share = getPageCount("share") - 1;
          } else state.qaRecords[index] = item;
        } else {
          const item = { ...(current || {}), group: recordDialog.querySelector("#questionGroup").value.trim(), question: recordDialog.querySelector("#questionText").value.trim(), answer: recordDialog.querySelector("#questionAnswer").value.trim(), ...getStudentIdentityFields() };
          if (!item.group || !item.question || !item.answer) { alert("请完整填写提问对象、问题和回答。"); return; }
          if (index < 0) {
            state.questions.push(item);
            state.stepPages.questions = getPageCount("questions") - 1;
          } else state.questions[index] = item;
        }
        saveState();
        recordDialog.close();
        renderApp();
      });
      recordDialog.showModal();
      recordDialog.querySelector("select, input, textarea")?.focus();
    }

    recordDialog.addEventListener("close", () => requestAnimationFrame(() => {
      const target = dialogReturnFocus?.isConnected ? dialogReturnFocus : main.querySelector("#addQaRecordBtn, #addQuestionBtn, #addScoreBtn");
      target?.focus();
    }));
    function bindStepEvents() {
      const prev = document.getElementById("prevStep");
      const next = document.getElementById("nextStep");
      if (prev) prev.addEventListener("click", () => {
        const stepId = steps[state.currentStep].id;
        const page = state.stepPages[stepId] || 0;
        if (page > 0) {
          state.stepPages[stepId] = page - 1;
          saveState();
          renderStep();
          window.scrollTo(0, 0);
        } else if (state.currentStep > 0) {
          const previousId = steps[state.currentStep - 1].id;
          state.stepPages[previousId] = getPageCount(previousId) - 1;
          saveState();
          goToStep(state.currentStep - 1);
        } else {
          commissionOpen = true;
          state.currentView = "commission";
          state.stepPages.commission = 3;
          saveState();
          renderApp();
          window.scrollTo(0, 0);
        }
      });
      if (next) next.addEventListener("click", () => {
        const stepId = steps[state.currentStep].id;
        const page = state.stepPages[stepId] || 0;
        if (stepId === "posttest" && !state.knowledgeDraftT5.answers[state.knowledgeDraftT5.questionOrder[page]]) {
          showStepMessage("请先完成本页题目。");
          return;
        }
        if (page < getPageCount(stepId) - 1) {
          state.stepPages[stepId] = page + 1;
          saveState();
          renderStep();
          window.scrollTo(0, 0);
        } else {
          state.stepPages[steps[state.currentStep + 1].id] = 0;
          goNextStep();
        }
      });
      const reviewReport = document.getElementById("reviewReportBtn");
      if (reviewReport) reviewReport.addEventListener("click", () => generateReviewReport("poster"));
      main.querySelectorAll("[data-knowledge-answer]").forEach((input) => {
        input.addEventListener("change", () => {
          state.knowledgeDraftT5.answers[input.dataset.knowledgeAnswer] = input.value;
          saveState();
          input.closest(".knowledge-options")?.querySelectorAll(".knowledge-option").forEach((option) => {
            option.classList.toggle("is-selected", option.querySelector("input")?.checked === true);
          });
        });
      });
      const submitPosttest = document.getElementById("posttestSubmit");
      if (submitPosttest) submitPosttest.addEventListener("click", submitPosttestOnce);
    }

    function submitPosttestOnce() {
      const result = knowledgeAssessmentApi.submitStage(state.knowledgeAssessment, "T5", knowledgeQuestions, state.knowledgeDraftT5);
      if (result.unanswered?.length) {
        showStepMessage("请先完成全部 20 道题目。");
        return;
      }
      state.knowledgeAssessment = result.timeline;
      saveState();
      renderApp();
      showStepMessage("侦探小结已完成，作答已锁定。");
    }

    function savePosterScoreRecord(indicatorKey, groupNumber, value) {
      if (!indicatorKey || !groupNumber) return;
      if (!Array.isArray(state.scoreRecords)) state.scoreRecords = [];

      const indicator = indicators.find((item) => item.key === indicatorKey) || {};
      const targetGroup = getPosterGroups()[Number(groupNumber) - 1] || `第${groupNumber}组`;
      const recordKey = `${indicatorKey}_${groupNumber}`;
      const existing = state.scoreRecords.find((item) => item.recordKey === recordKey);
      const data = {
        recordKey,
        indicatorKey,
        dimension: indicator.dimension || "",
        title: indicator.title || "",
        targetGroup,
        score: value || "",
        createdAt: new Date().toLocaleString(),
        ...getStudentIdentityFields()
      };

      if (existing) {
        Object.assign(existing, data);
      } else {
        state.scoreRecords.push(data);
      }
    }

    async function generateReviewReport(activityType) {
      if (!state.knowledgeAssessment?.T5) {
        showStepMessage("请先完成侦探小结。");
        return;
      }
      const button = document.getElementById("reviewReportBtn");
      if (button) button.disabled = true;
      saveState();
      const result = await submitPosterRecord();
      if (result?.ok) window.BrainExperimentBridge.finishReport(activityType, result.submissionId || "");
      else alert(result?.queued ? "正式提交尚未上传成功，请保持联网后重试。" : "正式提交失败，请稍后重试。");
      if (button) button.disabled = false;
    }
    function submitPosterRecord() {
      return window.BrainExperimentBridge.submitExperimentState({
        moduleId: "poster",
        state
      });
    }

    async function hydrateKnowledgeTimeline() {
      const submissionApi = window.BrainExperimentSubmission;
      const session = window.BrainPlatform?.identity?.readStudentSession?.() || {};
      if (!submissionApi?.getLatest || session.isGuest || !session.sessionToken) return;
      const before = knowledgeAssessmentApi.normalizeTimeline(state.knowledgeAssessment);
      const sources = [before, knowledgeAssessmentApi.readTimeline()];
      for (const experimentId of ["screening", "memory", "nback", "interference", "strategies"]) {
        try {
          const result = await submissionApi.getLatest(experimentId);
          if (result?.ok) sources.push(result.submission?.knowledgeAssessment, result.state?.knowledgeAssessment);
        } catch (error) {
          // Missing or offline historical stages remain explicitly unavailable.
        }
      }
      const merged = knowledgeAssessmentApi.mergeTimelines(...sources);
      const beforeIds = knowledgeAssessmentApi.stages.map((stage) => before[stage]?.assessmentId || "").join("|");
      const afterIds = knowledgeAssessmentApi.stages.map((stage) => merged[stage]?.assessmentId || "").join("|");
      if (beforeIds !== afterIds) {
        state.knowledgeAssessment = knowledgeAssessmentApi.writeTimeline(merged);
        saveState();
        renderApp();
      }
    }

    function getScore(indicatorKey, groupNumber) {
      return Number(state.scores[`${indicatorKey}_${groupNumber}`] || 0);
    }

    function summarizeScores() {
      return getPosterGroups().map((group, groupIndex) => {
        const groupNumber = groupIndex + 1;
        const dimensionScores = {};
        indicators.forEach((indicator) => {
          dimensionScores[indicator.dimension] = (dimensionScores[indicator.dimension] || 0) + getScore(indicator.key, groupNumber);
        });
        const total = Object.values(dimensionScores).reduce((sum, value) => sum + value, 0);
        return { group, total, dimensionScores };
      });
    }

    function getTopGroup() {
      const summary = summarizeScores();
      const max = Math.max(...summary.map((item) => item.total));
      if (!max) return "";
      return summary.filter((item) => item.total === max).map((item) => item.group).join("、");
    }

    function exportExcel() {
      const scoreSummary = summarizeScores();
      const scoreRows = [];
      indicators.forEach((indicator) => {
        getPosterGroups().forEach((group, groupIndex) => {
          scoreRows.push([indicator.dimension, indicator.title, group, getScore(indicator.key, groupIndex + 1) || ""]);
        });
      });
      const sheets = [
        ["基本信息", [
          ["项目", "内容"],
          ["模块", "海报制作与分享交流"],
          ["学号", state.studentId],
          ["姓名", state.studentName || ""],
          ["班级", state.className || ""],
          ["小组", state.groupName || state.groupId || ""],
          ["学生姓名", state.studentName || ""],
          ["学生年龄", state.studentAge || ""],
          ["学生编号", state.studentId],
          ["小组编号", state.groupId],
          ["导出时间", new Date().toLocaleString()]
        ]],
        ["校园委托档案", [
          ["字段", "内容"],
          ["备选委托", state.commission.source],
          ["委托人称呼", state.commission.client],
          ["真实事件或委托人的原话", state.commission.original],
          ["具体任务与时间", state.commission.task],
          ["出错环节", state.commission.difficulty],
          ["时间与条件限制", state.commission.limits]
        ]],
        ["海报初步方案", [
          ["字段", "内容"],
          ["研究问题", state.fields.researchQuestion],
          ["研究假设", state.fields.hypothesis],
          ["研究计划", state.fields.researchPlan],
          ["实验数据呈现方式", state.fields.dataDisplay],
          ["研究结论", state.fields.conclusion],
          ["反思不足", state.fields.limitation],
          ["生活启示", state.fields.lifeApplication],
          ["小组分工", state.fields.division]
        ]],
        ["制作记录", [
          ["字段", "内容"],
          ["版式草图说明", state.fields.layoutSketch],
          ["主要图表类型", state.fields.chartPlan],
          ["AI辅助建议记录", state.fields.aiSupport],
          ["图画图标或素材计划", state.fields.visualPlan]
        ]],
        ["分享交流记录", [
          ["学号", "姓名", "班级", "小组", "字段", "内容"],
          [state.studentId, state.studentName || "", state.className || "", state.groupName || state.groupId || "", "小小讲解员", state.fields.presenter],
          [state.studentId, state.studentName || "", state.className || "", state.groupName || state.groupId || "", "小小讲解员学生编号", state.fields.presenterStudentId],
          [state.studentId, state.studentName || "", state.className || "", state.groupName || state.groupId || "", "讲解要点", state.fields.speakingPoints],
          ...state.qaRecords.flatMap((item, index) => [
            [item.studentId || state.studentId, item.studentName || state.studentName || "", item.className || state.className || "", item.groupName || item.groupId || state.groupName || state.groupId || "", `问题${index + 1}`, item.question],
            [item.studentId || state.studentId, item.studentName || state.studentName || "", item.className || state.className || "", item.groupName || item.groupId || state.groupName || state.groupId || "", `回答${index + 1}`, item.answer]
          ])
        ]],
        ["提问记录", [
          ["学号", "姓名", "班级", "小组", "序号", "提问对象", "具体问题", "对方回答摘要"],
          ...state.questions.map((item, index) => [item.studentId || state.studentId, item.studentName || state.studentName || "", item.className || state.className || "", item.groupName || item.groupId || state.groupName || state.groupId || "", index + 1, item.group, item.question, item.answer])
        ]],
        ["海报评分明细", [
          ["学号", "姓名", "班级", "小组", "评价维度", "具体指标", "被评分小组", "得分", "记录时间"],
          ...(state.scoreRecords || []).map((record) => [record.studentId || state.studentId, record.studentName || state.studentName || "", record.className || state.className || "", record.groupName || record.groupId || state.groupName || state.groupId || "", record.dimension, record.title, record.targetGroup, record.score, record.createdAt]),
          ...scoreRows.map((row) => [state.studentId, state.studentName || "", state.className || "", state.groupName || state.groupId || "", ...row, ""])
        ]],
        ["各组汇总得分", [
          ["小组", "科学性", "美观性", "创意性", "交流展示", "总分"],
          ...scoreSummary.map((item) => [
            item.group,
            item.dimensionScores["科学性"] || 0,
            item.dimensionScores["美观性"] || 0,
            item.dimensionScores["创意性"] || 0,
            item.dimensionScores["交流展示"] || 0,
            item.total
          ]),
          ["总分最高组", getTopGroup(), "", "", "", ""],
          ["我心中的最优海报", state.fields.bestPoster, "", "", "", ""]
        ]],
        ["总结反思", [
          ["字段", "内容"],
          ["本次交流最大的收获", state.fields.reflectionGain],
          ["海报还可以怎样改进", state.fields.reflectionImprove],
          ["小组合作反思", state.fields.teamReflection],
          ["今后如何应用探究成果", state.fields.nextUse]
        ]]
      ];
      const html = `<html><head><meta charset="utf-8"></head><body>${sheets.map(([title, rows]) => `
        <h2>${escapeHtml(title)}</h2>
        <table border="1">${rows.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</table><br>
      `).join("")}</body></html>`;
      const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `海报制作_${state.groupId}_${state.studentId}.xls`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    document.getElementById("homeBtn").addEventListener("click", () => { location.href = "index.html"; });
    document.getElementById("devModeBtn").addEventListener("click", enableDeveloperMode);
    const exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportExcel);
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("确定要清空本模块在当前浏览器中保存的数据吗？")) return;
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      commissionOpen = true;
      renderApp();
    });

    window.matchMedia("(max-width: 680px)").addEventListener("change", () => {
      if (!document.getElementById("archiveDialog").open) renderApp();
    });

    renderApp();
    hydrateKnowledgeTimeline();
    window.StudentMemory?.init({ experimentId: "poster" });
    window.LearningDiagnosis?.init({ experimentId: "poster" });
  </script>
