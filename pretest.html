<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆侦探资格审查</title>
  <style>
    :root {
      --bg: #eef5fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5a6b7f;
      --line: #d9e5f1;
      --primary: #2563eb;
      --primary-dark: #1745a3;
      --primary-soft: #e8f0ff;
      --success: #11845b;
      --warning: #9a5b00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(238, 245, 251, 0.94), rgba(223, 234, 246, 0.96)),
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 34rem);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
    }

    .topbar-inner,
    .main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 68px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand span {
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand strong {
      font-size: 22px;
      line-height: 1.15;
    }

    .main {
      display: grid;
      gap: 18px;
      padding: 24px 0 36px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 36px rgba(30, 47, 75, 0.09);
    }

    .panel-head {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h1,
    .panel-head h2 {
      margin: 0;
      line-height: 1.2;
    }

    .panel-head p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .panel-body { padding: 20px 22px 22px; }

    .identity-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      font: inherit;
    }

    input:focus {
      border-color: #8ab4ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input[readonly] {
      background: #f7faff;
      color: var(--muted);
      cursor: not-allowed;
    }

    .survey-intro {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid #cfe0ff;
      border-radius: 8px;
      background: var(--primary-soft);
    }

    .survey-intro h2 {
      margin: 0;
      font-size: 20px;
    }

    .survey-intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .survey-card {
      display: grid;
      gap: 16px;
    }

    .survey-item {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }

    .survey-item:first-child { border-top: 0; }

    .survey-item p {
      margin: 0 0 12px;
      font-weight: 900;
      line-height: 1.55;
    }

    .survey-scale {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .survey-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .survey-option-card {
      display: grid;
      place-items: center;
      min-height: 66px;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
    }

    .survey-option-card:hover {
      transform: translateY(-1px);
      border-color: #9dbdff;
    }

    .survey-option.is-selected .survey-option-card {
      border-color: var(--primary);
      background: #eff5ff;
      color: var(--primary-dark);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.13);
    }

    .survey-score {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .survey-label {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .summary > div {
      min-height: 82px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbff;
    }

    .summary strong {
      display: block;
      font-size: 24px;
      color: var(--primary-dark);
    }

    .summary span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font: inherit;
      cursor: pointer;
    }

    .btn.secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .status {
      min-height: 24px;
      margin: 0;
      color: var(--warning);
      font-weight: 900;
    }

    .status.is-complete { color: var(--success); }

    @media (max-width: 760px) {
      .topbar-inner,
      .main { width: min(100% - 24px, 1120px); }
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 12px 0; }
      .top-actions { width: 100%; align-items: stretch; flex-direction: column; }
      .identity-grid,
      .survey-scale,
      .summary { grid-template-columns: 1fr; }
      .actions { align-items: stretch; flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="assets/experiment-theme.css">
  <script src="assets/experiment-theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span>Detective Qualification</span>
        <strong>记忆侦探资格审查</strong>
      </div>
      <div class="top-actions">
        <div class="theme-switch" role="group" aria-label="主题模式">
          <button class="theme-option" type="button" data-theme-option="science" aria-label="切换到科技模式" aria-pressed="true">科技模式</button>
          <button class="theme-option" type="button" data-theme-option="archive" aria-label="切换到档案模式" aria-pressed="false">档案模式</button>
        </div>
        <button class="btn secondary" type="button" id="homeBtn">返回首页</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel-head">
        <h1>记忆侦探资格审查</h1>
        <p>先完成基础挑战，获得进入案件调查的资格。答题会自动保存在当前浏览器中。</p>
      </div>
      <div class="panel-body">
        <div class="identity-grid">
          <label>学生姓名
            <input id="studentName" type="text" autocomplete="off" readonly>
          </label>
          <label>班级
            <input id="className" type="text" autocomplete="off" readonly>
          </label>
          <label>学生编号
            <input id="studentId" type="text" autocomplete="off" readonly>
          </label>
          <label>小组编号
            <input id="groupId" type="text" autocomplete="off" readonly>
          </label>
        </div>
      </div>
    </section>

    <section class="panel" id="knowledgePretestPanel">
      <div class="panel-body">
        <div class="survey-intro">
          <h2>记忆知识前测</h2>
          <p>这里有来自四次探究活动的40道知识题。题目会随机排列，结果只用于比较学习前后的变化，不影响你的成绩。</p>
        </div>
        <div id="knowledgePretestRoot"></div>
        <div class="actions" id="knowledgePretestActions">
          <p class="status" id="knowledgePretestStatus" aria-live="polite"></p>
          <button class="btn secondary" type="button" id="knowledgePrevBtn">上一页</button>
          <button class="btn secondary" type="button" id="knowledgeNextBtn">下一页</button>
          <button class="btn" type="button" id="knowledgeSubmitBtn">提交知识前测</button>
        </div>
      </div>
    </section>

    <section class="panel" id="metaSurveyPanel">
      <div class="panel-body">
        <div class="survey-intro">
          <h2>记忆相关知识元认知情况调查问卷</h2>
          <p>亲爱的同学们：你们好！本次调查是为了了解你目前与记忆相关知识的元认知情况，问卷结果仅用于本次学习活动的数据分析，不会影响你的成绩或其他学习活动，也不会泄露你的个人信息。请根据真实想法选择最符合的一项。</p>
        </div>
        <div id="surveyRoot"></div>
        <div class="summary" id="summary"></div>
        <div class="actions">
          <p class="status" id="status"></p>
          <button class="btn secondary" type="button" id="resetBtn">重新作答</button>
          <button class="btn" type="button" id="completeBtn">完成资格审查</button>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/experiment-registry.js"></script>
  <script src="assets/knowledge-question-bank.js"></script>
  <script src="assets/platform-core.js"></script>
  <script src="auth.js"></script>
  <script src="assets/experiment-uploader.js"></script>
  <script src="assets/experiment-bridge.js"></script>
  <script src="assets/experiment-integration.js"></script>
  <script>
    const currentStudent = checkLogin();
    const CONTEXT_KEY = window.BrainPlatform.storage.migrateScopedJson(
      window.BrainPlatform.config.storageKeys.inquiryContext
    );
    const PRETEST_KEY = window.BrainPlatform.storage.migrateScopedJson(
      window.BrainPlatform.config.storageKeys.pretest
    );
    const QUALIFICATION_KEY = window.BrainPlatform.storage.migrateScopedJson(
      window.BrainPlatform.config.storageKeys.qualification
    );
    const knowledgeBank = window.BrainKnowledgeQuestionBank;
    const KNOWLEDGE_PAGE_SIZE = 10;

    const surveyDef = {
      title: "记忆相关知识元认知情况调查问卷",
      scale: [1, 2, 3, 4, 5],
      anchors: "1=完全否，2=较少，3=一般，4=较多，5=完全是",
      labels: { 1: "完全否", 2: "较少", 3: "一般", 4: "较多", 5: "完全是" },
      note: "请选择最符合你真实想法的一项。",
      items: [
        "我能够理解老师所讲的有关记忆的知识。",
        "这些有关记忆的知识对我很有用，我会继续使用。",
        "在学习这些知识时，我会与现实生活进行联系。",
        "我会根据今天学到的知识反思之前的学习过程中做的不足的地方并加以改进。",
        "在学习这些知识时，我会联想到之前学过或了解过的知识。"
      ]
    };

    const inputs = {
      studentName: document.getElementById("studentName"),
      className: document.getElementById("className"),
      studentId: document.getElementById("studentId"),
      groupId: document.getElementById("groupId")
    };
    const surveyRoot = document.getElementById("surveyRoot");
    const knowledgePretestRoot = document.getElementById("knowledgePretestRoot");
    const knowledgePretestStatus = document.getElementById("knowledgePretestStatus");
    const metaSurveyPanel = document.getElementById("metaSurveyPanel");
    const summaryRoot = document.getElementById("summary");
    const status = document.getElementById("status");

    let state = loadState();
    renderApp();

    function loadState() {
      const context = readJson(CONTEXT_KEY) || {};
      const saved = readJson(PRETEST_KEY) || readJson(QUALIFICATION_KEY) || {};
      const identity = getStudentIdentityFields();
      const legacyQualification = Boolean(saved.legacyQualification || (saved.completed && !saved.knowledgePretest));
      return {
        studentName: identity.studentName || saved.studentName || context.studentName || "",
        studentAge: saved.studentAge || context.studentAge || "",
        className: identity.className || saved.className || context.className || "",
        studentId: identity.studentId || saved.studentId || context.studentId || "",
        groupId: identity.groupName || saved.groupId || context.groupId || "",
        groupName: identity.groupName || saved.groupName || context.groupName || "",
        answers: Object.assign({}, saved.answers || saved.preMeta || {}),
        knowledgePretest: normalizeKnowledgePretest(saved.knowledgePretest),
        legacyQualification,
        completed: Boolean(saved.completed),
        completedAt: saved.completedAt || ""
      };
    }

    function normalizeKnowledgePretest(value) {
      const source = value && typeof value === "object" ? value : {};
      const validIds = new Set(knowledgeBank.questions.map((item) => item.questionId));
      const incomingOrder = Array.isArray(source.questionOrder)
        ? source.questionOrder.filter((id) => validIds.has(id))
        : [];
      const questionOrder = incomingOrder.length === knowledgeBank.questions.length
        ? incomingOrder
        : shuffleQuestionIds(knowledgeBank.questions.map((item) => item.questionId));
      const answersByQuestionId = {};
      Object.entries(source.answersByQuestionId || {}).forEach(([questionId, answer]) => {
        if (validIds.has(questionId) && ["A", "B", "C", "D"].includes(String(answer))) {
          answersByQuestionId[questionId] = String(answer);
        }
      });
      return {
        schemaVersion: 1,
        questionOrder,
        answersByQuestionId,
        currentPage: Math.max(0, Math.min(3, Number(source.currentPage) || 0)),
        submitted: Boolean(source.submitted),
        submittedAt: source.submittedAt || "",
        scoresByExperiment: source.scoresByExperiment && typeof source.scoresByExperiment === "object"
          ? source.scoresByExperiment
          : {}
      };
    }

    function shuffleQuestionIds(ids) {
      const shuffled = ids.slice();
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const values = new Uint32Array(1);
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          window.crypto.getRandomValues(values);
        } else {
          values[0] = Math.floor(Math.random() * 0xffffffff);
        }
        const target = values[0] % (index + 1);
        [shuffled[index], shuffled[target]] = [shuffled[target], shuffled[index]];
      }
      return shuffled;
    }

    function getStudentIdentityFields() {
      const student = currentStudent || window.BrainPlatform.identity.readStudentSession() || {};

      if (student.isGuest) {
        return {
          studentName: "游客",
          studentId: "guest",
          className: "游客模式",
          groupName: "本地体验",
          isGuest: true
        };
      }

      return {
        studentName: student.name || student.studentName || "",
        studentId: student.studentId || "",
        className: student.class || student.className || "",
        groupName: student.group || student.groupName || student.groupId || ""
      };
    }

    function readJson(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null");
      } catch (event) {
        localStorage.removeItem(key);
        return null;
      }
    }

    function saveIdentity() {
      Object.assign(state, getStudentIdentityFields());
      if (state.groupName) state.groupId = state.groupName;
      Object.keys(inputs).forEach((key) => {
        inputs[key].value = state[key] || "";
      });
      localStorage.setItem(CONTEXT_KEY, JSON.stringify({
        studentName: state.studentName,
        studentAge: state.studentAge,
        className: state.className,
        studentId: state.studentId,
        groupId: state.groupId,
        groupName: state.groupName,
        savedAt: new Date().toISOString()
      }));
    }

    function saveState() {
      saveIdentity();
      const summary = summarize();
      const payload = {
        studentName: state.studentName,
        studentAge: state.studentAge,
        className: state.className,
        studentId: state.studentId,
        groupId: state.groupId,
        groupName: state.groupName,
        answers: state.answers,
        preMeta: state.answers,
        knowledgePretest: state.knowledgePretest,
        legacyQualification: state.legacyQualification,
        answered: summary.answered,
        total: summary.total,
        average: summary.average,
        complete: summary.complete,
        completed: state.completed,
        completedAt: state.completedAt,
        savedAt: new Date().toISOString()
      };
      localStorage.setItem(PRETEST_KEY, JSON.stringify(payload));
      localStorage.setItem(QUALIFICATION_KEY, JSON.stringify(payload));
    }

    function renderApp() {
      Object.keys(inputs).forEach((key) => {
        inputs[key].value = state[key] || "";
        inputs[key].addEventListener("input", () => {
          saveState();
          renderSummary();
        });
      });
      renderKnowledgePretest();
      renderSurvey();
      renderSummary();
      document.getElementById("homeBtn").addEventListener("click", () => {
        saveState();
        location.href = "index.html";
      });
      document.getElementById("completeBtn").addEventListener("click", completePretest);
      document.getElementById("resetBtn").addEventListener("click", resetPretest);
      document.getElementById("knowledgePrevBtn").addEventListener("click", () => changeKnowledgePage(-1));
      document.getElementById("knowledgeNextBtn").addEventListener("click", () => changeKnowledgePage(1));
      document.getElementById("knowledgeSubmitBtn").addEventListener("click", submitKnowledgePretest);
    }

    function getKnowledgeQuestion(questionId) {
      return knowledgeBank.questions.find((item) => item.questionId === questionId) || null;
    }

    function renderKnowledgePretest() {
      const pretest = state.knowledgePretest;
      const start = pretest.currentPage * KNOWLEDGE_PAGE_SIZE;
      const pageIds = pretest.questionOrder.slice(start, start + KNOWLEDGE_PAGE_SIZE);
      const answeredCount = Object.keys(pretest.answersByQuestionId).length;
      const locked = pretest.submitted;
      knowledgePretestRoot.innerHTML = '<section class="survey-card">' +
        '<div><strong>第 ' + (pretest.currentPage + 1) + ' / 4 页</strong><p>已完成 ' + answeredCount + ' / 40 题。提交后答案将锁定。</p></div>' +
        pageIds.map((questionId, pageIndex) => {
          const item = getKnowledgeQuestion(questionId);
          if (!item) return "";
          const selected = pretest.answersByQuestionId[questionId] || "";
          return '<div class="survey-item"><p>' + (start + pageIndex + 1) + ". " + escapeHtml(item.question) + '</p>' +
            '<div class="survey-scale" role="radiogroup" aria-label="' + escapeHtml(item.question) + '">' +
            Object.entries(item.options).map(([key, label]) => (
              '<label class="survey-option ' + (selected === key ? "is-selected" : "") + '">' +
              '<input type="radio" name="knowledge-' + questionId + '" data-pretest-question="' + questionId +
              '" value="' + key + '" ' + (selected === key ? "checked" : "") + (locked ? " disabled" : "") + '>' +
              '<span class="survey-option-card"><span class="survey-score">' + key + '</span><span class="survey-label">' +
              escapeHtml(label) + '</span></span></label>'
            )).join("") + '</div></div>';
        }).join("") + '</section>';

      knowledgePretestRoot.querySelectorAll("[data-pretest-question]").forEach((input) => {
        input.addEventListener("change", () => {
          if (state.knowledgePretest.submitted) return;
          state.knowledgePretest.answersByQuestionId[input.dataset.pretestQuestion] = input.value;
          saveState();
          renderKnowledgePretest();
        });
      });

      document.getElementById("knowledgePrevBtn").disabled = pretest.currentPage === 0;
      document.getElementById("knowledgeNextBtn").disabled = pretest.currentPage === 3;
      document.getElementById("knowledgeSubmitBtn").disabled = locked;
      document.getElementById("knowledgeSubmitBtn").textContent = locked ? "知识前测已提交" : "提交知识前测";
      knowledgePretestStatus.textContent = locked
        ? "知识前测已锁定，可以继续完成元认知问卷。"
        : state.legacyQualification
          ? "你已完成旧版资格审查，本知识前测可以自愿补做。"
          : "完成并提交40题后，才能继续元认知问卷。";
      metaSurveyPanel.hidden = !pretest.submitted && !state.legacyQualification;
    }

    function changeKnowledgePage(offset) {
      state.knowledgePretest.currentPage = Math.max(0, Math.min(3, state.knowledgePretest.currentPage + offset));
      saveState();
      renderKnowledgePretest();
      document.getElementById("knowledgePretestPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function submitKnowledgePretest() {
      const pretest = state.knowledgePretest;
      if (pretest.submitted) return;
      const unanswered = pretest.questionOrder.filter((id) => !pretest.answersByQuestionId[id]);
      if (unanswered.length) {
        pretest.currentPage = Math.floor(pretest.questionOrder.indexOf(unanswered[0]) / KNOWLEDGE_PAGE_SIZE);
        renderKnowledgePretest();
        knowledgePretestStatus.textContent = "还有 " + unanswered.length + " 题未完成，请补充后再提交。";
        return;
      }
      pretest.scoresByExperiment = knowledgeBank.scoreAnswers(pretest.answersByQuestionId);
      pretest.submitted = true;
      pretest.submittedAt = new Date().toISOString();
      state.completed = false;
      state.completedAt = "";
      saveState();
      renderKnowledgePretest();
      renderSurvey();
      renderSummary();
    }

    function renderSurvey() {
      if (!state.knowledgePretest.submitted && !state.legacyQualification) {
        surveyRoot.innerHTML = "";
        return;
      }
      surveyRoot.innerHTML = '<section class="survey-card">' +
        '<div><strong>' + surveyDef.title + '</strong><p>' + surveyDef.note + '</p><p>' + surveyDef.anchors + '</p></div>' +
        surveyDef.items.map((item, index) => {
          const itemKey = "q" + (index + 1);
          return '<div class="survey-item"><p>' + (index + 1) + ". " + escapeHtml(item) + '</p>' +
            '<div class="survey-scale" role="radiogroup" aria-label="' + escapeHtml(item) + '">' +
              surveyDef.scale.map((score) => {
                const checked = Number(state.answers[itemKey]) === score;
                return '<label class="survey-option ' + (checked ? "is-selected" : "") + '">' +
                  '<input type="radio" name="' + itemKey + '" data-question="' + itemKey + '" value="' + score + '" ' + (checked ? "checked" : "") + '>' +
                  '<span class="survey-option-card"><span class="survey-score">' + score + '</span><span class="survey-label">' + surveyDef.labels[score] + '</span></span>' +
                '</label>';
              }).join("") +
            '</div></div>';
        }).join("") +
      '</section>';

      surveyRoot.querySelectorAll("[data-question]").forEach((input) => {
        input.addEventListener("change", () => {
          state.answers[input.dataset.question] = Number(input.value);
          state.completed = false;
          state.completedAt = "";
          saveState();
          renderSurvey();
          renderSummary();
        });
      });
    }

    function summarize() {
      const values = surveyDef.items
        .map((_, index) => Number(state.answers["q" + (index + 1)] || 0))
        .filter(Boolean);
      const total = values.reduce((sum, value) => sum + value, 0);
      return {
        answered: values.length,
        total,
        average: values.length ? Number((total / values.length).toFixed(2)) : 0,
        complete: values.length === surveyDef.items.length
      };
    }

    function renderSummary() {
      const summary = summarize();
      summaryRoot.innerHTML = [
        ["知识前测", state.knowledgePretest.submitted ? "已提交" : Object.keys(state.knowledgePretest.answersByQuestionId).length + "/40"],
        ["元认知问卷", summary.answered + "/" + surveyDef.items.length]
      ].map((item) => '<div><strong>' + item[1] + '</strong><span>' + item[0] + '</span></div>').join("");
      status.classList.toggle("is-complete", state.completed);
      status.textContent = state.completed ? "资格审查已完成，结果文件已自动导出，请妥善保存。" : "";
    }

    function completePretest() {
      saveIdentity();
      const summary = summarize();
      if (!state.knowledgePretest.submitted && !state.legacyQualification) {
        alert("请先完成并提交40道知识前测。");
        return;
      }
      if (!summary.complete) {
        alert("请完成所有题目后再提交资格审查。");
        status.classList.remove("is-complete");
        status.textContent = "请完成所有题目后再提交资格审查。";
        return;
      }
      state.completed = true;
      state.completedAt = state.completedAt || new Date().toISOString();
      saveState();
      submitScreeningRecord("completeScreening");
      exportExcel();
      renderSummary();
    }

    function buildScreeningSnapshot() {
      const summary = summarize();
      return {
        studentName: state.studentName,
        studentAge: state.studentAge,
        className: state.className,
        studentId: state.studentId,
        groupId: state.groupId,
        groupName: state.groupName || state.groupId,
        surveyTitle: surveyDef.title,
        answers: state.answers,
        items: surveyDef.items,
        labels: surveyDef.labels,
        knowledgePretest: state.knowledgePretest,
        legacyQualification: state.legacyQualification,
        answered: summary.answered,
        total: summary.total,
        average: summary.average,
        complete: summary.complete,
        completed: state.completed,
        completedAt: state.completedAt,
        savedAt: new Date().toISOString()
      };
    }

    function submitScreeningRecord(submitAction) {
      if (typeof window.uploadExperimentRecords !== "function") return;
      const snapshot = buildScreeningSnapshot();
      const submittedAt = snapshot.completedAt || new Date().toISOString();
      return window.BrainExperimentBridge.submitState({
        moduleId: "screening",
        snapshot,
        submitAction,
        submittedAt
      });
    }

    function resetPretest() {
      if (!confirm("确定要清空本页资格审查答题记录吗？")) return;
      state.answers = {};
      state.completed = false;
      state.completedAt = "";
      saveState();
      renderSurvey();
      renderSummary();
    }

    function exportExcel() {
      saveState();
      const saved = readJson(PRETEST_KEY) || readJson(QUALIFICATION_KEY) || {};
      const answers = saved.answers || saved.preMeta || state.answers || {};
      const completed = Boolean(saved.completed || saved.complete);
      const completedAt = saved.completedAt || state.completedAt || "";
      const summary = summarizeAnswers(answers);
      const savedKnowledgePretest = saved.knowledgePretest || state.knowledgePretest;

      if (!completed || !summary.complete) {
        alert("请先完成资格审查，再导出结果。");
        return;
      }

      const submittedAt = completedAt ? new Date(completedAt).toLocaleString() : "";
      const identityRows = [
        ["学生姓名", saved.studentName || state.studentName || ""],
        ["学生年龄", saved.studentAge || state.studentAge || ""],
        ["班级", saved.className || state.className || ""],
        ["学生编号", saved.studentId || state.studentId || ""],
        ["小组编号", saved.groupName || saved.groupId || state.groupName || state.groupId || ""],
        ["提交时间", submittedAt]
      ];
      const answerRows = surveyDef.items.map((item, index) => {
        const score = Number(answers["q" + (index + 1)] || 0);
        return [String(index + 1), item, surveyDef.labels[score] || "", score || ""];
      });
      const knowledgeRows = savedKnowledgePretest.submitted
        ? savedKnowledgePretest.questionOrder.map((questionId, index) => {
            const item = getKnowledgeQuestion(questionId);
            const selected = savedKnowledgePretest.answersByQuestionId[questionId] || "";
            return [
              String(index + 1),
              item ? item.experimentId : "",
              item ? item.question : "",
              selected,
              item ? item.options[selected] || "" : ""
            ];
          })
        : [];
      const sheets = [
        ["基本信息", [["项目", "内容"], ...identityRows]],
        ...(knowledgeRows.length ? [["知识前测", [
          ["题号", "所属实验", "题目", "选择", "选择内容"],
          ...knowledgeRows,
          ...Object.entries(savedKnowledgePretest.scoresByExperiment || {}).map(([experimentId, score]) => [
            "分实验得分", experimentId, "", score.correctCount + "/" + score.totalCount, score.score
          ])
        ]]] : []),
        ["资格审查结果", [
          ["题号", "题目", "作答结果", "每题得分"],
          ...answerRows,
          ["合计", "总分", "", summary.total],
          ["合计", "均分", "", summary.average],
          ["合计", "提交时间", "", submittedAt]
        ]]
      ];

      const html = '<html><head><meta charset="utf-8"></head><body>' +
        sheets.map(([title, rows]) =>
          '<h2>' + escapeHtml(title) + '</h2><table border="1">' +
          rows.map((row) => '<tr>' + row.map((cell) => '<td>' + escapeHtml(cell) + '</td>').join("") + '</tr>').join("") +
          '</table><br>'
        ).join("") +
      '</body></html>';
      const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const studentId = sanitizeFilename(saved.studentId || state.studentId || "未编号");
      link.href = url;
      link.download = "记忆侦探资格审查结果_" + studentId + ".xlsx";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function summarizeAnswers(answers) {
      const values = surveyDef.items
        .map((_, index) => Number(answers["q" + (index + 1)] || 0))
        .filter(Boolean);
      const total = values.reduce((sum, value) => sum + value, 0);
      return {
        answered: values.length,
        total,
        average: values.length ? Number((total / values.length).toFixed(2)) : 0,
        complete: values.length === surveyDef.items.length
      };
    }

    function sanitizeFilename(value) {
      return String(value || "未编号").replace(/[\\/:*?"<>|]/g, "_").trim() || "未编号";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
