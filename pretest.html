<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆侦探资格审查</title>
  <style>
    :root {
      --bg: #eef5fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5a6b7f;
      --line: #d9e5f1;
      --primary: #2563eb;
      --primary-dark: #1745a3;
      --primary-soft: #e8f0ff;
      --success: #11845b;
      --warning: #9a5b00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(238, 245, 251, 0.94), rgba(223, 234, 246, 0.96)),
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 34rem);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .main {
      width: min(1920px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 68px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand span {
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand strong {
      font-size: 22px;
      line-height: 1.15;
    }

    .main {
      display: grid;
      gap: 12px;
      padding: 4px 0 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 36px rgba(30, 47, 75, 0.09);
    }

    .panel-head {
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h1,
    .panel-head h2 {
      margin: 0;
      line-height: 1.2;
    }

    .panel-head p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .panel-body { padding: 20px 22px 22px; }

    [hidden] { display: none !important; }

    .identity-panel .panel-head { display: none; }
    .identity-panel { width: min(1120px, 100%); margin: 0 auto; }
    .identity-panel .panel-body { padding: 8px 16px 10px; }
    .identity-panel input { min-height: 34px; padding: 6px 9px; }

    .assessment-panel .panel-body {
      display: flex;
      flex-direction: column;
      min-height: 472px;
      padding: 14px 18px 16px;
    }

    #knowledgePretestRoot,
    #surveyRoot { flex: 1; }

    .assessment-page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .assessment-page-head strong { font-size: 18px; }

    .assessment-page-progress {
      flex: 0 0 auto;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
    }

    #knowledgePretestRoot .assessment-page-progress {
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
    }

    #knowledgePretestRoot .assessment-page-head strong { font-size: 20px; }

    .assessment-page-content { animation: assessment-page-fade-in 150ms ease both; }
    .assessment-page-content.is-leaving { animation: assessment-page-fade-out 150ms ease both; }

    @keyframes assessment-page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes assessment-page-fade-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .identity-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: var(--ink);
      font: inherit;
    }

    input:focus {
      border-color: #8ab4ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input[readonly] {
      background: #f7faff;
      color: var(--muted);
      cursor: not-allowed;
    }

    .survey-intro {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid #cfe0ff;
      border-radius: 8px;
      background: var(--primary-soft);
    }

    .survey-intro h2 {
      margin: 0;
      font-size: 18px;
    }

    .survey-intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .survey-card {
      display: grid;
      gap: 8px;
    }

    .survey-page-note {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .survey-item {
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }

    .survey-item:first-child { border-top: 0; }

    .survey-item p {
      margin: 0 0 7px;
      font-weight: 900;
      line-height: 1.4;
    }

    .survey-scale {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .survey-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .survey-option-card {
      display: grid;
      place-items: center;
      min-height: 50px;
      padding: 7px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
    }

    .survey-option-card:hover {
      transform: translateY(-1px);
      border-color: #9dbdff;
    }

    .survey-option.is-selected .survey-option-card {
      border-color: var(--primary);
      background: #eff5ff;
      color: var(--primary-dark);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.13);
    }

    .survey-score {
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .survey-label {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .summary > div {
      min-height: 62px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbff;
    }

    .summary strong {
      display: block;
      font-size: 19px;
      color: var(--primary-dark);
    }

    .summary span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      font: inherit;
      cursor: pointer;
    }

    .btn.secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .status {
      min-height: 24px;
      margin: 0;
      color: var(--warning);
      font-weight: 900;
    }

    .status.is-complete { color: var(--success); }

    .assessment-actions {
      min-height: 52px;
      align-items: center;
    }

    .assessment-actions .status { margin-right: auto; }

    .knowledge-question-card {
      padding: 20px 22px 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 14px 28px rgba(30, 47, 75, 0.06);
    }

    .knowledge-question-number,
    .knowledge-question-text { margin: 0; }

    .knowledge-question-number {
      font-size: 19px;
      font-weight: 900;
    }

    .knowledge-question-text {
      margin-top: 14px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.5;
    }

    .knowledge-options {
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .knowledge-options .survey-option {
      position: relative;
      cursor: pointer;
    }

    .knowledge-options .survey-option input {
      top: 50%;
      left: 18px;
      width: 20px;
      height: 20px;
      opacity: 1;
      pointer-events: none;
      transform: translateY(-50%);
      accent-color: var(--primary);
    }

    .knowledge-options .survey-option-card {
      display: grid;
      grid-template-columns: 30px 34px minmax(0, 1fr);
      place-items: center start;
      min-height: 64px;
      padding: 10px 18px;
      border-radius: 10px;
    }

    .knowledge-options .survey-score {
      grid-column: 2;
      margin: 0;
      font-size: 18px;
    }

    .knowledge-options .survey-label {
      grid-column: 3;
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
      text-align: left;
    }

    html[data-theme="archive"] .knowledge-question-card,
    html[data-theme="archive"] .knowledge-options .survey-option-card {
      border-color: #d8bd91;
      border-radius: 10px;
      background: #fbf7ef;
    }

    html[data-theme="archive"] .knowledge-question-card { background: #fffdf8; }

    @media (prefers-reduced-motion: reduce) {
      .assessment-page-content,
      .assessment-page-content.is-leaving { animation: none; }
    }

    @media (max-width: 760px) {
      .topbar-inner,
      .main { width: min(100% - 24px, 1120px); }
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 12px 0; }
      .top-actions { width: 100%; align-items: stretch; flex-direction: column; }
      .identity-grid,
      .survey-scale,
      .summary { grid-template-columns: 1fr; }
      .assessment-panel .panel-body { min-height: 0; }
      .survey-page-note { align-items: flex-start; flex-direction: column; }
      .knowledge-question-card { padding: 16px 14px; }
      .knowledge-options .survey-option-card { min-height: 56px; padding-right: 12px; }
      .actions { align-items: stretch; flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="assets/experiment-theme.css">
  <script src="assets/experiment-theme.js"></script>
</head>
<body class="qualification-page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span>Detective Qualification</span>
        <strong>记忆侦探资格审查</strong>
      </div>
      <div class="top-actions">
        <div class="theme-switch" role="group" aria-label="主题模式">
          <button class="theme-option" type="button" data-theme-option="science" aria-label="切换到科技模式" aria-pressed="true">科技模式</button>
          <button class="theme-option" type="button" data-theme-option="archive" aria-label="切换到档案模式" aria-pressed="false">档案模式</button>
        </div>
        <button class="btn secondary" type="button" id="homeBtn">返回首页</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="panel identity-panel">
      <div class="panel-head">
        <h1>记忆侦探资格审查</h1>
        <p>先完成基础挑战，获得进入案件调查的资格。答题会自动保存在当前浏览器中。</p>
      </div>
      <div class="panel-body">
        <div class="identity-grid">
          <label>学生姓名
            <input id="studentName" type="text" autocomplete="off" readonly>
          </label>
          <label>班级
            <input id="className" type="text" autocomplete="off" readonly>
          </label>
          <label>学生编号
            <input id="studentId" type="text" autocomplete="off" readonly>
          </label>
          <label>小组编号
            <input id="groupId" type="text" autocomplete="off" readonly>
          </label>
        </div>
      </div>
    </section>

    <section class="panel assessment-panel" id="knowledgePretestPanel">
      <div class="panel-body">
        <div class="survey-intro" id="knowledgePretestIntro">
          <h2>记忆知识前测</h2>
          <p>这里有20道课程开始前的知识题。题目会随机排列，结果只用于比较学习前后的变化，不影响你的成绩。知识前测仅有一次正式提交机会，请确认全部答案后再提交。</p>
        </div>
        <div id="knowledgePretestRoot"></div>
        <div class="actions assessment-actions" id="knowledgePretestActions">
          <p class="status" id="knowledgePretestStatus" aria-live="polite"></p>
          <button class="btn secondary" type="button" id="knowledgePrevBtn">上一页</button>
          <button class="btn secondary" type="button" id="knowledgeNextBtn">下一页</button>
          <button class="btn" type="button" id="knowledgeSubmitBtn">提交知识前测</button>
        </div>
      </div>
    </section>

    <section class="panel assessment-panel" id="metaSurveyPanel" hidden>
      <div class="panel-body">
        <div class="survey-intro" id="metaSurveyIntro">
          <h2>记忆相关知识元认知情况调查问卷</h2>
          <p>请根据真实想法选择最符合的一项。结果仅用于本次学习活动的数据分析，不影响成绩，也不会泄露个人信息。</p>
          <p><strong>资格审查仅有一次正式提交机会，请检查全部答案后再点击完成。</strong></p>
        </div>
        <div id="surveyRoot"></div>
        <div class="summary" id="summary"></div>
        <div class="actions assessment-actions" id="metaSurveyActions">
          <p class="status" id="status"></p>
          <button class="btn secondary" type="button" id="metaPrevBtn">上一页</button>
          <button class="btn" type="button" id="metaNextBtn">下一页</button>
          <button class="btn" type="button" id="completeBtn">完成资格审查（仅一次机会）</button>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/experiment-registry.js"></script>
  <script src="assets/knowledge-pretest.js"></script>
  <script src="assets/knowledge-assessment.js"></script>
  <script src="assets/platform-core.js"></script>
  <script src="auth.js"></script>
  <script src="assets/experiment-bridge.js"></script>
  <script src="assets/experiment-integration.js"></script>
  <script src="assets/experiment-submission.js"></script>
  <script>
    const currentStudent = checkLogin();
    const CONTEXT_KEY = window.BrainPlatform.storage.migrateScopedJson(
      window.BrainPlatform.config.storageKeys.inquiryContext
    );
    const PRETEST_KEY = window.BrainPlatform.storage.migrateScopedJson(
      window.BrainPlatform.config.storageKeys.pretest
    );
    const QUALIFICATION_KEY = window.BrainPlatform.storage.migrateScopedJson(
      window.BrainPlatform.config.storageKeys.qualification
    );
    const knowledgeQuestions = window.BrainKnowledgePretestQuestions;
    const assessmentApi = window.BrainKnowledgeAssessment;
    const KNOWLEDGE_PAGE_SIZE = 1;
    const META_PAGE_SIZE = 3;

    const surveyDef = {
      title: "记忆相关知识元认知情况调查问卷",
      scale: [1, 2, 3, 4, 5],
      anchors: "1=完全否，2=较少，3=一般，4=较多，5=完全是",
      labels: { 1: "完全否", 2: "较少", 3: "一般", 4: "较多", 5: "完全是" },
      note: "请选择最符合你真实想法的一项。",
      items: [
        "我能够理解老师所讲的有关记忆的知识。",
        "这些有关记忆的知识对我很有用，我会继续使用。",
        "在学习这些知识时，我会与现实生活进行联系。",
        "我会根据今天学到的知识反思之前的学习过程中做的不足的地方并加以改进。",
        "在学习这些知识时，我会联想到之前学过或了解过的知识。"
      ]
    };

    const inputs = {
      studentName: document.getElementById("studentName"),
      className: document.getElementById("className"),
      studentId: document.getElementById("studentId"),
      groupId: document.getElementById("groupId")
    };
    const surveyRoot = document.getElementById("surveyRoot");
    const knowledgePretestRoot = document.getElementById("knowledgePretestRoot");
    const knowledgePretestStatus = document.getElementById("knowledgePretestStatus");
    const knowledgePretestIntro = document.getElementById("knowledgePretestIntro");
    const knowledgePretestPanel = document.getElementById("knowledgePretestPanel");
    const metaSurveyPanel = document.getElementById("metaSurveyPanel");
    const metaSurveyIntro = document.getElementById("metaSurveyIntro");
    const summaryRoot = document.getElementById("summary");
    const status = document.getElementById("status");

    let state = loadState();
    let knowledgePageIndex = 0;
    let metaPageIndex = 0;
    let activeAssessmentView = state.knowledgeAssessment.T0 || state.legacyQualification ? "meta" : "knowledge";
    let assessmentPageTransitioning = false;
    renderApp();

    function loadState() {
      const context = readJson(CONTEXT_KEY) || {};
      const saved = readJson(PRETEST_KEY) || readJson(QUALIFICATION_KEY) || {};
      const identity = getStudentIdentityFields();
      const storedTimeline = assessmentApi.mergeTimelines(saved.knowledgeAssessment, assessmentApi.readTimeline());
      const legacyQualification = Boolean(saved.legacyQualification || (saved.completed && !storedTimeline.T0));
      const knowledgeDraft = assessmentApi.normalizeDraft(saved.knowledgeDraft, "T0", knowledgeQuestions, true);
      knowledgeDraft.currentPage = 0;
      return {
        studentName: identity.studentName || saved.studentName || context.studentName || "",
        studentAge: saved.studentAge || context.studentAge || "",
        className: identity.className || saved.className || context.className || "",
        studentId: identity.studentId || saved.studentId || context.studentId || "",
        groupId: identity.groupName || saved.groupId || context.groupId || "",
        groupName: identity.groupName || saved.groupName || context.groupName || "",
        answers: Object.assign({}, saved.answers || saved.preMeta || {}),
        knowledgeAssessment: storedTimeline,
        knowledgeDraft,
        legacyKnowledgePretest: saved.knowledgePretest || null,
        legacyQualification,
        completed: Boolean(saved.completed),
        completedAt: saved.completedAt || ""
      };
    }

    function getStudentIdentityFields() {
      const student = currentStudent || window.BrainPlatform.identity.readStudentSession() || {};

      if (student.isGuest) {
        return {
          studentName: "游客",
          studentId: "guest",
          className: "游客模式",
          groupName: "本地体验",
          isGuest: true
        };
      }

      return {
        studentName: student.name || student.studentName || "",
        studentId: student.studentId || "",
        className: student.class || student.className || "",
        groupName: student.group || student.groupName || student.groupId || ""
      };
    }

    function readJson(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null");
      } catch (event) {
        localStorage.removeItem(key);
        return null;
      }
    }

    function saveIdentity() {
      Object.assign(state, getStudentIdentityFields());
      if (state.groupName) state.groupId = state.groupName;
      Object.keys(inputs).forEach((key) => {
        inputs[key].value = state[key] || "";
      });
      localStorage.setItem(CONTEXT_KEY, JSON.stringify({
        studentName: state.studentName,
        studentAge: state.studentAge,
        className: state.className,
        studentId: state.studentId,
        groupId: state.groupId,
        groupName: state.groupName,
        savedAt: new Date().toISOString()
      }));
    }

    function saveState() {
      saveIdentity();
      const summary = summarize();
      const payload = {
        studentName: state.studentName,
        studentAge: state.studentAge,
        className: state.className,
        studentId: state.studentId,
        groupId: state.groupId,
        groupName: state.groupName,
        answers: state.answers,
        preMeta: state.answers,
        knowledgeAssessment: state.knowledgeAssessment,
        knowledgeDraft: Object.assign({}, state.knowledgeDraft, { currentPage: 0 }),
        knowledgePretest: state.legacyKnowledgePretest,
        legacyQualification: state.legacyQualification,
        answered: summary.answered,
        total: summary.total,
        average: summary.average,
        complete: summary.complete,
        completed: state.completed,
        completedAt: state.completedAt,
        savedAt: new Date().toISOString()
      };
      localStorage.setItem(PRETEST_KEY, JSON.stringify(payload));
      localStorage.setItem(QUALIFICATION_KEY, JSON.stringify(payload));
    }

    function renderApp() {
      Object.keys(inputs).forEach((key) => {
        inputs[key].value = state[key] || "";
        inputs[key].addEventListener("input", () => {
          saveState();
          renderSummary();
        });
      });
      renderAssessmentView();
      document.getElementById("homeBtn").addEventListener("click", () => {
        saveState();
        location.href = "index.html";
      });
      document.getElementById("completeBtn").addEventListener("click", completePretest);
      document.getElementById("knowledgePrevBtn").addEventListener("click", () => changeKnowledgePage(-1));
      document.getElementById("knowledgeNextBtn").addEventListener("click", () => {
        if (state.knowledgeAssessment.T0 || state.legacyQualification) openMetaSurvey();
        else changeKnowledgePage(1);
      });
      document.getElementById("knowledgeSubmitBtn").addEventListener("click", submitKnowledgePretest);
      document.getElementById("metaPrevBtn").addEventListener("click", goToPreviousMetaPage);
      document.getElementById("metaNextBtn").addEventListener("click", () => changeMetaPage(1));
    }

    function renderAssessmentView() {
      const showKnowledge = activeAssessmentView === "knowledge";
      knowledgePretestPanel.hidden = !showKnowledge;
      metaSurveyPanel.hidden = showKnowledge;
      if (showKnowledge) renderKnowledgePretest();
      else renderSurvey();
      renderSummary();
    }

    function getKnowledgeQuestion(questionId) {
      return assessmentApi.getQuestion(knowledgeQuestions, questionId);
    }

    function renderKnowledgePretest() {
      const record = state.knowledgeAssessment.T0;
      const draft = state.knowledgeDraft;
      const previous = document.getElementById("knowledgePrevBtn");
      const next = document.getElementById("knowledgeNextBtn");
      const submit = document.getElementById("knowledgeSubmitBtn");
      if (record || state.legacyQualification) {
        knowledgePretestIntro.hidden = true;
        const legacy = state.legacyQualification && !record;
        knowledgePretestRoot.innerHTML = '<div class="assessment-page-content"><div class="assessment-page-head"><strong>知识前测</strong><span class="assessment-page-progress">已完成</span></div>' +
          '<section class="survey-card"><div><strong>' + (legacy ? '旧版资格审查已完成' : '知识前测已完成') + '</strong><p>' +
          (legacy ? '原有40题记录已保留，不折算为新的T0知识前测，也无需追溯补测。' : '作答已提交并锁定，不显示题目、答案或成绩。') + '</p></div></section></div>';
        previous.hidden = true;
        next.hidden = false;
        next.disabled = false;
        next.textContent = "进入元认知问卷";
        submit.hidden = true;
        knowledgePretestStatus.textContent = "知识前测已完成，可以继续元认知问卷。";
        return;
      }
      knowledgePretestIntro.hidden = true;
      knowledgePageIndex = Math.min(Math.max(knowledgePageIndex, 0), knowledgeQuestions.length - 1);
      const questionId = draft.questionOrder[knowledgePageIndex];
      const item = getKnowledgeQuestion(questionId);
      const selected = draft.answers[questionId] || "";
      const answeredCount = Object.keys(draft.answers).length;
      knowledgePretestRoot.innerHTML = '<div class="assessment-page-content"><div class="assessment-page-head">' +
        '<strong>知识前测：第 ' + (knowledgePageIndex + 1) + ' 题</strong><span class="assessment-page-progress" aria-live="polite">知识前测 ' + (knowledgePageIndex + 1) + '/20</span></div>' +
        '<section class="knowledge-question-card"><p class="knowledge-question-number">第 ' + (knowledgePageIndex + 1) + ' 题</p>' +
        '<p class="knowledge-question-text">' + escapeHtml(item.question) + '</p>' +
        '<div class="survey-scale knowledge-options" role="radiogroup" aria-label="' + escapeHtml(item.question) + '">' +
        Object.entries(item.options).map(([key, label]) => (
          '<label class="survey-option ' + (selected === key ? "is-selected" : "") + '">' +
          '<input type="radio" name="knowledge-' + questionId + '" data-pretest-question="' + questionId + '" value="' + key + '" ' + (selected === key ? "checked" : "") + '>' +
          '<span class="survey-option-card"><span class="survey-score">' + key + '</span><span class="survey-label">' + escapeHtml(label) + '</span></span></label>'
        )).join("") + '</div></section></div>';

      knowledgePretestRoot.querySelectorAll("[data-pretest-question]").forEach((input) => {
        input.addEventListener("change", () => {
          if (state.knowledgeAssessment.T0) return;
          state.knowledgeDraft.answers[input.dataset.pretestQuestion] = input.value;
          saveState();
          renderKnowledgePretest();
        });
      });

      previous.hidden = knowledgePageIndex === 0;
      previous.disabled = false;
      next.hidden = knowledgePageIndex === knowledgeQuestions.length - 1;
      next.disabled = false;
      next.textContent = "下一页";
      submit.hidden = knowledgePageIndex !== knowledgeQuestions.length - 1;
      submit.disabled = false;
      submit.textContent = "提交知识前测（仅一次机会）";
      knowledgePretestStatus.textContent = "已完成 " + answeredCount + " / 20 题。";
    }

    function changeKnowledgePage(offset) {
      const target = Math.max(0, Math.min(knowledgeQuestions.length - 1, knowledgePageIndex + offset));
      if (target === knowledgePageIndex) return;
      transitionAssessmentPage(knowledgePretestRoot, () => {
        knowledgePageIndex = target;
        renderKnowledgePretest();
      });
    }

    function transitionAssessmentPage(root, commit) {
      if (assessmentPageTransitioning) return;
      const content = root.querySelector(".assessment-page-content");
      const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
      if (!content || reduceMotion) {
        commit();
        return;
      }
      assessmentPageTransitioning = true;
      content.classList.add("is-leaving");
      window.setTimeout(() => {
        assessmentPageTransitioning = false;
        commit();
      }, 150);
    }

    function openMetaSurvey() {
      activeAssessmentView = "meta";
      metaPageIndex = 0;
      renderAssessmentView();
    }

    function goToPreviousMetaPage() {
      if (metaPageIndex > 0) {
        changeMetaPage(-1);
        return;
      }
      activeAssessmentView = "knowledge";
      renderAssessmentView();
    }

    function changeMetaPage(offset) {
      const pageCount = Math.ceil(surveyDef.items.length / META_PAGE_SIZE);
      const target = Math.max(0, Math.min(pageCount - 1, metaPageIndex + offset));
      if (target === metaPageIndex) return;
      transitionAssessmentPage(surveyRoot, () => {
        metaPageIndex = target;
        renderSurvey();
        renderSummary();
      });
    }

    function submitKnowledgePretest() {
      if (state.knowledgeAssessment.T0 || state.legacyQualification) return;
      const result = assessmentApi.submitStage(state.knowledgeAssessment, "T0", knowledgeQuestions, state.knowledgeDraft);
      if (result.unanswered?.length) {
        knowledgePageIndex = state.knowledgeDraft.questionOrder.indexOf(result.unanswered[0]);
        renderKnowledgePretest();
        knowledgePretestStatus.textContent = "还有 " + result.unanswered.length + " 题未完成，请补充后再提交。";
        return;
      }
      state.knowledgeAssessment = result.timeline;
      state.completed = false;
      state.completedAt = "";
      saveState();
      activeAssessmentView = "meta";
      metaPageIndex = 0;
      renderAssessmentView();
    }

    function renderSurvey() {
      if (!state.knowledgeAssessment.T0 && !state.legacyQualification) {
        surveyRoot.innerHTML = "";
        return;
      }
      const previous = document.getElementById("metaPrevBtn");
      const next = document.getElementById("metaNextBtn");
      const complete = document.getElementById("completeBtn");
      if (state.completed) {
        metaSurveyIntro.hidden = true;
        surveyRoot.innerHTML = '<div class="assessment-page-content"><div class="assessment-page-head"><strong>资格审查</strong><span class="assessment-page-progress">已完成</span></div>' +
          '<section class="survey-card"><div><strong>资格审查已完成</strong><p>作答已提交并锁定，可以返回首页进入实验。</p></div></section></div>';
        previous.hidden = true;
        next.hidden = true;
        complete.hidden = true;
        summaryRoot.hidden = true;
        return;
      }

      metaSurveyIntro.hidden = false;
      const pageCount = Math.ceil(surveyDef.items.length / META_PAGE_SIZE);
      metaPageIndex = Math.min(Math.max(metaPageIndex, 0), pageCount - 1);
      const start = metaPageIndex * META_PAGE_SIZE;
      const pageItems = surveyDef.items.slice(start, start + META_PAGE_SIZE);
      surveyRoot.innerHTML = '<div class="assessment-page-content"><div class="assessment-page-head">' +
        '<strong>元认知问卷</strong><span class="assessment-page-progress" aria-live="polite">' + (metaPageIndex + 1) + '/' + pageCount + '</span></div>' +
        '<section class="survey-card"><div class="survey-page-note"><span>' + surveyDef.note + '</span><span>' + surveyDef.anchors + '</span></div>' +
        pageItems.map((item, pageItemIndex) => {
          const index = start + pageItemIndex;
          const itemKey = "q" + (index + 1);
          return '<div class="survey-item"><p>' + (index + 1) + ". " + escapeHtml(item) + '</p>' +
            '<div class="survey-scale" role="radiogroup" aria-label="' + escapeHtml(item) + '">' +
              surveyDef.scale.map((score) => {
                const checked = Number(state.answers[itemKey]) === score;
                return '<label class="survey-option ' + (checked ? "is-selected" : "") + '">' +
                  '<input type="radio" name="' + itemKey + '" data-question="' + itemKey + '" value="' + score + '" ' + (checked ? "checked" : "") + '>' +
                  '<span class="survey-option-card"><span class="survey-score">' + score + '</span><span class="survey-label">' + surveyDef.labels[score] + '</span></span>' +
                '</label>';
              }).join("") +
            '</div></div>';
        }).join("") +
      '</section></div>';

      previous.hidden = false;
      next.hidden = metaPageIndex === pageCount - 1;
      complete.hidden = metaPageIndex !== pageCount - 1;
      summaryRoot.hidden = metaPageIndex !== pageCount - 1;

      surveyRoot.querySelectorAll("[data-question]").forEach((input) => {
        input.addEventListener("change", () => {
          state.answers[input.dataset.question] = Number(input.value);
          state.completed = false;
          state.completedAt = "";
          saveState();
          renderSurvey();
          renderSummary();
        });
      });
    }

    function summarize() {
      const values = surveyDef.items
        .map((_, index) => Number(state.answers["q" + (index + 1)] || 0))
        .filter(Boolean);
      const total = values.reduce((sum, value) => sum + value, 0);
      return {
        answered: values.length,
        total,
        average: values.length ? Number((total / values.length).toFixed(2)) : 0,
        complete: values.length === surveyDef.items.length
      };
    }

    function renderSummary() {
      const summary = summarize();
      summaryRoot.innerHTML = [
        ["知识前测", state.knowledgeAssessment.T0 ? "已提交" : state.legacyQualification ? "旧版已完成" : Object.keys(state.knowledgeDraft.answers).length + "/20"],
        ["元认知问卷", summary.answered + "/" + surveyDef.items.length]
      ].map((item) => '<div><strong>' + item[1] + '</strong><span>' + item[0] + '</span></div>').join("");
      summaryRoot.hidden = activeAssessmentView !== "meta" || metaPageIndex !== 1 || state.completed;
      status.classList.toggle("is-complete", state.completed);
      status.textContent = state.completed ? "资格审查已完成，数据已保存，可以返回首页进入实验。" : "";
      const completeButton = document.getElementById("completeBtn");
      if (completeButton) {
        completeButton.disabled = state.completed;
        completeButton.textContent = state.completed ? "资格审查已完成" : "完成资格审查（仅一次机会）";
      }
    }

    async function completePretest() {
      if (state.completed) return;
      saveIdentity();
      const summary = summarize();
      if (!state.knowledgeAssessment.T0 && !state.legacyQualification) {
        alert("请先完成并提交20道知识前测。");
        return;
      }
      if (!summary.complete) {
        const firstMissingIndex = surveyDef.items.findIndex((_, index) => !state.answers["q" + (index + 1)]);
        metaPageIndex = Math.floor(firstMissingIndex / META_PAGE_SIZE);
        renderAssessmentView();
        alert("请完成所有题目后再提交资格审查。");
        status.classList.remove("is-complete");
        status.textContent = "请完成所有题目后再提交资格审查。";
        return;
      }
      state.completed = true;
      state.completedAt = state.completedAt || new Date().toISOString();
      saveState();
      const button = document.getElementById("completeBtn");
      if (button) button.disabled = true;
      const result = await submitScreeningRecord();
      if (!result?.ok && !result?.queued) {
        state.completed = false;
        state.completedAt = "";
        saveState();
        alert("资格审查提交失败，请稍后重试。此次失败不会占用正式提交机会。");
      }
      activeAssessmentView = "meta";
      renderAssessmentView();
      if (state.completed) {
        status.textContent = result?.queued
          ? "资格审查已完成，数据将在联网后自动同步，可以返回首页进入实验。"
          : "资格审查已完成，数据已提交，可以返回首页进入实验。";
      }
    }

    function buildScreeningSnapshot() {
      const summary = summarize();
      return {
        studentName: state.studentName,
        studentAge: state.studentAge,
        className: state.className,
        studentId: state.studentId,
        groupId: state.groupId,
        groupName: state.groupName || state.groupId,
        surveyTitle: surveyDef.title,
        answers: state.answers,
        items: surveyDef.items,
        labels: surveyDef.labels,
        knowledgeAssessment: state.knowledgeAssessment,
        knowledgePretest: state.legacyKnowledgePretest,
        legacyQualification: state.legacyQualification,
        answered: summary.answered,
        total: summary.total,
        average: summary.average,
        complete: summary.complete,
        completed: state.completed,
        completedAt: state.completedAt,
        savedAt: new Date().toISOString()
      };
    }

    function submitScreeningRecord() {
      const snapshot = buildScreeningSnapshot();
      return window.BrainExperimentBridge.submitExperimentState({
        moduleId: "screening",
        state: snapshot,
        submissionTime: snapshot.completedAt || new Date().toISOString()
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
