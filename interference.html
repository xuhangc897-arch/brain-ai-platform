<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实验三：探究干扰长时记忆的因素</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #fff;
      --ink: #172033;
      --muted: #667085;
      --line: #dbe3ef;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eaf1ff;
      --teal: #0f766e;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif; }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; border-radius: 8px; cursor: pointer; font-weight: 800; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(23,32,51,.06);
      backdrop-filter: blur(10px);
    }
    .topbar-inner { max-width: 1240px; margin: 0 auto; padding: 14px 24px 12px; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    .brand-title h1 { margin: 0; font-size: 20px; line-height: 1.2; }
    .identity-pill { color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .progress { display: grid; grid-template-columns: repeat(8, minmax(88px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .progress-step { min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); background: #f9fbff; color: var(--muted); border-radius: 8px; text-align: left; display: flex; align-items: center; gap: 8px; }
    .progress-step strong { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #edf2f7; color: #475467; font-size: 12px; }
    .progress-step span { font-size: 13px; white-space: nowrap; }
    .progress-step.is-active { background: var(--primary-soft); border-color: #9ec5ff; color: var(--primary-dark); }
    .progress-step.is-active strong { background: var(--primary); color: #fff; }
    .progress-step.is-done { background: #eefaf6; border-color: #bde7d5; color: var(--teal); }
    .progress-step.is-done strong { background: var(--teal); color: #fff; }

    .main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 44px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel-head { padding: 20px 22px 12px; border-bottom: 1px solid #eef2f7; }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: 22px; line-height: 1.25; }
    .panel-head p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .panel-body { padding: 20px 22px 22px; }
    .step-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
    .single-step-layout, .reflection-layout { display: grid; gap: 22px; width: 100%; max-width: 1100px; margin: 0 auto; }
    .reflection-layout { max-width: 1000px; }
    .analysis-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
    .analysis-layout .panel, .single-step-layout .panel, .reflection-layout .panel { border-radius: 10px; }
    .panel-head h2, .panel-head h3 { font-size: 20px; }
    .single-step-layout .panel-body, .reflection-layout .panel-body { padding: 24px; }
    input:not([type="checkbox"]):not([type="radio"]), textarea, select { min-height: 42px; }
    .analysis-layout .empty-state { min-height: 120px; display: grid; place-items: center; padding: 18px; }
    .team-result-card table input { min-height: 38px; padding: 8px 10px; }
    .team-result-card th, .team-result-card td { padding: 8px 9px; }
    .team-result-card input.member-id-input { width: 120px; min-width: 100px; max-width: 140px; }
    .team-result-card .percent-field { display: flex; align-items: center; gap: 6px; }
    .team-result-card .percent-field input { min-width: 80px; }
    .phase-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .phase-card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 14px; }
    .phase-card h4 { margin: 0 0 8px; color: var(--primary-dark); }
    .phase-card p { margin: 0; color: var(--muted); line-height: 1.65; }
    .reflection-layout textarea { min-height: 140px; }
    .reflection-layout textarea::placeholder { color: #98a2b3; opacity: 1; }
    .reflection-layout textarea:focus::placeholder { color: transparent; }
    .thinking-layer { display: grid; gap: 14px; }
    .thinking-box { border-radius: 8px; padding: 14px; }
    .thinking-personal { border: 1px solid #dbeafe; background: #fff; }
    .thinking-group { border: 1px dashed #bfdbfe; background: #f8fbff; }
    .thinking-label { display: block; margin-bottom: 10px; color: #1e3a8a; font-size: 14px; font-weight: 900; }
    .thinking-group textarea { background: #fff; min-height: 110px; }
    .reading-list { display: grid; gap: 14px; }
    .reading-card { border: 1px solid #e5edf7; border-radius: 8px; padding: 16px; background: #fbfdff; }
    .reading-card h4 { margin: 0 0 8px; color: #1e3a8a; font-size: 16px; }
    .reading-card p { margin: 0 0 14px; color: #344054; font-size: 16px; line-height: 1.8; }
    .reading-card p:last-child { margin-bottom: 0; }
    .question-intro-strip { grid-column: 1 / -1; border: 1px solid #bfdbfe; border-radius: 8px; padding: 18px 20px; background: linear-gradient(135deg, #eff6ff, #f8fbff); box-shadow: 0 12px 28px rgba(37,99,235,.08); }
    .question-intro-strip p { margin: 0 0 12px; color: #24364f; font-size: 15px; line-height: 1.8; }
    .question-intro-strip .field { margin: 14px 0 0; }
    .question-intro-strip textarea { background: #fff; min-height: 88px; }
    .reading-card .material-lead { margin-bottom: 12px; color: var(--muted); }
    .variable-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .variable-table { min-width: 680px; margin: 0; }
    .variable-table th:first-child, .variable-table td:first-child { width: 230px; color: #1e3a8a; font-weight: 800; }
    .variable-table textarea { min-height: 74px; }
    .material-details { border: 1px solid #e5edf7; border-radius: 8px; background: #fbfdff; overflow: hidden; }
    .material-details summary { padding: 14px 16px; color: #1e3a8a; font-weight: 900; cursor: pointer; }
    .material-details summary::marker { color: var(--primary); }
    .material-details-body { display: grid; gap: 12px; padding: 0 16px 16px; color: #344054; font-size: 16px; line-height: 1.8; }
    .material-details-body p { margin: 0; line-height: 1.8; }
    .material-details-body .field { margin: 2px 0 0; }
    .headband-image-container { margin: 24px 0; text-align: center; }
    .headband-guide-image { width: 100%; max-width: 1100px; height: auto; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); display: block; margin: 0 auto; }
    .comparison-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .comparison-card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 14px; }
    .comparison-card h4 { margin: 0 0 8px; color: var(--primary-dark); }
    .comparison-card p { margin: 5px 0; line-height: 1.65; }
    .readonly-value { min-height: 42px; display: flex; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; color: var(--ink); font-weight: 800; }
    .readonly-plan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .evidence-instructions { margin: 14px 0 0; color: var(--muted); line-height: 1.75; }
    .run-results-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .run-result-card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 14px; }
    .run-result-card h4 { margin: 0 0 10px; color: var(--primary-dark); }
    .run-result-card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 0; font-size: 13px; }
    .run-result-card dt { color: var(--muted); }
    .run-result-card dd { margin: 0; overflow-wrap: anywhere; }
    .experiment-game.evidence-game-shell { display: none; }
    body.is-focus-mode .experiment-game.evidence-game-shell { display: grid; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; color: #344054; font-size: 14px; font-weight: 700; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 11px 12px; outline: none; }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 16px; background: var(--primary); color: #fff; }
    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: #fff; color: #344054; border: 1px solid var(--line); }
    .btn.secondary:hover { background: #f8fafc; }
    .btn.success { background: var(--green); }
    .btn.danger { background: #fff; color: var(--red); border: 1px solid #fecaca; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
    .toolbar .field { min-width: 150px; flex: 1; margin-bottom: 0; }

    .experiment-game { display: grid; grid-template-columns: 1fr 360px; gap: 18px; align-items: stretch; }
    .stage { position: relative; display: grid; place-items: center; min-height: 440px; border: 1px solid #dbeafe; border-radius: 8px; background: linear-gradient(180deg,#fff 0%,#f8fbff 100%); overflow: hidden; }
    .stage-meta { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 700; }
    .timer { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 10px; border-radius: 999px; background: #dbeafe; overflow: hidden; }
    .timer-fill { width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), var(--amber)); transition: width .08s linear; }
    .task-card { width: min(720px, 90%); padding: 24px; border: 1px solid #bfdbfe; border-radius: 8px; background: #eff6ff; color: #1e3a8a; text-align: center; }
    .task-card h3 { margin: 0 0 12px; font-size: 30px; }
    .memory-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
    .memory-item { padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid #bfdbfe; font-size: 22px; font-weight: 900; }
    .answer-box { display: none; width: min(720px, 90%); }
    .answer-box.is-visible { display: block; }
    .answer-box textarea { min-height: 180px; font-size: 18px; }
    .material-source { display: inline-flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: 13px; }
    .material-chip { display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 999px; background: #eef6ff; color: #1d4ed8; font-weight: 800; }
    .material-block { display: grid; gap: 12px; text-align: left; }
    .material-line { padding: 12px; border-radius: 8px; background: #fff; border: 1px solid #bfdbfe; color: #1e3a8a; font-size: 20px; font-weight: 800; line-height: 1.55; }
    .interference-video { display: block; width: min(760px, 100%); max-height: 54vh; margin: 16px auto 0; border-radius: 8px; background: #000; box-shadow: 0 18px 42px rgba(0,0,0,.18); }
    .video-status { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: #fff; border: 1px solid #bfdbfe; color: #1e3a8a; font-size: 14px; font-weight: 800; }
    .video-status.warning { border-color: #fed7aa; background: #fff7ed; color: #9a3412; }
    .video-status.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
    .video-actions { margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .score-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .score-row input { font-size: 18px; font-weight: 900; text-align: center; }
    .score-rule { margin-top: 12px; padding: 12px; border-radius: 8px; background: #f8fbff; color: #344054; font-size: 14px; }
    .game-side { display: flex; flex-direction: column; gap: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .mini-stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .mini-stat span { display: block; color: var(--muted); font-size: 12px; }
    .mini-stat b { font-size: 22px; line-height: 1.2; }
    .game-log { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #edf2f7; padding: 9px 10px; text-align: left; vertical-align: middle; }
    th { position: sticky; top: 0; background: #f8fafc; color: #475467; font-weight: 800; }
    .tag { display: inline-flex; min-width: 38px; justify-content: center; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
    .chart { display: grid; gap: 12px; margin-top: 14px; }
    .bar-row { display: grid; grid-template-columns: 180px 1fr 70px; gap: 12px; align-items: center; }
    .bar-track { height: 22px; border-radius: 8px; background: #eef2f7; overflow: hidden; }
    .bar-fill { height: 100%; min-width: 2px; background: linear-gradient(90deg, var(--primary), var(--teal)); }
    .empty-state { border: 1px dashed #cbd5e1; border-radius: 8px; padding: 22px; background: #f8fafc; color: var(--muted); text-align: center; }

    body.is-focus-mode { background: #08111f; }
    body.is-focus-mode .topbar { display: none; }
    body.is-focus-mode .main { max-width: none; min-height: 100vh; padding: 0; }
    body.is-focus-mode .main > .panel { min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; background: #08111f; }
    body.is-focus-mode .main > .panel > .panel-head,
    body.is-focus-mode .main > .panel > .panel-body > .actions,
    body.is-focus-mode .question-page-head,
    body.is-focus-mode .question-page-actions,
    body.is-focus-mode .evidence-page > .panel > .panel-head,
    body.is-focus-mode .readonly-plan-grid,
    body.is-focus-mode .evidence-instructions,
    body.is-focus-mode .evidence-page .actions,
    body.is-focus-mode .interference-toolbar,
    body.is-focus-mode .game-log,
    body.is-focus-mode .game-side .stat-grid { display: none; }
    body.is-focus-mode .main > .panel > .panel-body { min-height: 100vh; padding: 0; }
    body.is-focus-mode .question-flow, body.is-focus-mode .question-page-content, body.is-focus-mode .evidence-page, body.is-focus-mode .evidence-page > .panel, body.is-focus-mode .evidence-page > .panel > .panel-body { min-height: 100vh; margin: 0; padding: 0; border: 0; background: #08111f; }
    body.is-focus-mode .experiment-game { min-height: 100vh; grid-template-columns: 1fr; gap: 0; background: #08111f; }
    body.is-focus-mode .stage { min-height: 100vh; border: 0; border-radius: 0; background: radial-gradient(circle at center, #12213a 0%, #08111f 66%); }
    body.is-focus-mode .stage-meta { top: 30px; left: 36px; right: 36px; color: #dbeafe; font-size: 20px; }
    body.is-focus-mode .task-card { width: min(900px, calc(100vw - 48px)); padding: 34px; border: 1px solid rgba(255,255,255,.16); background: rgba(248,251,255,.96); box-shadow: 0 28px 90px rgba(37,99,235,.22); }
    body.is-focus-mode .task-card h3 { font-size: 42px; }
    body.is-focus-mode .memory-item { font-size: 28px; padding: 10px 16px; }
    body.is-focus-mode .answer-box { width: min(820px, calc(100vw - 48px)); padding: 28px; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; background: rgba(15,23,42,.88); box-shadow: 0 28px 90px rgba(0,0,0,.34); }
    body.is-focus-mode .answer-box label { color: #dbeafe; font-size: 20px; text-align: center; }
    body.is-focus-mode .answer-box textarea { min-height: 220px; font-size: 22px; background: #f8fbff; }
    body.is-focus-mode .answer-box .btn { min-height: 58px; font-size: 20px; }
    body.is-focus-mode .timer { left: 36px; right: 36px; bottom: 36px; height: 14px; background: rgba(219,234,254,.22); }
    body.is-focus-mode .game-side { position: fixed; left: 50%; bottom: 36px; width: min(620px, calc(100vw - 32px)); transform: translateX(-50%); z-index: 30; pointer-events: none; }
    body.is-focus-mode .answer-box, body.is-focus-mode .answer-box * { pointer-events: auto; }
    body.is-focus-mode .answer-box ~ .timer { bottom: 24px; }
    .focus-prep { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 24px; background: rgba(8,17,31,.88); color: #fff; }
    .focus-prep.is-visible { display: grid; }
    .focus-prep-card { width: min(560px, 100%); border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 28px; background: #111827; box-shadow: 0 24px 80px rgba(0,0,0,.36); }
    .focus-prep-card h3 { margin: 0 0 10px; font-size: 26px; }
    .focus-prep-card p { margin: 0 0 12px; color: #cbd5e1; }

    .question-flow { min-height: max(390px, calc(100dvh - 350px)); display: flex; flex-direction: column; gap: 14px; }
    .main.is-paged-step { padding-top: 18px; padding-bottom: 0; }
    body.has-virtual-agent .main.is-paged-step { padding-bottom: 0; }
    .question-page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .question-page-head h3 { margin: 0; color: var(--ink); font-size: 18px; }
    .question-page-progress { flex: 0 0 auto; color: var(--primary-dark); font-size: 14px; font-weight: 900; }
    .question-page-content { flex: 1; min-height: 0; animation: question-page-fade-in 150ms ease both; }
    .question-page-content.is-leaving { pointer-events: none; animation: question-page-fade-out 150ms ease both; }
    .question-page-material { display: grid; align-items: center; width: min(980px, 100%); height: 100%; margin: 0 auto; }
    .question-materials-combined { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: center; width: 100%; height: 100%; }
    .question-materials-combined .reading-card { padding: 18px; }
    .question-materials-combined .reading-card h4 { font-size: 19px; line-height: 1.5; }
    .question-materials-combined .reading-card p { font-size: 16px; line-height: 1.9; }
    .question-page-cases .case-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 0; }
    .question-page-cases .template-card { grid-column: 1 / -1; padding: 11px 14px; }
    .question-page-cases .case-card summary { padding: 9px 12px; }
    .question-page-cases .case-body { padding: 0 12px 10px; font-size: 13px; }
    .question-page-form .thinking-layer, .step-page-form .thinking-layer, .reflection-page .thinking-layer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .question-page-form textarea, .step-page-form textarea, .reflection-page textarea { min-height: 104px; }
    .question-page-actions { display: flex; justify-content: space-between; gap: 12px; min-height: 42px; margin-top: auto; }
    .question-page-actions.is-first { justify-content: flex-end; }
    .question-page-actions .btn { min-width: 112px; }
    .step-page-content > .panel, .step-page-content > .single-step-layout, .step-page-content > .reflection-layout { height: 100%; }
    .step-page-content > .single-step-layout, .step-page-content > .reflection-layout { align-content: center; }
    .step-page-content .panel-body { padding: 16px 18px; }
    .step-page-content .panel-head { padding: 14px 18px 10px; }
    .plan-flow-page .phase-card { padding: 10px 12px; }
    .plan-flow-page .phase-card p { line-height: 1.45; }
    .plan-flow-page textarea { min-height: 62px; }
    .plan-flow-page .field { margin-bottom: 0; }
    .plan-variables-page .panel-head { padding: 10px 14px 6px; }
    .plan-variables-page .panel-body { padding: 10px 14px; }
    .plan-variables-page .variable-table textarea { min-height: 42px; height: 44px; }
    .plan-variables-page .variable-table td { padding: 4px 8px; }
    .plan-parameters-page .form-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
    .time-parameter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; margin-top: 12px; }
    .plan-parameters-page .field { margin-bottom: 2px; }

    .headband-guide-trigger { margin-top: 14px; }
    .headband-modal { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 28px; background: rgba(8,17,31,.72); }
    .headband-modal.is-visible { display: grid; }
    .headband-modal-card { position: relative; width: min(920px, 92vw); max-height: 88vh; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; padding: 18px; background: var(--panel); box-shadow: 0 28px 90px rgba(0,0,0,.3); }
    .headband-modal-card img { display: block; width: 100%; max-height: calc(88vh - 36px); object-fit: contain; }
    .headband-modal-close { position: absolute; top: 10px; right: 10px; z-index: 1; width: 38px; min-width: 38px; height: 38px; padding: 0; }

    function deterministicShuffle(items, seed) {
      const result = items.slice();
      let state = seed >>> 0;
      for (let index = result.length - 1; index > 0; index -= 1) {
        state = (state * 1664525 + 1013904223) >>> 0;
        const swapIndex = state % (index + 1);
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];

      letters.forEach((first) => letters.forEach((second) => letters.forEach((third) => {

      })));
      return deterministicShuffle(items, 314159);
    }

    function buildNeutralNumberPool() {
      const items = [];
      for (let value = 102; value <= 987; value += 1) {

        const digits = text.split("").map(Number);
        if (digits.includes(0)) continue;
        if (new Set(digits).size !== 3) continue;
        if (Math.abs(digits[0] - digits[1]) === 1 || Math.abs(digits[1] - digits[2]) === 1) continue;
        if (digits[1] - digits[0] === digits[2] - digits[1]) continue;
        items.push(text);

      return deterministicShuffle(items, 271828);

    function takeDiverseLetterTriplets(start, count) {
      const selected = [];
      for (let offset = 0; offset < LETTER_TRIPLET_POOL.length && selected.length < count; offset += 1) {
        const candidate = LETTER_TRIPLET_POOL[(start + offset) % LETTER_TRIPLET_POOL.length];
        const candidateLetters = new Set(candidate);
        const isDiverse = selected.every((item) => {
          const sharedLetterCount = [...candidateLetters].filter((letter) => item.includes(letter)).length;
          const samePositionCount = [...candidate].filter((letter, index) => item[index] === letter).length;
          return sharedLetterCount <= 1 && samePositionCount === 0;
        });
        if (isDiverse) selected.push(candidate);
      }
      if (selected.length !== count) throw new Error(`无法生成 ${count} 个低相似三字母材料`);
      return selected;
    }

    function takeDiverseNumberGroups(start, count) {

    const VOICE_SUGGESTION_TASKS = new Set([
      "lifeFactors",
      "materialFactors",
      "hypothesis",
      "independentVariablePlan",
      "dependentVariablePlan",
      "controlVariablePlan",
      "headband",
      "conclusion",
      "strengths",
      "improvements",
      "learningInsight"
    ]);
    function applyLearningBehaviorMetadata() {
      main.querySelectorAll("textarea[data-field]").forEach((field) => {
        const taskId = field.dataset.field;
        const stageId = TRACKED_TEXT_TASKS[taskId];
        if (!stageId) return;
        Object.assign(field.dataset, {
          agentTrack: "true",
          experimentId: "interference",
          stageId,
          taskId
        });
        if (VOICE_SUGGESTION_TASKS.has(taskId) &&
            steps[state.currentStep]?.id === stageId &&
            state.currentStep >= state.maxUnlockedStep) {
          field.dataset.voiceSuggestion = "true";
          field.dataset.relevanceCheck = "true";
        }
      });
    }
    function renderGroupTextarea(field, placeholder = "请写下你与小组成员讨论后达成的一致结果") {
      return `<textarea data-field="${field}" placeholder="${escapeHtml(placeholder)}">${escapeHtml(state.fields[field])}</textarea>`;
    }
    function renderGroupInput(field, placeholder = "") {
      return `<input type="text" data-field="${field}" value="${escapeHtml(state.fields[field])}" placeholder="${escapeHtml(placeholder)}">`;
    }
    function renderGroupSelect(field, options, value = state.fields[field]) {
      return `<select data-field="${field}">${options.map((item)=>`<option value="${escapeHtml(item)}" ${value === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}</select>`;
    }
    function syncThinkingFields() {
      const fields = state.fields;
      fields.question_individual = joinThoughts([thoughtLine("生活中的干扰因素", fields.lifeFactors), thoughtLine("材料中的干扰因素", fields.materialFactors)]);
      fields.question_group = joinThoughts([thoughtLine("生活中的干扰因素", fields.lifeFactors_group), thoughtLine("材料中的干扰因素", fields.materialFactors_group), thoughtLine("研究问题", fields.question || fields.questionFactor)]) || fields.question_group || "";
      fields.hypothesis_individual = fields.hypothesis || "";
      fields.hypothesis_group = fields.hypothesis_group || "";
      fields.conclusion_individual = joinThoughts([thoughtLine("结论是否支持假设", fields.support), thoughtLine("结论是否可信", fields.credibility), thoughtLine("结论", fields.conclusion)]);
      fields.reflection_individual = joinThoughts([thoughtLine("优点", fields.strengths), thoughtLine("改进", fields.improvements), thoughtLine("学习启发", fields.learningInsight)]);
      fields.reflection_group = joinThoughts([thoughtLine("优点", fields.strengths_group), thoughtLine("改进", fields.improvements_group), thoughtLine("学习启发", fields.learningInsight_group)]) || fields.reflection_group || "";
    }
    function getThinkingRows() {
      syncThinkingFields();
      const fields = state.fields;
      return [["提出问题/生活中的干扰因素-个人思考", fields.lifeFactors], ["提出问题/生活中的干扰因素-小组共识", fields.lifeFactors_group], ["提出问题/材料中的干扰因素-个人思考", fields.materialFactors], ["提出问题/材料中的干扰因素-小组共识", fields.materialFactors_group], ["提出问题/研究问题-小组共识", fields.question], ["作出假设/研究假设-个人思考", fields.hypothesis], ["作出假设/研究假设-小组共识", fields.hypothesis_group], ["得出结论/假设支持-个人思考", fields.support], ["得出结论/假设支持-小组共识", fields.support_group], ["得出结论/可信度-个人思考", fields.credibility], ["得出结论/可信度-小组共识", fields.credibility_group], ["得出结论/结论-个人思考", fields.conclusion], ["得出结论/结论-小组共识", fields.conclusion_group], ["反思交流/优点-个人思考", fields.strengths], ["反思交流/优点-小组共识", fields.strengths_group], ["反思交流/改进-个人思考", fields.improvements], ["反思交流/改进-小组共识", fields.improvements_group], ["反思交流/学习启发-个人思考", fields.learningInsight], ["反思交流/学习启发-小组共识", fields.learningInsight_group]];
    }
    function renderApp() {
      if (!state.studentId || !state.groupId) {
        main.innerHTML = `<section class="panel"><div class="panel-head"><h2>需要先填写学生编号和小组编号</h2><p>请返回实验选择页录入身份信息后再进入实验。</p></div><div class="panel-body"><button class="btn" type="button" onclick="location.href='index.html'">返回实验选择</button></div></section>`;
        return;
      }
      identityPill.textContent = `${state.studentName ? `姓名：${state.studentName}　` : ""}${state.studentAge ? `年龄：${state.studentAge}　` : ""}学生：${state.studentId}　小组：${state.groupId}`;
      normalizeCurrentStep();
      renderProgress();
      renderStep();
    }

    function clampStepIndex(value) {
      const index = Number(value);
      if (!Number.isInteger(index)) return 0;
      return Math.min(Math.max(index, 0), steps.length - 1);
    }

    function normalizeStepAccess() {
      const legacyCurrent = clampStepIndex(state.currentStep);
      if (!Number.isInteger(Number(state.maxUnlockedStep))) {
        state.maxUnlockedStep = legacyCurrent;
      } else {
        state.maxUnlockedStep = clampStepIndex(state.maxUnlockedStep);
      }
      state.currentStep = isDeveloperMode() ? legacyCurrent : Math.min(legacyCurrent, state.maxUnlockedStep);
    }

    function showStepMessage(message) {
      alert(message);
    }

    function getFirstUnansweredSurveyQuestion(surveyKey, itemCount) {
      const answers = state.surveys?.current?.[surveyKey] || {};
      for (let index = 0; index < itemCount; index += 1) {
        if (!Number(answers[`q${index + 1}`])) return index;
      }
      return -1;
    }

    function getIncompletePosttestPage() {
      const quizAnswers = state.knowledgeQuiz?.answers || {};
      for (let index = 0; index < KNOWLEDGE_QUIZ.items.length; index += 1) {
        if (!quizAnswers[`q${index + 1}`]) return index;
      }
      let offset = KNOWLEDGE_QUIZ.items.length;
      for (const [surveyKey, defKey] of [["postMeta", "meta"], ["cognitiveLoad", "load"], ["inquiryParticipation", "inquiry"]]) {
        const missing = getFirstUnansweredSurveyQuestion(surveyKey, SURVEY_DEFS[defKey].items.length);
        if (missing >= 0) return offset + Math.floor(missing / 3);
        offset += Math.ceil(SURVEY_DEFS[defKey].items.length / 3);
      }
      return Math.max(0, getStepPageCount("posttest") - 1);
    }

    function getIncompleteStepPage(stepId) {
      const fields = state.fields || {};
      if (stepId === "question") return hasText(fields.materialFactors) ? 6 : 5;
      if (stepId === "hypothesis") return 0;
      if (stepId === "plan") {
        if (!hasText(fields.independentVariablePlan) || !hasText(fields.dependentVariablePlan) || !hasText(fields.controlVariablePlan)) return 4;
        return 5;
      }
      if (stepId === "evidence") return 0;
      if (stepId === "analysis") return Array.isArray(state.records) && state.records.length ? 1 : 0;
      if (stepId === "conclusion") return 1;
      if (stepId === "reflection") {
        if (!hasText(fields.strengths)) return 0;
        if (!hasText(fields.improvements)) return 1;
        return 2;
      }
      if (stepId === "posttest") return getIncompletePosttestPage();
      return Math.max(0, getStepPageIndex(stepId));
    }

    function getIncompleteStepMessage(stepId) {
      const pageCount = getStepPageCount(stepId);
      const pageNumber = Math.min(Math.max(getIncompleteStepPage(stepId), 0), pageCount - 1) + 1;
      return `请先完成本步骤内容。（${steps[state.currentStep].title}${pageNumber}/${pageCount}）`;
    }

    function goToStep(targetStep) {
      const target = clampStepIndex(targetStep);
      if (!isDeveloperMode() && target > state.maxUnlockedStep) {
        showStepMessage("请先完成前一步内容，再进入下一步。");
        return;
      }
      preparePagedInputLifecycle();
      state.currentStep = target;
      if (!isDeveloperMode()) saveState();
      renderApp();
    }

    function goNextStep() {
      if (!validateStep(steps[state.currentStep].id)) {
        showStepMessage(getIncompleteStepMessage(steps[state.currentStep].id));
        return;
      }
      if (state.currentStep < steps.length - 1) {
        window.LearningBehaviorTracker?.markStageSubmitted(steps[state.currentStep].id);
        if (!isDeveloperMode()) state.maxUnlockedStep = Math.max(state.maxUnlockedStep || 0, state.currentStep + 1);
        state.currentStep += 1;
        if (!isDeveloperMode()) saveState();
        renderApp();
      }
    }

    function hasText(value) {
      return String(value ?? "").trim().length > 0;
    }
    function hasValidNumber(value, min, max) {
      const number = Number(value);
      return value !== "" && Number.isFinite(number) && number >= min && number <= max;
    }
    function hasStructuredMemberResult() {
      return normalizeOtherMemberResults(state.fields || {}).some((item)=>hasText(item.memberId) || hasText(item.interferenceFactor) || hasText(item.materialType) || hasText(item.averageScore) || hasText(item.averageAccuracy));
    }

    function validateStep(stepId) {
      if (isDeveloperMode()) return true;
      if (!isSurveyStepComplete(stepId)) return false;
      const fields = state.fields || {};
      if (stepId === "question") return hasText(fields.materialFactors) && hasText(fields.questionFactor);
      if (stepId === "hypothesis") return hasText(fields.hypothesis);
      if (stepId === "plan") return hasText(fields.independentVariablePlan) && hasText(fields.dependentVariablePlan) && hasText(fields.controlVariablePlan) && hasText(fields.factor) && hasText(fields.difficulty) && (!isEmotionFactor(fields.factor) || hasText(fields.emotionCondition)) && hasValidNumber(fields.memorySeconds, 10, 180) && hasValidNumber(fields.restSeconds, 5, 240) && hasValidNumber(fields.interferenceSeconds, 5, 240);
      if (stepId === "evidence") return Array.isArray(state.records) && state.records.length > 0;
      if (stepId === "analysis") return Array.isArray(state.records) && state.records.length > 0 && (hasText(fields.headband) || hasStructuredMemberResult() || hasText(fields.teammate1Result) || hasText(fields.teammate2Result));
      if (stepId === "conclusion") return hasText(fields.conclusion);
      if (stepId === "reflection") return hasText(fields.strengths) && hasText(fields.improvements) && hasText(fields.learningInsight);
      return true;
    }

    function renderProgress() {
      normalizeStepAccess();
      progress.innerHTML = steps.map((step, index) => {
        const isActive = index === state.currentStep;
        const isDone = index < state.maxUnlockedStep;
        const isLocked = !isDeveloperMode() && index > state.maxUnlockedStep;
        const cls = isActive ? "is-active" : isDone ? "is-done" : isLocked ? "is-locked" : "";
        const lockedAttrs = isLocked ? ' aria-disabled="true" title="请先完成前一步内容，再进入下一步。"' : '';
        return `<button class="progress-step ${cls}" type="button" data-step="${index}"${lockedAttrs}><strong>${index + 1}</strong><span>${step.title}</span></button>`;
      }).join("");
      progress.querySelectorAll("[data-step]").forEach((button) => {
        button.addEventListener("click", () => {
          goToStep(Number(button.dataset.step));
        });
      });
    }

    function renderStep() {
      const step = steps[state.currentStep];
      main.classList.add("is-paged-step");
      main.innerHTML = `<section class="panel"><div class="panel-head"><h2>${step.id === "posttest" ? step.title : `${state.currentStep + 1}. ${step.title}`}</h2><p>建议时长：${step.minutes}</p></div><div class="panel-body">${getStepHtml(step.id)}</div></section>`;
      applyLearningBehaviorMetadata();
      bindInputs();
      bindStepEvents(step.id);
      window.TaskRelevance?.afterPageRender();
      window.TypingSupport?.afterPageRender();
    }
    function getStepHtml(stepId) {
      return {
        question: renderPagedQuestionStep,
        hypothesis: renderHypothesisStep,
        plan: renderPagedPlanStep,
        evidence: renderPagedEvidenceStep,
        analysis: renderPagedAnalysisStep,
        conclusion: renderPagedConclusionStep,
        reflection: renderPagedReflectionStep
      ,
        posttest: renderPosttestStep}[stepId]();
    }
    function renderPosttestStep() { return renderSurveyPage(); }

    function renderSurveyPage() {
      const pages = KNOWLEDGE_QUIZ.items.map((_, index) => ({
        title: `案件知识验证：第 ${index + 1} 题`,
        className: "quiz-page",
        content: () => renderKnowledgeQuizItem(index)
      }));
      [["postMeta", "meta"], ["cognitiveLoad", "load"], ["inquiryParticipation", "inquiry"]].forEach(([surveyKey, defKey]) => {
        const def = SURVEY_DEFS[defKey];
        for (let startIndex = 0; startIndex < def.items.length; startIndex += 3) {
          const endIndex = Math.min(startIndex + 3, def.items.length);
          pages.push({
            title: `${def.title}：第 ${startIndex + 1}–${endIndex} 题`,
            className: "survey-page",
            content: () => `<div class="survey-shell">${renderSurveyForm(surveyKey, defKey, startIndex, 3)}</div>`
          });
        }
      });
      pages.push({
        title: "完成侦探小结",
        className: "posttest-summary-page",
        content: () => `${renderSurveySummaryCards()}<div class="survey-intro"><h3>完成案件调查</h3><p>确认知识验证和三份问卷均已完成后，生成记忆侦探报告。</p></div>${renderPosttestExportArea()}`
      });
      return renderPagedStep("posttest", pages);
    }

    function renderPosttestExportArea() {
      return '<div class="actions" style="justify-content:flex-end;"><button class="btn secondary" type="button" id="reviewReportBtn">生成记忆侦探报告</button></div>';
    }

    function renderSurveyForm(surveyKey, defKey, startIndex = 0, pageSize = 3) {
      const def = SURVEY_DEFS[defKey];
      const answers = state.surveys?.current?.[surveyKey] || {};
      return '<section class="survey-card">' +
        '<div class="survey-card-head"><h4>' + def.title + '</h4><p class="survey-card-note">' + def.note + '</p></div>' +
        '<div class="survey-items">' +
          def.items.slice(startIndex, startIndex + pageSize).map((item, offset) => {
            const index = startIndex + offset;
            const itemKey = 'q' + (index + 1);
            return '<div class="survey-item"><p>' + (index + 1) + '. ' + escapeHtml(item) + '</p>' +
              '<div class="survey-scale" role="radiogroup" aria-label="' + escapeHtml(item) + '">' +
                def.scale.map((score) => {
                  const checked = Number(answers[itemKey]) === score;
                  const label = def.labels?.[score] || '';
                  return '<label class="survey-option ' + (checked ? 'is-selected' : '') + '">' +
                    '<input type="radio" name="' + surveyKey + '-' + itemKey + '" data-survey="' + surveyKey + '" data-question="' + itemKey + '" value="' + score + '" ' + (checked ? 'checked' : '') + '>' +
                    '<span class="survey-option-card"><span class="survey-score">' + score + '</span><span class="survey-label">' + escapeHtml(label) + '</span></span></label>';
                }).join('') +
              '</div></div>';
          }).join('') +
        '</div></section>';
    }

    function renderSurveySummaryCards() {
      const post = summarizeSurvey("postMeta", "meta");
      const load = summarizeSurvey("cognitiveLoad", "load");
      const inquiry = summarizeSurvey("inquiryParticipation", "inquiry");
      return '<div class="survey-summary">' +
        '<div><strong>' + post.answered + ' / ' + SURVEY_DEFS.meta.items.length + '</strong><span>学习收获调查完成进度</span></div>' +
        '<div><strong>' + load.answered + ' / ' + SURVEY_DEFS.load.items.length + '</strong><span>认知负荷完成进度</span></div>' +
        '<div><strong>' + inquiry.answered + ' / ' + SURVEY_DEFS.inquiry.items.length + '</strong><span>探究参与完成进度</span></div>' +
      '</div>';
    }
    function renderKnowledgeQuizItem(index) {
      const quiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
      if (state.knowledgeAssessment?.T3 || quiz.submitted || quiz.history.length) {
        return '<section class="quiz-section"><div class="quiz-result">即时知识测试已完成，作答已锁定。</div></section>';
      }
      const item = KNOWLEDGE_QUIZ.items[index];
      const itemKey = 'q' + (index + 1);
      const selectedAnswer = quiz.answers[itemKey] || '';
      return '<section class="quiz-section"><div class="survey-intro"><h3>🕵️ 案件知识验证</h3><p>请根据本次案件调查中获得的证据作答。</p></div>' +
        '<article class="quiz-card"><h4>第' + (index + 1) + '题</h4><p>' + escapeHtml(item.question) + '</p><div class="quiz-options">' +
        Object.keys(item.options).map((key) => {
          const checked = selectedAnswer === key;
          return '<label class="quiz-option ' + (checked ? 'is-selected' : '') + '"><input type="radio" name="knowledge-' + itemKey + '" data-quiz-question="' + itemKey + '" value="' + key + '" ' + (checked ? 'checked' : '') + (quiz.submitted ? ' disabled' : '') + '><span class="quiz-key">' + key + '</span><span class="quiz-label">' + escapeHtml(item.options[key]) + '</span></label>';
        }).join('') + '</div></article></section>';
    }

    function bindKnowledgeQuizInputs() {
      main.querySelectorAll('[data-quiz-question]').forEach((input) => {
        input.addEventListener('change', () => {
          state.knowledgeQuiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
          state.knowledgeQuiz.answers[input.dataset.quizQuestion] = input.value;
          saveState();
          renderApp();
        });
      });
    }

    function isKnowledgeQuizAnswered() {
      const quiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
      return KNOWLEDGE_QUIZ.items.every((_, index) => quiz.answers['q' + (index + 1)]);
    }

    function finalizeKnowledgeQuizOnce() {
      state.knowledgeQuiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
      state.knowledgeAssessment = knowledgeAssessmentApi.mergeTimelines(state.knowledgeAssessment, knowledgeAssessmentApi.readTimeline());
      if (state.knowledgeAssessment.T3) return true;
      if (state.knowledgeQuiz.submitted || state.knowledgeQuiz.history.length) return true;
      const unanswered = KNOWLEDGE_QUIZ.items.some((_, index) => !state.knowledgeQuiz.answers['q' + (index + 1)]);
      if (unanswered) {
        alert('请先完成全部案件知识验证题目。');
        return false;
      }
      let correctCount = 0;
      const wrongQuestions = [];
      KNOWLEDGE_QUIZ.items.forEach((item, index) => {
        const itemKey = 'q' + (index + 1);
        if (state.knowledgeQuiz.answers[itemKey] === item.answer) correctCount += 1;
        else wrongQuestions.push(index + 1);
      });
      const totalCount = KNOWLEDGE_QUIZ.items.length;
      const score = totalCount ? Math.round((correctCount / totalCount) * 100) : 0;
      const submittedAt = new Date().toISOString();
      const record = normalizeKnowledgeQuizRecord({
        attemptNumber: state.knowledgeQuiz.history.length + 1,
        submittedAt,
        score,
        correctCount,
        totalCount,
        accuracy: score,
        answers: state.knowledgeQuiz.answers,
        wrongQuestions
      }, state.knowledgeQuiz.history.length);
      state.knowledgeQuiz.history.push(record);
      state.knowledgeQuiz.correctCount = record.correctCount;
      state.knowledgeQuiz.score = record.score;
      state.knowledgeQuiz.submitted = true;
      state.knowledgeQuiz.submittedAt = record.submittedAt;
      state.knowledgeQuiz.wrongQuestions = record.wrongQuestions;
      const assessmentDraft = {
        questionOrder: KNOWLEDGE_QUIZ.items.map((item) => item.id),
        answers: Object.fromEntries(KNOWLEDGE_QUIZ.items.map((item, index) => [item.id, state.knowledgeQuiz.answers['q' + (index + 1)]]))
      };
      state.knowledgeAssessment = knowledgeAssessmentApi.submitStage(state.knowledgeAssessment, "T3", KNOWLEDGE_QUIZ.items, assessmentDraft).timeline;
      saveState();
      renderApp();
      return true;
    }

    function bindSurveyInputs() {
      main.querySelectorAll("[data-survey]").forEach((input) => {
        input.addEventListener("change", () => {
          const surveyKey = input.dataset.survey;
          const questionKey = input.dataset.question;
          state.surveys = mergeSurveys(state.surveys);
          state.surveys.current[surveyKey][questionKey] = Number(input.value);
          saveState();
          renderApp();
        });
      });
    }

    function summarizeSurvey(surveyKey, defKey) {
      const def = SURVEY_DEFS[defKey];
      const answers = state.surveys?.current?.[surveyKey] || {};
      const values = def.items.map((_, index) => Number(answers['q' + (index + 1)] || 0)).filter(Boolean);
      const total = values.reduce((sum, value) => sum + value, 0);
      return { answered: values.length, total, average: values.length ? Number((total / values.length).toFixed(2)) : 0, complete: values.length === def.items.length };
    }

    function isSurveyStepComplete(stepId) {
      if (stepId === "posttest") return summarizeSurvey("postMeta", "meta").complete && summarizeSurvey("cognitiveLoad", "load").complete && summarizeSurvey("inquiryParticipation", "inquiry").complete && isKnowledgeQuizAnswered();
      return true;
    }

    function getSurveySheets() {
      const makeSheet = (title, surveyKey, defKey) => {
        const def = SURVEY_DEFS[defKey];
        const answers = state.surveys?.current?.[surveyKey] || {};
        const summary = summarizeSurvey(surveyKey, defKey);
        return [title, [
          ["题号", "题目", "得分"],
          ...def.items.map((item, index) => [String(index + 1), item, answers['q' + (index + 1)] || ""]),
          ["合计", "总分", summary.total],
          ["合计", "均分", summary.average]
        ]];
      };
      const post = summarizeSurvey("postMeta", "meta");
      const load = summarizeSurvey("cognitiveLoad", "load");
      const inquiry = summarizeSurvey("inquiryParticipation", "inquiry");
      return [
        makeSheet("学习收获调查", "postMeta", "meta"),
        makeSheet("侦探小结-认知负荷", "cognitiveLoad", "load"),
        makeSheet("侦探小结-探究参与", "inquiryParticipation", "inquiry"),
        ["问卷汇总", [
          ["问卷", "已答题数", "总分", "均分", "完成情况"],
          ["学习收获调查", post.answered, post.total, post.average, post.complete ? "已完成" : "未完成"],
          ["侦探小结认知负荷", load.answered, load.total, load.average, load.complete ? "已完成" : "未完成"],
          ["侦探小结科学探究参与", inquiry.answered, inquiry.total, inquiry.average, inquiry.complete ? "已完成" : "未完成"]
        ]]
      ];
    }


    function renderInquiryScaffold(type) {
      if (type === "hypothesis") {
        return '<div class="inquiry-helper">' +
          '<div class="helper-card"><h4>\u7814\u7a76\u5047\u8bbe\u601d\u8003\u70b9</h4><ul><li>\u5b83\u662f\u5426\u56de\u5e94\u4e86\u4f60\u4eec\u7684\u7814\u7a76\u95ee\u9898\uff1f</li><li>\u5b83\u662f\u5426\u8bf4\u660e\u4e86\u4f60\u4eec\u5bf9\u7ed3\u679c\u7684\u9884\u6d4b\uff1f</li><li>\u5b83\u662f\u5426\u53ef\u4ee5\u88ab\u540e\u9762\u7684\u6570\u636e\u652f\u6301\u6216\u53cd\u9a73\uff1f</li></ul></div>' +
        '</div>';

    function getStepPageIndex(stepId) {
      return Number(stepPageIndexes[stepId] || 0);
    }
    function setStepPageIndex(stepId, pageIndex) {
      stepPageIndexes[stepId] = pageIndex;
    }
    function getStepPageCount(stepId) {
      const counts = {
        question: 4,
        hypothesis: 1,
        plan: 6,
        evidence: 1 + Math.ceil(getEvidenceRunGroups().length / getEvidencePageSize()),
        analysis: 3,
        conclusion: 2,
        reflection: 3
      };
      if (stepId !== "posttest") return counts[stepId] || 1;
      return KNOWLEDGE_QUIZ.items.length + Math.ceil(SURVEY_DEFS.meta.items.length / 3) + Math.ceil(SURVEY_DEFS.load.items.length / 3) + Math.ceil(SURVEY_DEFS.inquiry.items.length / 3) + 1;
    }
    function renderPagedStep(stepId, pages) {
      const pageCount = pages.length;
      const pageIndex = Math.min(Math.max(getStepPageIndex(stepId), 0), pageCount - 1);
      setStepPageIndex(stepId, pageIndex);
      const page = pages[pageIndex];
      const isFirstExperimentPage = state.currentStep === 0 && pageIndex === 0;
      const isFinalExperimentPage = state.currentStep === steps.length - 1 && pageIndex === pageCount - 1;
      return `<div class="question-flow step-page-flow" data-paged-step="${escapeHtml(stepId)}" data-page-count="${pageCount}">
        <div class="question-page-head"><h3>${page.title}</h3><span class="question-page-progress" aria-live="polite">${steps[state.currentStep].title} ${pageIndex + 1}/${pageCount}</span></div>
        <div class="question-page-content step-page-content ${page.className || ""}">${page.content()}</div>
        <div class="question-page-actions ${isFirstExperimentPage ? "is-first" : ""}">${isFirstExperimentPage ? "" : '<button class="btn secondary" type="button" id="stepPrevPage">上一页</button>'}${isFinalExperimentPage ? "" : '<button class="btn" type="button" id="stepNextPage">下一页</button>'}</div>
      </div>`;
    }
    function changeStepPage(stepId, targetPage, pageCount) {
      const currentPage = getStepPageIndex(stepId);
      const target = Math.min(Math.max(targetPage, 0), pageCount - 1);
      if (target === currentPage || stepPageTransitioning) return;
      preparePagedInputLifecycle();
      const content = main.querySelector(".question-page-content");
      const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
      const finish = () => {
        setStepPageIndex(stepId, target);
        stepPageTransitioning = false;
        renderStep();
      };
      if (!content || reduceMotion) return finish();
      stepPageTransitioning = true;
      content.classList.add("is-leaving");
      window.setTimeout(finish, 150);
    }
    function preparePagedInputLifecycle() {
      const active = document.activeElement;
      if (active?.matches?.('textarea[data-agent-track="true"]')) active.blur();
      window.TaskRelevance?.beforePageChange();
      window.TypingSupport?.beforePageChange();
    }
    function bindPagedStepEvents(stepId) {
      const pageCount = getStepPageCount(stepId);
      const pageIndex = getStepPageIndex(stepId);
      document.getElementById("stepPrevPage")?.addEventListener("click", () => {
        if (pageIndex > 0) return changeStepPage(stepId, pageIndex - 1, pageCount);
        const previousStep = state.currentStep - 1;
        if (previousStep < 0) return;
        const previousStepId = steps[previousStep].id;
        setStepPageIndex(previousStepId, getStepPageCount(previousStepId) - 1);
        goToStep(previousStep);
      });
      document.getElementById("stepNextPage")?.addEventListener("click", () => {
        if (pageIndex < pageCount - 1) changeStepPage(stepId, pageIndex + 1, pageCount);
        else {
          preparePagedInputLifecycle();
          goNextStep();
        }
      });
    }

        { title: "阅读材料：长时记忆的三种干扰因素", className: "question-page-material", content: () => `<div class="question-materials-combined"><article class="reading-card"><h4>材料一：新旧记忆干扰</h4><p>在接受新信息时，大脑还储存着以前学习的信息。旧记忆对新记忆的干扰叫“前摄干扰”，新记忆对旧记忆的干扰叫“倒摄干扰”。</p><p>连续学习多个内容时，旧内容可能妨碍后续学习；学习新环境或新知识后，也可能更难回忆旧环境或旧知识的细节。</p></article><article class="reading-card"><h4>材料二：材料相似性</h4><p>回忆信息时，如果大脑中存在许多相似记忆，更容易发生干扰。平常的一顿午餐可能很难回忆，而一次独特的饭菜往往更容易记住。</p><p>请思考：记忆材料和随后出现的材料越相似，回忆成绩可能发生什么变化？</p></article><article class="reading-card"><h4>材料三：情绪状态</h4><p>情绪状态会影响注意、编码与提取。过度紧张、悲伤或兴奋时，人可能把更多注意资源用于情绪体验，从而影响对材料的记忆。</p><p>通过比较不同情绪条件下的回忆结果，可以检验情绪状态是否造成长时记忆干扰。</p></article></div>` },

    function renderQuestionStep() {
      return `<div class="single-step-layout">
        <div class="question-intro-strip">
          <p>你有没有这样的经历：在回忆一篇课文时，开头和结尾的内容记得很清楚，但中间部分却总是模糊不清？其实，这可能是因为你的长时记忆受到了一些干扰。</p>

        </div>
        <div class="panel"><div class="panel-head"><h3>阅读材料</h3><p>下面是三则关于长时记忆干扰的材料，请阅读以下材料，想一想还有什么因素会干扰长时记忆。</p></div><div class="panel-body reading-list">
          <article class="reading-card">
            <h4>材料一</h4>
            <p>在接受新信息的同时，我们的脑海还储存着以前学习的信息，这些新旧记忆具有相似之处，会相互干扰导致遗忘。其中，旧记忆对新记忆的干扰叫做“前摄干扰”，新记忆对旧记忆的干扰叫做“倒摄干扰”。</p>
            <p>在连续学习多个内容时，常常发生前摄干扰。想一想你背诵过的课文，是不是对开头几段的记忆最为深刻，后面就越来越难背了呢？</p>
            <p>而倒摄干扰就像是你学到的新知识“覆盖”了旧知识，会让旧的记忆变得模糊不清，甚至完全遗忘。这就是为什么在换到全新的教室之后，你更难以记起旧教室的种种细节：除了时间长导致的淡忘，这些记忆还可能是受到有关新教室记忆的干扰。</p>

            <p>在那些情绪激动的时刻，比如观看一场精彩的球赛或者第一次见到震撼人心的美景时，你是否会印象更深刻？或者，你有没有过表演前太紧张，感到大脑一片空白的经历？情绪状态不同，对记忆的干扰程度也不同。你认为什么样的情绪会减轻记忆的干扰、什么样的情绪会加重记忆的干扰呢？</p>

    function renderPlanStep() {

      const showEmotionCondition = isEmotionFactor(state.fields.factor);
      return `<div class="single-step-layout">
        <div class="panel"><div class="panel-head"><h3>变量设计</h3><p>请根据小组选择的探究因素，填写变量。</p></div><div class="panel-body">
          <div class="variable-table-wrap">
            <table class="variable-table">
              <tbody>
                <tr><td>自变量（两轮实验中需要改变的条件）：</td><td><textarea data-field="independentVariablePlan">${escapeHtml(state.fields.independentVariablePlan)}</textarea></td></tr>

              </tbody>

        </div></div>
        <div class="panel"><div class="panel-head"><h3>实验材料</h3></div><div class="panel-body reading-list">
          <details class="material-details" open><summary>实验材料一：倒摄干扰的实验设计（参考）</summary><div class="material-details-body">
            <p>我们可以通过以下方式探究新学习内容是否会干扰旧知识的记忆。参与者需要进行两轮“记忆阶段—休息/干扰阶段—测试阶段”的完整操作。</p>
            <p>第一轮实验：</p>
            <p>1）记忆阶段，参与者先学习1分钟记忆材料，</p>
            <p>2）安静地休息3分钟，</p>
            <p>3）参与者回想记忆过的材料的内容，尽可能多地写在纸上。</p>
            <p>第二轮实验：</p>
            <p>1）记忆阶段，参与者学习1分钟新的记忆材料，</p>
            <p>2）安静地休息1分钟，</p>
            <p>3）参与者学习2分钟干扰材料，</p>
            <p>4）回忆并复述出记忆材料的内容。</p>
            <p>如果两次得分差别不大，可以考虑调整材料的难度等级。你认为还有什么原因可能导致出现与预期不符的结果？</p>
          </div></details>
          <details class="material-details"><summary>实验材料二：相似性干扰实验设计（参考）</summary><div class="material-details-body">
            <p>可以通过这个实验设计探究材料的相似性对长时记忆的干扰。</p>
            <p>第一轮实验：</p>
            <p>1）记忆阶段，参与者进行1分钟记忆材料的学习，</p>
            <p>2）休息阶段，安静地休息1分钟，</p>
            <p>3）干扰阶段，参与者学习2分钟干扰材料，</p>
            <p>4）测试阶段，参与者回想记忆过的材料的内容，尽可能多地写在纸上。</p>
            <p>第二轮实验：</p>
            <p>1）记忆阶段，参与者进行1分钟记忆材料的学习，</p>
            <p>2）休息阶段，安静地休息1分钟，</p>
            <p>3）干扰阶段，参与者学习2分钟干扰材料。与第一轮的材料相比，第二轮的干扰材料与记忆材料的相似性更高。</p>
            <p>4）测试阶段，参与者回想记忆过的材料的内容，尽可能多地写在纸上。</p>
            <p>每轮测试完成后，记录员将背诵的正确率和反应时记录在实验记录表上。</p>
          </div></details>
          <details class="material-details"><summary>实验材料三：情绪干扰实验设计（参考）</summary><div class="material-details-body">
            <p>以下实验设计探究了不同的情绪状态是否会干扰长时记忆的编码阶段。基本思路是：通过播放不同的视频，改变参与者的情绪激活状态，观察在不同情绪下记忆效果的差异以得出结论。</p>
            <p>每位参与者独立完成两轮实验，在不同的情绪状态中完成记忆任务。</p>
            <p>第一轮实验：</p>
            <p>1）先播放一段中性视频，使参与者进入放松的情绪状态，</p>
            <p>2）随后，进行1分钟的记忆阶段，</p>
            <p>3）参与者安静地休息1分钟，</p>
            <p>4）测试阶段，参与者需要尽可能多地复述出记忆材料。</p>
            <p>第二轮实验：</p>
            <p>1）选择并播放能够激发参与者愉悦或悲伤情绪的视频，</p>
            <p>2）随后，进行1分钟的记忆阶段，</p>
            <p>3）参与者安静地休息1分钟，</p>
            <p>4）测试阶段，参与者需要尽可能多地复述出记忆材料。</p>
          </div></details>
          <details class="material-details"><summary>实验材料四：头环的使用说明</summary><div class="material-details-body">
            <p>本次探究活动中，我们会使用一个特殊的工具——头环。它就像一个特殊的“脑力探测器”，只要戴在头上，就可以在电脑显示屏上生成一幅3D的脑激活图，展示大脑不同脑区神经活动的空间分布状态。</p>
            <p>3D脑图会用颜色直观呈现被激活脑区的位置、范围和强度，告诉我们在实验过程中大脑中哪些地方在努力“思考”。红-黄色表示脑区更活跃、激活强度高，蓝-冷色表示抑制或无变化。</p>
            <p>证据搜集环节中，头环帮助你获得更科学的实验数据：在记忆阶段与测试阶段，头环会显示出你的大脑活动强度，帮助你判断当前进行的任务是否棘手、题目难度是否适宜；受到不同的干扰时，头环的数据能显示大脑哪些区域被激活，帮助你判断干扰发生的时间、产生的原因。有了这些数据，就能够得到更科学、更精确的探究结论。</p>
            <p>使用头环时要注意：保持额头清洁，确保电极贴片贴紧；实验过程中保持专注；认真观察和记录每个环节的颜色变化。</p>
            <div class="headband-image-container">
              <picture>
                <source srcset="assets/headband-guide.webp" type="image/webp">
                <img src="assets/headband-guide.png" alt="头环工作原理示意图" class="headband-guide-image" width="1536" height="1024" loading="lazy" decoding="async">
              </picture>
            </div>
            <p>在阅读了实验材料后，你是否掌握了实验的流程呢？请完成实验步骤的设计吧。</p>
          </div></details>
        </div></div>
        <div class="panel"><div class="panel-head"><h3>实验计划</h3><p>选择材料包后，搜集证据阶段会按 PPT 固定材料和两轮流程运行。</p></div><div class="panel-body"><div class="form-grid">
          <div class="field"><label>实验类型</label><select data-field="factor">${factorOptions}</select></div>
          <div class="field"><label>参与者编号</label><input type="text" data-field="participant" value="${escapeHtml(state.fields.participant)}" placeholder="请输入参与者编号"></div>
          <div class="field"><label>材料难度</label><select data-field="difficulty"><option value="easy" ${selected("difficulty","easy")}>初级</option><option value="medium" ${selected("difficulty","medium")}>中级</option><option value="hard" ${selected("difficulty","hard")}>高级</option></select></div>
          ${showEmotionCondition ? `<div class="field"><label>情绪视频条件</label><select data-field="emotionCondition"><option value="">请选择情绪视频条件</option><option value="中性" ${selected("emotionCondition","中性")}>中性</option><option value="悲伤" ${selected("emotionCondition","悲伤")}>悲伤</option><option value="愉悦" ${selected("emotionCondition","愉悦")}>愉悦</option></select></div>` : ""}
          <div class="field"><label>记忆时间（秒）</label><input type="number" min="10" max="180" data-field="memorySeconds" value="${escapeHtml(state.fields.memorySeconds)}"></div>
          <div class="field"><label>休息时间（秒）</label><input type="number" min="5" max="240" data-field="restSeconds" value="${escapeHtml(state.fields.restSeconds)}"></div>
          <div class="field"><label>干扰时间（秒）</label><input type="number" min="5" max="240" data-field="interferenceSeconds" value="${escapeHtml(state.fields.interferenceSeconds)}"></div>
          <div class="field"><label>测试轮次</label><input type="number" min="1" max="2" value="2" disabled></div>
        </div></div></div>
      </div>`;
    }
    function getEvidenceRunGroups() {
      const groups = new Map();
      (state.records || []).forEach((record, index) => {
        const key = record.runId || `legacy:${record.participant || ""}:${record.round || index + 1}:${record.createdAt || ""}`;
        if (!groups.has(key)) groups.set(key, { key, firstIndex: index, records: [] });
        groups.get(key).records.push(record);
      });
      return Array.from(groups.values()).sort((left, right) => left.firstIndex - right.firstIndex);
    }
    function getEvidencePageSize() {
      return window.matchMedia?.("(max-width: 640px)").matches ? 1 : 3;
    }
    function getNextEvidenceRound() {
      const rounds = getSelectedDifficultySet().rounds || [];
      if (!rounds.length) return 1;
      const participant = state.fields.participant || state.studentId;
      const completed = (state.records || []).filter((record) => record.participant === participant && record.factor === state.fields.factor && record.difficulty === state.fields.difficulty).length;
      return rounds[completed % rounds.length]?.round || rounds[0].round;
    }
    function getNextEvidenceRunNumber() {
      const participant = state.fields.participant || state.studentId;
      return (state.records || []).filter((record) => record.participant === participant).length + 1;
    }
    function renderEvidenceSetup() {
      const pack = getSelectedMaterialPack();
      const set = getSelectedDifficultySet();
      const round = getNextEvidenceRound();
      const definition = (set.rounds || []).find((item) => Number(item.round) === Number(round)) || (set.rounds || [])[0] || {};
      return `<div class="panel"><div class="panel-head"><h3>长时记忆干扰材料化实验</h3><p>参数来自制定计划，当前页面仅用于核对和开始测量。</p></div><div class="panel-body"><div class="readonly-plan-grid"><div class="field"><label>参与者</label><div class="readonly-value">${escapeHtml(state.fields.participant || state.studentId)}</div></div><div class="field"><label>自动测量序号</label><div class="readonly-value">第 ${getNextEvidenceRunNumber()} 次</div></div><div class="field"><label>当前固定条件</label><div class="readonly-value">${escapeHtml(definition.condition || `条件 ${round}`)}</div></div><div class="field"><label>实验类型</label><div class="readonly-value">${escapeHtml(state.fields.factor)}</div></div><div class="field"><label>材料与难度</label><div class="readonly-value">${escapeHtml(set.materialType)} · ${escapeHtml(pack.difficultyLabels[state.fields.difficulty] || state.fields.difficulty)}</div></div><div class="field"><label>阶段时间</label><div class="readonly-value">记忆 ${escapeHtml(state.fields.memorySeconds)}s · 休息 ${escapeHtml(state.fields.restSeconds)}s · 干扰 ${escapeHtml(state.fields.interferenceSeconds)}s</div></div>${isEmotionFactor(state.fields.factor) ? `<div class="field"><label>情绪条件</label><div class="readonly-value">${escapeHtml(state.fields.emotionCondition)}</div></div>` : ""}</div><p class="evidence-instructions">开始后进入低干扰全屏界面。按提示完成任务；提交后系统自动保存本次记录。</p><div class="actions"><button class="btn secondary" type="button" id="editPlanBtn">返回制定计划修改</button><button class="btn" type="button" id="startRunBtn">开始测量</button></div><div class="experiment-game evidence-game-shell"><div class="stage"><div class="stage-meta"><span id="phaseStatus">准备开始</span><span id="conditionStatus">${escapeHtml(state.fields.factor)}</span></div><div id="taskCard" class="task-card"><h3>长时记忆干扰实验</h3><p>点击“开始测量”进入固定材料流程。</p></div><div id="answerBox" class="answer-box"><label for="recallInput">尽可能完整写出刚才记忆过的目标材料</label><textarea id="recallInput" placeholder="可用空格、逗号或换行分隔"></textarea><button class="btn" type="button" id="submitRecallBtn" style="width:100%;margin-top:12px;">提交本次结果</button></div><div class="timer"><div id="timerFill" class="timer-fill"></div></div></div><aside class="game-side"><div class="stat-grid"><div class="mini-stat"><span>阶段</span><b id="phaseStat">--</b></div><div class="mini-stat"><span>剩余时间</span><b id="timeStat">--</b></div><div class="mini-stat"><span>得分</span><b id="correctStat">0</b></div><div class="mini-stat"><span>正确率</span><b id="accuracyStat">0%</b></div></div><div class="game-log"><table><thead><tr><th>序号</th><th>条件</th><th>得分</th><th>正确率</th></tr></thead><tbody id="gameLogBody"><tr><td colspan="4">尚未开始本次测量</td></tr></tbody></table></div></aside></div><div id="focusPrep" class="focus-prep" role="dialog" aria-modal="true"><div class="focus-prep-card"><h3>准备开始材料化实验</h3><p>页面将切换到低干扰模式，并尝试进入全屏。</p><p>测试阶段请根据提示输入回忆内容。</p><button class="btn" type="button" id="confirmStartRunBtn">进入实验</button><button class="btn secondary" type="button" id="cancelStartRunBtn">取消</button></div></div></div></div>`;
    }
    function renderEvidenceResultCard(group, displayIndex) {
      const record = group.records[0] || {};
      const validity = record.score === undefined && record.correctCount === undefined ? "记录不完整" : "有效";
      return `<article class="run-result-card"><h4>测量 ${displayIndex} · ${escapeHtml(record.condition || "历史记录")}</h4><dl><dt>参与者</dt><dd>${escapeHtml(record.participant || "--")}</dd><dt>实验类型</dt><dd>${escapeHtml(record.factor || "--")}</dd><dt>材料/难度</dt><dd>${escapeHtml(record.materialType || "--")} / ${escapeHtml(record.difficultyLabel || record.difficulty || "--")}</dd><dt>固定条件</dt><dd>${escapeHtml(record.condition || "--")}</dd><dt>时间参数</dt><dd>记忆 ${escapeHtml(record.memorySeconds || "--")}s，休息 ${escapeHtml(record.restSeconds || "--")}s，干扰 ${escapeHtml(record.interferenceSeconds || "--")}s</dd><dt>回忆内容</dt><dd>${escapeHtml(record.recall || "未填写")}</dd><dt>命中内容</dt><dd>${escapeHtml(record.correctItems || "无")}</dd><dt>结果</dt><dd>${escapeHtml(record.score ?? record.correctCount ?? "--")} / ${escapeHtml(record.fullScore || "--")}，${escapeHtml(record.accuracy ?? "--")}%</dd><dt>反应时</dt><dd>${escapeHtml(record.reactionTime || "--")} ms</dd><dt>有效性</dt><dd>${validity}</dd><dt>记录时间</dt><dd>${escapeHtml(record.createdAt || "--")}</dd></dl></article>`;
    }
    function renderPagedEvidenceStep() {
      const groups = getEvidenceRunGroups();
      const pageSize = getEvidencePageSize();
      const pages = [{ title: groups.length ? "继续搜集证据" : "开始搜集证据", className: "evidence-page", content: renderEvidenceSetup }];
      for (let index = 0; index < groups.length; index += pageSize) {
        const pageGroups = groups.slice(index, index + pageSize);
        pages.push({ title: `测量结果 ${Math.floor(index / pageSize) + 1}/${Math.ceil(groups.length / pageSize)}`, className: "evidence-results-page", content: () => `<div class="run-results-grid">${pageGroups.map((group, offset) => renderEvidenceResultCard(group, index + offset + 1)).join("")}</div>` });
      }
      return renderPagedStep("evidence", pages);
    }

    function renderEvidenceStep() {
      const pack = getSelectedMaterialPack();
      const set = getSelectedDifficultySet();
      const rounds = set.rounds || [];
      const showEmotionCondition = isEmotionFactor(state.fields.factor);
      return `<div class="panel"><div class="panel-head"><h3>长时记忆干扰材料化实验</h3><p>当前使用固定材料包，不再随机生成核心记忆材料。</p><div class="material-source"><span class="material-chip">${escapeHtml(pack.source)}</span><span class="material-chip">${escapeHtml(set.materialType)}</span><span class="material-chip">${escapeHtml(pack.difficultyLabels[state.fields.difficulty] || state.fields.difficulty)}</span></div></div><div class="panel-body">
        <div class="toolbar interference-toolbar">
          <div class="field"><label>本次轮次</label><select id="roundSelect">${rounds.map((round)=>`<option value="${round.round}">第 ${round.round} 轮：${round.condition}</option>`).join("")}</select></div>
          <div class="field"><label>参与者编号</label><input id="participantInput" type="text" value="${escapeHtml(state.fields.participant)}" placeholder="请输入参与者编号"></div>
          ${showEmotionCondition ? `<div class="field"><label>情绪条件</label><select id="emotionConditionSelect"><option value="中性" ${selected("emotionCondition","中性")}>中性</option><option value="悲伤" ${selected("emotionCondition","悲伤")}>悲伤</option><option value="愉悦" ${selected("emotionCondition","愉悦")}>愉悦</option></select></div>` : ""}
          <button class="btn" type="button" id="startRunBtn">开始本轮</button>

    function splitRecordedItems(value) {
      if (Array.isArray(value)) return value.map(String);
      return String(value || "").split("；").map((item) => item.trim()).filter(Boolean);
    }
    function sameMaterialItems(left, right) {
      const leftItems = splitRecordedItems(left);
      const rightItems = splitRecordedItems(right);
      return leftItems.length === rightItems.length && leftItems.every((item, index) => item === rightItems[index]);
    }
    function findVariantIndex(roundDefinition, record) {
      return roundDefinition.variants.findIndex((variant) =>
        sameMaterialItems(record.memoryItems, variant.memory) && sameMaterialItems(record.interferenceItems, variant.interference || [])
      );
    }
    function chooseRandom(items) {
      return items[Math.floor(Math.random() * items.length)];
    }
    function selectMaterialVariant(set, roundDefinition, participant) {
      const matchingRecords = (state.records || []).filter((record) =>
        String(record.participant || "") === String(participant || "") &&
        record.factor === state.fields.factor &&
        record.difficulty === state.fields.difficulty
      );
      const currentRoundRecords = matchingRecords.filter((record) => Number(record.round) === Number(roundDefinition.round));
      const usedIndexes = new Set(currentRoundRecords.map((record) => findVariantIndex(roundDefinition, record)).filter((index) => index >= 0));
      const oppositeRound = set.rounds.find((item) => Number(item.round) !== Number(roundDefinition.round));
      const oppositeRecord = matchingRecords.slice().reverse().find((record) => Number(record.round) === Number(oppositeRound?.round));
      if (oppositeRound && oppositeRecord) {
        const pairedIndex = findVariantIndex(oppositeRound, oppositeRecord);
        if (pairedIndex >= 0 && !usedIndexes.has(pairedIndex)) return roundDefinition.variants[pairedIndex];
      }
      const unusedIndexes = roundDefinition.variants.map((_, index) => index).filter((index) => !usedIndexes.has(index));
      if (unusedIndexes.length) return roundDefinition.variants[chooseRandom(unusedIndexes)];
      const usageCounts = roundDefinition.variants.map((_, index) => currentRoundRecords.filter((record) => findVariantIndex(roundDefinition, record) === index).length);
      const minimumUsage = Math.min(...usageCounts);
      const leastUsedIndexes = usageCounts.map((count, index) => count === minimumUsage ? index : -1).filter((index) => index >= 0);
      return roundDefinition.variants[chooseRandom(leastUsedIndexes)];
    }
    function getRoundMaterial(roundNumber, participant) {
      const set = getSelectedDifficultySet();
      const roundDefinition = set.rounds.find((item) => Number(item.round) === Number(roundNumber)) || set.rounds[0];
      const variant = selectMaterialVariant(set, roundDefinition, participant);
      return {
        round: roundDefinition.round,
        condition: roundDefinition.condition,
        memory: variant.memory.slice(),
        interference: (variant.interference || []).slice(),
        instruction: roundDefinition.instruction,
        interferenceInstruction: roundDefinition.interferenceInstruction
      };
    }
