    function migrateExperimentRecords(records) {
      const source = Array.isArray(records) ? records : [];
      const withoutCodeMaterials = source.filter((record) => !isCodeMaterialRecord(record));
      const lastIndexByCombination = new Map();
      withoutCodeMaterials.forEach((record, index) => {
        const key = getRecordCombinationKey(record);
        if (key) lastIndexByCombination.set(key, index);
      });
      return withoutCodeMaterials.filter((record, index) => {
        const key = getRecordCombinationKey(record);
        return !key || lastIndexByCombination.get(key) === index;
      });
    }
    function migrateTeamResultFields(fields) {
      [1, 2].forEach((index) => {
        const result = fields[`teammate${index}Result`];
        const correctField = `teammate${index}AvgCorrect`;
        const accuracyField = `teammate${index}AvgAccuracy`;
        if ((fields[correctField] === "" || fields[correctField] == null) && typeof result === "string") {
          const correct = result.match(/平均正确数\s*([0-9]+(?:\.[0-9]+)?)/);
          if (correct) fields[correctField] = correct[1];
        }
        if ((fields[accuracyField] === "" || fields[accuracyField] == null) && typeof result === "string") {
          const accuracy = result.match(/平均回忆率\s*([0-9]+(?:\.[0-9]+)?)/);
          if (accuracy) fields[accuracyField] = accuracy[1];
        }
      });

    function migrateLegacyStepIndex(value) {

    function escapeHtml(value) { return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }

    }
    function getThinkingRows() {

    }
    function renderStrategySelect(field, value = state.fields[field], disabled = false) {
      return `<select data-field="${field}" ${disabled ? "disabled" : ""}>${MEMORY_STRATEGIES.map((strategy)=>`<option value="${strategy}" ${value === strategy ? "selected" : ""}>${strategy}</option>`).join("")}</select>`;
    }
    function renderExperimentStrategySelect(field, value = state.fields[field], disabled = false) {
      const normalized = EXPERIMENT_STRATEGIES.includes(value) ? value : EXPERIMENT_STRATEGIES[0];
      return `<select data-field="${field}" ${disabled ? "disabled" : ""}>${EXPERIMENT_STRATEGIES.map((strategy)=>`<option value="${strategy}" ${normalized === strategy ? "selected" : ""}>${strategy}</option>`).join("")}</select>`;
    }
    function formatMatchSelections() {
      const selections = state.fields.strategyMatchSelections || {};
      return ["material1", "material2", "material3", "material4"].map((key, index)=>`材料${index + 1}：${(selections[key] || []).join("、") || "未选择"}`).join("；");
    }
    function renderApp() {
      if (!state.studentId || !state.groupId) {
        main.innerHTML = `<section class="panel"><div class="panel-head"><h2>需要先填写学生编号和小组编号</h2><p>请返回实验选择页录入身份信息后再进入实验。</p></div><div class="panel-body"><button class="btn" type="button" onclick="location.href='index.html'">返回实验选择</button></div></section>`;

    function clampStepIndex(value) {
      const index = Number(value);
      if (!Number.isInteger(index)) return 0;
      return Math.min(Math.max(index, 0), steps.length - 1);
    }

    function normalizeStepAccess() {
      const legacyCurrent = clampStepIndex(state.currentStep);
      if (!Number.isInteger(Number(state.maxUnlockedStep))) {
        state.maxUnlockedStep = legacyCurrent;
      } else {
        state.maxUnlockedStep = clampStepIndex(state.maxUnlockedStep);
      }
      state.currentStep = isDeveloperMode() ? legacyCurrent : Math.min(legacyCurrent, state.maxUnlockedStep);
    }

    function showStepMessage(message) {
      alert(message);
    }

    function getFirstUnansweredSurveyQuestion(surveyKey, itemCount) {
      const answers = state.surveys?.current?.[surveyKey] || {};
      for (let index = 0; index < itemCount; index += 1) {
        if (!Number(answers[`q${index + 1}`])) return index;
      }
      return -1;
    }

    function getIncompletePosttestPage() {
      const quizAnswers = state.knowledgeQuiz?.answers || {};
      for (let index = 0; index < KNOWLEDGE_QUIZ.items.length; index += 1) {
        if (!quizAnswers[`q${index + 1}`]) return index;
      }
      let offset = KNOWLEDGE_QUIZ.items.length;
      for (const [surveyKey, defKey] of [["postMeta", "meta"], ["cognitiveLoad", "load"], ["inquiryParticipation", "inquiry"]]) {
        const missing = getFirstUnansweredSurveyQuestion(surveyKey, SURVEY_DEFS[defKey].items.length);
        if (missing >= 0) return offset + Math.floor(missing / 3);
        offset += Math.ceil(SURVEY_DEFS[defKey].items.length / 3);
      }
      return Math.max(0, getStepPageCount("posttest") - 1);
    }

    function getIncompleteStepPage(stepId) {
      const fields = state.fields || {};
      if (stepId === "question") {
        if (!hasText(fields.brainstormIndividual) || !hasText(fields.brainstormGroup)) return 0;
        if (fields.strategyMatchConfirmed !== true) return 6;
        return 7;
      }
      if (stepId === "hypothesis") return hasText(fields.hypothesis1) ? 1 : 0;
      if (stepId === "plan") {
        if (!hasText(fields.strategy1) || !hasText(fields.strategy2)) return 3;
        if (getPlannedItemCount(1) <= 0) return 4;
        return 5;
      }
      if (stepId === "evidence") return 0;
      if (stepId === "analysis") return Array.isArray(state.records) && state.records.length ? 2 : 0;
      if (stepId === "conclusion") return 0;
      if (stepId === "reflection") {
        if (!hasText(fields.designImprove)) return 0;
        if (!hasText(fields.surprise)) return 1;
        return 2;
      }
      if (stepId === "posttest") return getIncompletePosttestPage();
      return Math.max(0, getStepPageIndex(stepId));
    }

    function getIncompleteStepMessage(stepId) {
      const pageCount = getStepPageCount(stepId);
      const pageNumber = Math.min(Math.max(getIncompleteStepPage(stepId), 0), pageCount - 1) + 1;
      return `请先完成本步骤内容。（${steps[state.currentStep].title}${pageNumber}/${pageCount}）`;
    }

    function goToStep(targetStep) {
      const target = clampStepIndex(targetStep);
      if (!isDeveloperMode() && target > state.maxUnlockedStep) {
        showStepMessage("请先完成前一步内容，再进入下一步。");
        return;
      }
      state.currentStep = target;
      if (!isDeveloperMode()) saveState();
      renderApp();
    }

    function goNextStep() {
      if (!validateStep(steps[state.currentStep].id)) {
        showStepMessage(getIncompleteStepMessage(steps[state.currentStep].id));
        return;
      }
      if (state.currentStep < steps.length - 1) {
        window.LearningBehaviorTracker?.markStageSubmitted(steps[state.currentStep].id);
        if (!isDeveloperMode()) state.maxUnlockedStep = Math.max(state.maxUnlockedStep || 0, state.currentStep + 1);
        state.currentStep += 1;
        if (!isDeveloperMode()) saveState();
        renderApp();
      }
    }

    function hasText(value) {
      return String(value ?? "").trim().length > 0;
    }

    function validateStep(stepId) {
      if (isDeveloperMode()) return true;
      if (!isSurveyStepComplete(stepId)) return false;
      const fields = state.fields || {};
      if (stepId === "question") return hasText(fields.brainstormIndividual) && hasText(fields.brainstormGroup) && fields.strategyMatchConfirmed === true && hasText(fields.questionStrategy);
      if (stepId === "hypothesis") return hasText(fields.hypothesis1) && hasText(fields.hypothesis2);
      if (stepId === "plan") return hasText(fields.strategy1) && hasText(fields.strategy2) && getPlannedItemCount(1) > 0 && getPlannedItemCount(2) > 0;
      if (stepId === "evidence") return hasRequiredCombinationRecords();
      if (stepId === "analysis") return Array.isArray(state.records) && state.records.length > 0 && Array.isArray(state.strategyScores) && state.strategyScores.length > 0;
      if (stepId === "conclusion") return hasText(fields.conclusion);
      if (stepId === "reflection") return hasText(fields.designImprove) && hasText(fields.surprise) && hasText(fields.applicability);

    function renderProgress() {
      normalizeStepAccess();
      progress.innerHTML = steps.map((step, index) => {

        const isDone = index < state.maxUnlockedStep;
        const isLocked = !isDeveloperMode() && index > state.maxUnlockedStep;
        const cls = isActive ? "is-active" : isDone ? "is-done" : isLocked ? "is-locked" : "";
        const lockedAttrs = isLocked ? ' aria-disabled="true" title="请先完成前一步内容，再进入下一步。"' : '';
        return `<button class="progress-step ${cls}" type="button" data-step="${index}"${lockedAttrs}><strong>${index + 1}</strong><span>${step.title}</span></button>`;
      }).join("");

        button.addEventListener("click", () => {
          goToStep(Number(button.dataset.step));
        });
      });
    }

    function renderStep() {

      applyLearningBehaviorMetadata();
      bindInputs();

    function getStepHtml(stepId) {

        analysis: renderAnalysisStep,
        conclusion: renderConclusionStep,
        reflection: renderReflectionStep
      ,
        posttest: renderPosttestStep}[stepId]();
    }
    function getStepPageIndex(stepId) {

    function setStepPageIndex(stepId, pageIndex) {
      stepPageIndexes[stepId] = Math.max(0, Number(pageIndex) || 0);

    function getStepPageCount(stepId) {

        question: 8,

        plan: 7,

        analysis: 4 + Math.ceil((state.strategyScores || []).length / 3),

      };
      if (stepId !== "posttest") return fixedCounts[stepId] || 1;
      return KNOWLEDGE_QUIZ.items.length + Math.ceil(SURVEY_DEFS.meta.items.length / 3) + Math.ceil(SURVEY_DEFS.load.items.length / 3) + Math.ceil(SURVEY_DEFS.inquiry.items.length / 3) + 1;
    }
    function renderPagedStep(stepId, pages) {

    function changeStepPage(stepId, targetPage, pageCount) {
      const currentPage = getStepPageIndex(stepId);

      const content = main.querySelector(".step-page-content");
      const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
      const finish = () => {
        setStepPageIndex(stepId, target);
        stepPageTransitioning = false;

      if (!content || reduceMotion) return finish();
      stepPageTransitioning = true;
      content.classList.add("is-leaving");

    }
    function bindPagedStepEvents(stepId) {
      const pageCount = getStepPageCount(stepId);
      const pageIndex = getStepPageIndex(stepId);

      previous?.addEventListener("click", () => {
        if (pageIndex > 0) return changeStepPage(stepId, pageIndex - 1, pageCount);
        const previousStep = state.currentStep - 1;

        setStepPageIndex(previousStepId, getStepPageCount(previousStepId) - 1);
        goToStep(previousStep);

      next?.addEventListener("click", () => {
        if (pageIndex < pageCount - 1) changeStepPage(stepId, pageIndex + 1, pageCount);

    function renderPosttestStep() { return renderSurveyPage(); }

    function renderSurveyPage() {

          const endIndex = Math.min(startIndex + 3, def.items.length);

        }

    function renderPosttestExportArea() {

    function renderSurveySummaryCards() {

      return '<div class="survey-summary">' +

    function renderKnowledgeQuiz() {

      return '<section class="quiz-section">' +
        '<div class="survey-intro"><h3>🕵️ 案件知识验证</h3><p>请根据本次案件调查中获得的证据，完成下面的知识验证。</p></div>' +
        KNOWLEDGE_QUIZ.items.map((item, index) => {
          const itemKey = 'q' + (index + 1);

          return '<article class="quiz-card"><h4>第' + (index + 1) + '题</h4><p>' + escapeHtml(item.question) + '</p>' +
            '<div class="quiz-options">' + Object.keys(item.options).map((key) => {
              const checked = selected === key;
              return '<label class="quiz-option ' + (checked ? 'is-selected' : '') + '"><input type="radio" name="knowledge-' + itemKey + '" data-quiz-question="' + itemKey + '" value="' + key + '" ' + (checked ? 'checked' : '') + (quiz.submitted ? ' disabled' : '') + '><span class="quiz-key">' + key + '</span><span class="quiz-label">' + escapeHtml(item.options[key]) + '</span></label>';
            }).join('') + '</div></article>';
        }).join('') +
        result +
      '</section>';
    }
    function renderKnowledgeQuizItem(index) {
      const quiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
      if (state.knowledgeAssessment?.T4 || quiz.submitted || quiz.history.length) {
        return '<section class="quiz-section"><div class="quiz-result">即时知识测试已完成，作答已锁定。</div></section>';
      }
      const item = KNOWLEDGE_QUIZ.items[index];
      const itemKey = `q${index + 1}`;
      const selectedValue = quiz.answers[itemKey] || "";
      return `<section class="quiz-section"><article class="quiz-card"><h4>第 ${index + 1} 题</h4><p>${escapeHtml(item.question)}</p><div class="quiz-options">${Object.keys(item.options).map((key) => {
        const checked = selectedValue === key;
        return `<label class="quiz-option ${checked ? "is-selected" : ""}"><input type="radio" name="knowledge-${itemKey}" data-quiz-question="${itemKey}" value="${key}" ${checked ? "checked" : ""}${quiz.submitted ? " disabled" : ""}><span class="quiz-key">${key}</span><span class="quiz-label">${escapeHtml(item.options[key])}</span></label>`;

    function bindKnowledgeQuizInputs() {
      main.querySelectorAll('[data-quiz-question]').forEach((input) => {
        input.addEventListener('change', () => {
          state.knowledgeQuiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
          state.knowledgeQuiz.answers[input.dataset.quizQuestion] = input.value;
          saveState();
          renderApp();
        });
      });
    }

    function isKnowledgeQuizAnswered() {
      const quiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
      return KNOWLEDGE_QUIZ.items.every((_, index) => quiz.answers['q' + (index + 1)]);
    }

    function finalizeKnowledgeQuizOnce() {
      state.knowledgeQuiz = mergeKnowledgeQuiz(state.knowledgeQuiz);
      state.knowledgeAssessment = knowledgeAssessmentApi.mergeTimelines(state.knowledgeAssessment, knowledgeAssessmentApi.readTimeline());
      if (state.knowledgeAssessment.T4) return true;
      if (state.knowledgeQuiz.submitted || state.knowledgeQuiz.history.length) return true;
      const unanswered = KNOWLEDGE_QUIZ.items.some((_, index) => !state.knowledgeQuiz.answers['q' + (index + 1)]);
      if (unanswered) {
        alert('请先完成全部案件知识验证题目。');
        return false;
      }
      let correctCount = 0;
      const wrongQuestions = [];
      KNOWLEDGE_QUIZ.items.forEach((item, index) => {
        const itemKey = 'q' + (index + 1);
        if (state.knowledgeQuiz.answers[itemKey] === item.answer) correctCount += 1;
        else wrongQuestions.push(index + 1);
      });
      const totalCount = KNOWLEDGE_QUIZ.items.length;
      const score = totalCount ? Math.round((correctCount / totalCount) * 100) : 0;
      const submittedAt = new Date().toISOString();
      const record = normalizeKnowledgeQuizRecord({
        attemptNumber: state.knowledgeQuiz.history.length + 1,
        submittedAt,
        score,
        correctCount,
        totalCount,
        accuracy: score,
        answers: state.knowledgeQuiz.answers,
        wrongQuestions
      }, state.knowledgeQuiz.history.length);
      state.knowledgeQuiz.history.push(record);
      state.knowledgeQuiz.correctCount = record.correctCount;
      state.knowledgeQuiz.score = record.score;
      state.knowledgeQuiz.submitted = true;
      state.knowledgeQuiz.submittedAt = record.submittedAt;
      state.knowledgeQuiz.wrongQuestions = record.wrongQuestions;
      const assessmentDraft = {
        questionOrder: KNOWLEDGE_QUIZ.items.map((item) => item.id),
        answers: Object.fromEntries(KNOWLEDGE_QUIZ.items.map((item, index) => [item.id, state.knowledgeQuiz.answers['q' + (index + 1)]]))
      };
      state.knowledgeAssessment = knowledgeAssessmentApi.submitStage(state.knowledgeAssessment, "T4", KNOWLEDGE_QUIZ.items, assessmentDraft).timeline;
      saveState();
      renderApp();
      return true;
    }

    function bindSurveyInputs() {
      main.querySelectorAll("[data-survey]").forEach((input) => {
        input.addEventListener("change", () => {
          const surveyKey = input.dataset.survey;
          const questionKey = input.dataset.question;
          state.surveys = mergeSurveys(state.surveys);
          state.surveys.current[surveyKey][questionKey] = Number(input.value);
          saveState();
          renderApp();
        });
      });
    }

    function summarizeSurvey(surveyKey, defKey) {
      const def = SURVEY_DEFS[defKey];
      const answers = state.surveys?.current?.[surveyKey] || {};
      const values = def.items.map((_, index) => Number(answers['q' + (index + 1)] || 0)).filter(Boolean);
      const total = values.reduce((sum, value) => sum + value, 0);
      return { answered: values.length, total, average: values.length ? Number((total / values.length).toFixed(2)) : 0, complete: values.length === def.items.length };
    }

    function isSurveyStepComplete(stepId) {
      if (stepId === "posttest") return summarizeSurvey("postMeta", "meta").complete && summarizeSurvey("cognitiveLoad", "load").complete && summarizeSurvey("inquiryParticipation", "inquiry").complete && isKnowledgeQuizAnswered();
      return true;
    }

    function getSurveySheets() {
      const makeSheet = (title, surveyKey, defKey) => {
        const def = SURVEY_DEFS[defKey];
        const answers = state.surveys?.current?.[surveyKey] || {};
        const summary = summarizeSurvey(surveyKey, defKey);
        return [title, [
          ["题号", "题目", "得分"],
          ...def.items.map((item, index) => [String(index + 1), item, answers['q' + (index + 1)] || ""]),
          ["合计", "总分", summary.total],
          ["合计", "均分", summary.average]
        ]];
      };
      const post = summarizeSurvey("postMeta", "meta");
      const load = summarizeSurvey("cognitiveLoad", "load");
      const inquiry = summarizeSurvey("inquiryParticipation", "inquiry");
      return [
        makeSheet("学习收获调查", "postMeta", "meta"),
        makeSheet("侦探小结-认知负荷", "cognitiveLoad", "load"),
        makeSheet("侦探小结-探究参与", "inquiryParticipation", "inquiry"),
        ["问卷汇总", [
          ["问卷", "已答题数", "总分", "均分", "完成情况"],
          ["学习收获调查", post.answered, post.total, post.average, post.complete ? "已完成" : "未完成"],
          ["侦探小结认知负荷", load.answered, load.total, load.average, load.complete ? "已完成" : "未完成"],
          ["侦探小结科学探究参与", inquiry.answered, inquiry.total, inquiry.average, inquiry.complete ? "已完成" : "未完成"]
        ]]
      ];
    }

    function renderStrategyReadingMaterials() {
      return `
        <article class="reading-card"><h4>材料一</h4><p>大脑平均每天产生约70,000个想法，长时记忆的形成涉及突触可塑性的改变。当海马体（大脑边缘系统的组成部分）反复处理相同信息时，神经元之间的连接会增强。这个过程被称为长时程增强(LTP)，与短期记忆的电子信号传递不同。</p><p>——《记忆：从大脑到分子》</p></article>
        <article class="reading-card"><h4>材料二</h4><p>长时记忆可分为情景记忆（例如，记得去年生日派对）和语义记忆（例如，知道巴黎是法国首都）。有趣的是，调查显示90%的人能记住自己7岁时的某个情景。程序记忆（例如，骑自行车）则存储在小脑中，这种记忆往往通过身体练习形成。</p><p>——《情景记忆和语义记忆》</p></article>
        <article class="reading-card"><h4>材料三</h4><p>赫尔曼·艾宾浩斯通过无意义音节（如ZOF）实验发现，遗忘在学习后立即开始，20分钟后遗忘41.8%。现代研究证实，间隔复习可以打破这种曲线。此外，主动回忆比被动重读有效2-3倍，且将新知识与已有知识关联可提升记忆效率。</p><p>——《记忆：对实验心理学的贡献》</p></article>

    function renderPlanMaterials() {
      return `
        <details class="material-details" open><summary>材料五</summary><div class="material-details-body">
          <p>心理学家亨利·罗迪格（Henry Roediger）在2006年进行了一项关于主动提取如何影响长时记忆的重要实验。首先选取了40组斯瓦希里语-英语单词组作为记忆材料，比如"mashua-boat"这样的组合。将参与者随机分成两组，一组采用传统的重复学习方法，另一组则采用主动提取的方式。在第一阶段的学习中，所有参与者都会完整地学习一遍40组单词对，每组单词会呈现5秒钟，让参与者形成初步记忆。</p>
          <p>接下来的练习阶段体现出了关键差异：重复学习组的参与者会再次完整地阅读所有单词对4遍，每次阅读的顺序都随机打乱，模拟了"死记硬背"的学习方法；而主动提取组的参与者则只阅读单词对1遍，之后就要面对3轮回忆测试。在回忆阶段，研究人员会单独呈现斯瓦希里语单词，比如"mashua"，参与者需要通过主动提取来回忆对应的英语释义"boat"。</p>
          <p>随后，研究人员对所有参与者进行了突袭测试，要求他们根据斯瓦希里语单词回忆对应的英语释义，以此来评估长时记忆的保持效果。测试结果非常明显：主动提取组的平均正确率达到了80%左右，而重复学习组只有约30%的正确率。这个差距有力地证明了主动回忆比被动复习更能促进长时记忆的保持。</p>

        <details class="material-details"><summary>材料六</summary><div class="material-details-body">
          <p>本次长时记忆探究活动中，头环将成为探索记忆奥秘的重要科学工具，它能帮助我们“看到”大脑在记忆时的活动情况。</p>
          <p>头环主要通过两种方式来监测大脑活动：一种是记录脑电波（EEG），就像给大脑的活动“录音”；另一种是检测血流变化（fNIRS），相当于观察大脑哪个区域在工作时会“充血”。在实验中，当你使用不同的记忆方法时，头环会实时记录下大脑的反应，并通过软件将这些数据转化成直观的图表和3D脑图。在证据搜集环节，头环可以帮助你获得更科学的实验数据（例如，当用分组记忆法背单词时，头环能显示大脑哪些区域被激活），这些数据会成为研究假设的有力证据。在信息处理阶段，可以将头环采集到的脑活动热力图与回忆率进行对比分析，看看哪种记忆方法能让大脑更活跃，记忆效果更好。在得出结论时，头环提供的数据会让结论更有说服力。例如，如果数据显示使用图像联想记忆法时，大脑的视觉区域特别活跃，同时回忆率也最高，那么就可得出相应的科学结论。</p>
          <p>使用头环时要注意：保持额头清洁，确保电极贴片贴紧；实验过程中保持专注；认真记录每个环节的数据变化。希望你能善用这个工具，在探究活动中获得更多发现！</p>

            </picture>
          </div>
        </div></details>

    function renderEvidenceFlow() {
      return `<div class="flow-grid">
        <div class="flow-card"><h4>1. 实验操作</h4><div class="phase-card-grid"><div class="phase-card"><h5>第一轮：简单复述 vs 策略1</h5><p>第一阶段使用简单复述，第二阶段使用计划中的策略1。</p><p>两个阶段都依次完成记忆、找不同和测试。</p></div><div class="phase-card"><h5>第二轮：简单复述 vs 策略2</h5><p>第一阶段使用简单复述，第二阶段使用计划中的策略2。</p><p>两个阶段都依次完成记忆、找不同和测试。</p></div></div></div>
        <div class="flow-card"><h4>2. 记录数据</h4><p>将实验所得的数据记录在数据记录表中。</p></div>
        <div class="flow-card"><h4>3. 处理分析数据</h4><p>对数据进行处理分析。</p></div>
        <div class="flow-card"><h4>4. 得出结论</h4><p>根据实验处理分析的数据检验假设回答研究问题。</p></div>
        <div class="flow-card"><h4>补充说明</h4><p>记录不同策略的回忆出的数量与题目总数，计算不同策略的回忆率。同时进行头环材料的学习，结合头环的显示热力图，判断策略的大脑活跃程度。</p><p>总回忆率=（正确数/抽取的题目总数）×100%</p><p>每道题回答错误情况示例（答案+回答+错误情况）：</p><p>nudge+nugde+两个字母位置错误</p></div>
      </div>`;
    }

    function renderQuestionStep() {
      const explanations = getStrategyExplanations();
      const pages = [
        { title: "回忆学习经历", className: "paged-thinking", content: () => `<div class="page-card question-prompt-strip"><p><strong>思考：回忆自己学习的经历，为什么有些信息更容易长期记住？哪些方法可以帮助我们更好地记住学习内容？请开始头脑风暴。</strong></p>${renderPairedField("头脑风暴", `<textarea data-field="brainstormIndividual" placeholder="请写下你自己的想法">${escapeHtml(state.fields.brainstormIndividual)}</textarea>`, renderGroupTextarea("brainstormGroup", "请写下小组讨论后形成的共识"))}</div>` },
        { title: "记忆策略说明（一）", content: () => `<div class="page-card strategy-guide-grid">${explanations.slice(0, 3).map(renderStrategyInfoCard).join("")}</div>` },
        { title: "记忆策略说明（二）", content: () => `<div class="page-card strategy-guide-grid">${explanations.slice(3).map(renderStrategyInfoCard).join("")}</div>` },
        ...getStrategyMatchMaterials().map((material, index) => ({ title: `${material.title}：材料—策略匹配`, content: () => renderSingleStrategyMatchPage(material, index) })),
        { title: "科学探究案例与研究问题", className: "case-page", content: () => `<div class="page-card case-question-layout"><div>${renderInquiryCases()}</div><div>${renderInquiryScaffold("question")}${state.fields.strategyMatchConfirmed ? `<div class="field"><label for="questionStrategy">研究问题（小组）</label><div class="strategy-question-line"><input id="questionStrategy" type="text" data-field="questionStrategy" value="${escapeHtml(state.fields.questionStrategy)}" placeholder="请输入记忆策略"><span>可以改善长时记忆</span></div></div>` : '<div class="tip-box">请先完成并确认材料—策略匹配，再填写研究问题。</div>'}</div></div>` }
      ];
      return renderPagedStep("question", pages);
    }
    function renderStrategyInfoCard(item) {
      return `<article class="strategy-info-card"><h4>${escapeHtml(item.name)}</h4><p>${escapeHtml(item.text)}</p></article>`;
    }
    function renderSingleStrategyMatchPage(material, index) {
      const selections = state.fields.strategyMatchSelections || {};
      const message = state.fields.strategyMatchMessage ? `<div class="tip-box">${escapeHtml(state.fields.strategyMatchMessage)}</div>` : "";
      return `<div class="material-match-page"><article class="reading-card"><h4>${escapeHtml(material.title)}</h4><p>${escapeHtml(material.text)}</p><p>${escapeHtml(material.source)}</p><div class="strategy-match-controls">${renderStrategyMatchSelects(material.key, selections[material.key] || [])}</div></article><aside class="match-status-card"><h4>匹配提示</h4><p>可返回前两页查看六种策略说明。四则材料都选择完成后统一确认。</p><p><strong>当前进度：</strong>${formatMatchSelections()}</p>${index === 3 ? `<button class="btn" type="button" id="confirmStrategyMatchBtn">确认全部匹配</button>${message}` : ""}</aside></div>`;
    }
    function renderHypothesisStep() {
      const pages = [1, 2].map((number) => ({
        title: `提出策略 ${number} 假设`,
        className: "paged-thinking",
        content: () => `<div class="page-card"><p class="hint">假设应回应研究问题，说明对实验结果的预测，并能够由后续数据支持或反驳。</p><div class="field"><label>研究假设：策略 ${number}</label>${renderExperimentStrategySelect(`strategy${number}`)}</div>${renderPairedField(`策略 ${number} 假设`, `<textarea data-field="hypothesis${number}" placeholder="请填写你自己的策略${number}假设">${escapeHtml(state.fields[`hypothesis${number}`])}</textarea>`, renderGroupTextarea(`hypothesis${number}_group`))}</div>`
      }));
      return renderPagedStep("hypothesis", pages);
    }

    function renderStrategyMatchTask() {
      const selections = state.fields.strategyMatchSelections || {};
      const message = state.fields.strategyMatchMessage ? `<div class="tip-box">${escapeHtml(state.fields.strategyMatchMessage)}</div>` : "";
      const cards = getStrategyMatchMaterials().map((item) => `<article class="reading-card strategy-match-card">
        <h4>${item.title}</h4>
        <p>${item.text}</p>
        <p>${item.source}</p>
        <div class="strategy-match-controls">
          ${renderStrategyMatchSelects(item.key, selections[item.key] || [])}
        </div>
      </article>`).join("");
      const strategyCards = SHUFFLED_STRATEGIES.map((strategy) => {
        const item = getStrategyExplanations().find((entry) => entry.name === strategy);
        return item ? `<article class="strategy-info-card"><h4>${item.name}</h4><p>${item.text}</p></article>` : "";
      }).join("");
      return `<div class="strategy-match-layout"><div class="strategy-match-column">${cards}</div><div class="strategy-match-column">${strategyCards}</div></div><div class="actions" style="justify-content:flex-start;"><button class="btn" type="button" id="confirmStrategyMatchBtn">确认</button></div>${message}`;
    }

    function renderStrategyMatchSelects(materialKey, selectedValues) {
      const count = (STRATEGY_MATCH_ANSWERS[materialKey] || []).length || 1;
      return Array.from({ length: count }, (_, index) => {
        const value = selectedValues[index] || "";
        return `<div class="strategy-match-field"><span>这个材料反映了${count > 1 ? `（${index + 1}）` : ""}</span><select aria-label="请选择策略" data-match-material="${materialKey}" data-match-index="${index}"><option value="" ${value ? "" : "selected"}>请选择策略</option>${SHUFFLED_STRATEGIES.map((strategy)=>`<option value="${strategy}" ${value === strategy ? "selected" : ""}>${strategy}</option>`).join("")}</select><span>策略。</span></div>`;
      }).join("");
    }

    function getStrategyExplanations() {
      return [
        { name: "简单复述", text: "通过机械性、重复性地多次呈现或回顾相同信息，依赖海马体的反复激活，以触发长时程增强（LTP）机制，从而强化神经元之间的突触连接，最终将短期记忆转化为长时记忆。" },
        { name: "情景关联", text: "通过将目标信息与个人经历、特定场景或情感体验主动建立联系，从而利用情景记忆系统（如海马体和内侧颞叶）增强记忆效果的策略。其核心是通过激活大脑对事件背景、空间位置或情绪状态的编码能力，将抽象信息转化为具象化的、可回溯的“心理情景”，以提升记忆的持久性和提取效率。" },
        { name: "主动回忆", text: "通过主动提取记忆内容（而非被动重复阅读）来强化记忆的方法。其核心是自我测试，即在无外部提示的情况下，强制大脑检索目标信息，从而增强神经回路的稳定性，显著减缓遗忘速度。" },
        { name: "新旧知识关联", text: "将新信息与既有知识网络（如概念、经验或认知框架）主动建立逻辑或语义联系的方法。其本质是借助大脑对结构化信息的偏好，降低新知识的记忆负荷。" },
        { name: "信息可视化", text: "将抽象或复杂的语言信息转化为视觉表征（如图像、图表、思维导图等），通过同时激活大脑的视觉处理皮层和语言中枢，增强记忆编码。" },
        { name: "线索提取", text: "通过设计或利用关键提示（如首字母、关联符号、情境特征），定向触发目标记忆内容的主动检索。其核心是优化记忆检索路径，降低提取难度。" }
      ];
    }

    function getStrategyMatchMaterials() {
      return [
        { key: "material1", title: "材料一", text: "大脑平均每天产生约70,000个想法，长时记忆的形成涉及突触可塑性的改变。当海马体（大脑边缘系统的组成部分）反复处理相同信息时，神经元之间的连接会增强。这个过程被称为长时程增强(LTP)，与短期记忆的电子信号传递不同。", source: "——《记忆：从大脑到分子》" },
        { key: "material2", title: "材料二", text: "长时记忆可分为情景记忆（例如，记得去年生日派对）和语义记忆（例如，知道巴黎是法国首都）。有趣的是，调查显示90%的人能记住自己7岁时的某个情景。程序记忆（例如，骑自行车）则存储在小脑中，这种记忆往往通过身体练习形成。", source: "——《情景记忆和语义记忆》" },
        { key: "material3", title: "材料三", text: "赫尔曼·艾宾浩斯通过无意义音节（如ZOF）实验发现，遗忘在学习后立即开始，20分钟后遗忘41.8%。现代研究证实，间隔复习可以打破这种曲线。此外，主动回忆比被动重读有效2-3倍，且将新知识与已有知识关联可提升记忆效率。", source: "——《记忆：对实验心理学的贡献》" },
        { key: "material4", title: "材料四", text: "一个探索记忆策略有效性的研究在近1000项实验的基础上得出结论，提取线索（关键信息，例如单词首字母）效果值达0.93，而划重点只有0.22。分散学习比集中学习效率高50%，但需要精确安排间隔时间。值得注意的是，将信息可视化（例如，思维导图或图像）能同时激活视觉和语言皮层。", source: "——《运用有效的学习技巧提升学生的学习效果》" }
      ];
    }
    function renderPlanStep() {
      const pages = [
        { title: "材料五：主动提取实验设计", content: () => `<article class="page-card plan-reading-page"><p>心理学家亨利·罗迪格（Henry Roediger）在2006年进行了一项关于主动提取如何影响长时记忆的重要实验。首先选取了40组斯瓦希里语-英语单词组作为记忆材料，比如"mashua-boat"这样的组合。将参与者随机分成两组，一组采用传统的重复学习方法，另一组则采用主动提取的方式。在第一阶段的学习中，所有参与者都会完整地学习一遍40组单词对，每组单词会呈现5秒钟，让参与者形成初步记忆。</p><p>接下来的练习阶段体现出了关键差异：重复学习组的参与者会再次完整地阅读所有单词对4遍，每次阅读的顺序都随机打乱，模拟了"死记硬背"的学习方法；而主动提取组的参与者则只阅读单词对1遍，之后就要面对3轮回忆测试。在回忆阶段，研究人员会单独呈现斯瓦希里语单词，比如"mashua"，参与者需要通过主动提取来回忆对应的英语释义"boat"。</p><p>随后，研究人员对所有参与者进行了突袭测试，要求他们根据斯瓦希里语单词回忆对应的英语释义，以此来评估长时记忆的保持效果。测试结果非常明显：主动提取组的平均正确率达到了80%左右，而重复学习组只有约30%的正确率。这个差距有力地证明了主动回忆比被动复习更能促进长时记忆的保持。</p></article>` },
        { title: "材料六：头环说明", content: renderHeadbandPlanPage },
        { title: "策略与记忆材料推荐", content: renderStrategyRecommendationPage },
        { title: "实验策略与参与者", content: () => `<div class="page-card"><p>请分别设置两轮实验。每轮两个阶段的材料类型、难度和数量相同，但系统会抽取不同题目。</p><div class="strategy-mode-grid"><div class="strategy-mode-card"><h4>阶段一</h4><p>策略：简单复述。这是“不使用额外策略”的基线条件。</p></div><div class="strategy-mode-card"><h4>阶段二</h4><p>第一轮使用策略1，第二轮使用策略2。</p></div></div><div class="compact-form-grid"><div class="field"><label>阶段一策略</label>${renderStrategySelect("stage1Strategy", "简单复述", true)}</div><div class="field"><label>策略 1</label>${renderExperimentStrategySelect("strategy1")}</div><div class="field"><label>策略 2</label>${renderExperimentStrategySelect("strategy2")}</div><div class="field"><label>参与者编号</label><input type="text" data-field="participantId" value="${escapeHtml(state.fields.participantId || state.studentId)}" placeholder="请输入参与者编号"></div></div></div>` },
        { title: "第一轮材料与难度", className: "round-plan-page", content: () => `<div class="page-card">${renderRoundPlanCard(1)}</div>` },
        { title: "第二轮材料与难度", className: "round-plan-page", content: () => `<div class="page-card">${renderRoundPlanCard(2)}</div>` },
        { title: "实验时间参数", content: () => `<div class="page-card"><div class="compact-form-grid"><div class="field"><label>记忆时间（秒）</label><input type="number" min="10" max="180" data-field="memorySeconds" value="${escapeHtml(state.fields.memorySeconds)}"></div><div class="field"><label>找不同时间（秒）</label><input type="number" min="10" max="180" data-field="puzzleSeconds" value="${escapeHtml(state.fields.puzzleSeconds)}"></div><div class="field"><label>测试时间（秒）</label><input type="number" min="20" max="240" data-field="testSeconds" value="${escapeHtml(state.fields.testSeconds)}"></div></div><div class="reading-card"><h4>正式测量说明</h4><p>搜集证据时将直接使用这里设置的策略、材料、难度和时间，不再提供第二套参数控件。</p></div></div>` }
      ];
      return renderPagedStep("plan", pages);
    }
    function renderHeadbandPlanPage() {
      return `<article class="page-card plan-reading-page"><h4>材料六</h4><p>本次长时记忆探究活动中，头环将成为探索记忆奥秘的重要科学工具，它能帮助我们“看到”大脑在记忆时的活动情况。</p><p>头环主要通过两种方式来监测大脑活动：一种是记录脑电波（EEG），就像给大脑的活动“录音”；另一种是检测血流变化（fNIRS），相当于观察大脑哪个区域在工作时会“充血”。在实验中，当你使用不同的记忆方法时，头环会实时记录下大脑的反应，并通过软件将这些数据转化成直观的图表和3D脑图。在证据搜集环节，头环可以帮助你获得更科学的实验数据（例如，当用分组记忆法背单词时，头环能显示大脑哪些区域被激活），这些数据会成为研究假设的有力证据。在信息处理阶段，可以将头环采集到的脑活动热力图与回忆率进行对比分析，看看哪种记忆方法能让大脑更活跃，记忆效果更好。在得出结论时，头环提供的数据会让结论更有说服力。例如，如果数据显示使用图像联想记忆法时，大脑的视觉区域特别活跃，同时回忆率也最高，那么就可得出相应的科学结论。</p><p>使用头环时要注意：保持额头清洁，确保电极贴片贴紧；实验过程中保持专注；认真记录每个环节的数据变化。希望你能善用这个工具，在探究活动中获得更多发现！</p><button class="btn secondary" type="button" id="openHeadbandGuide">点击查看头环工作原理</button>${renderHeadbandModal()}</article>`;
    }
    function renderHeadbandModal() {
      return `<div class="headband-modal" id="headbandGuideModal" role="dialog" aria-modal="true" aria-label="头环工作原理" tabindex="-1"><div class="headband-modal-card"><button class="btn secondary headband-modal-close" type="button" id="closeHeadbandGuide" aria-label="关闭头环工作原理">×</button><picture><source srcset="assets/headband-guide.webp" type="image/webp"><img src="assets/headband-guide.png" alt="头环工作原理示意图" width="1536" height="1024" loading="lazy" decoding="async"></picture></div></div>`;
    }
    function renderStrategyRecommendationPage() {
      return `<div class="page-card"><h4>策略与对应记忆材料推荐</h4><table><thead><tr><th>记忆策略</th><th>推荐记忆材料</th></tr></thead><tbody><tr><td>情景关联</td><td>古诗</td></tr><tr><td>主动回忆</td><td>英文单词、古诗、成语</td></tr><tr><td>新旧知识关联</td><td>英文单词</td></tr><tr><td>信息可视化</td><td>古诗、成语</td></tr><tr><td>信息提取</td><td>英文单词、成语</td></tr></tbody></table></div>`;
    }
    function renderMaterialTypeSelect(field) {
      return `<select data-field="${field}">${["word", "poem", "idiom"].map((type) => `<option value="${type}" ${state.fields[field] === type ? "selected" : ""}>${MATERIAL_TYPE_LABELS[type]}</option>`).join("")}</select>`;
    }
    function renderRoundPlanCard(round) {
      const prefix = `round${round}`;
      const strategy = round === 1 ? state.fields.strategy1 : state.fields.strategy2;
      return `<section class="round-plan-card"><h4>${getRoundLabel(round)}实验计划</h4><p>第一阶段：简单复述；第二阶段：${escapeHtml(strategy)}</p><div class="field"><label>材料类型</label>${renderMaterialTypeSelect(`${prefix}MaterialType`)}</div><div class="field"><label>本轮题目总数</label><input type="text" value="${getPlannedItemCount(round)} 道" readonly></div><div class="field"><label>数量与难度调节</label><div class="difficulty-controls">${renderDifficultyControl(`${prefix}LowCount`, "初级")}${renderDifficultyControl(`${prefix}MidCount`, "中级")}${renderDifficultyControl(`${prefix}HighCount`, "高级")}</div></div></section>`;
    }
    function getRoundLabel(round) {
      return Number(round) === 2 ? "第二轮" : "第一轮";
    }
    function getStageLabel(stage) {
      return Number(stage) === 2 ? "第二阶段" : "第一阶段";
    }
    function getCombinationKey(round, stage) {
      return `${Number(round) === 2 ? 2 : 1}-${Number(stage) === 2 ? 2 : 1}`;
    }
    function getAssignedStrategy(round, stage) {
      if (Number(stage) === 1) return "简单复述";
      const planned = Number(round) === 2 ? state.fields.strategy2 : state.fields.strategy1;
      return EXPERIMENT_STRATEGIES.includes(planned) ? planned : EXPERIMENT_STRATEGIES[0];
    }
    function getRecordCombinationKey(record) {
      if (!record || !record.round || !record.stage) return "";
      return getCombinationKey(record.round, record.stage);
    }
    function saveLatestCombinationRecord(records, record) {
      const key = getRecordCombinationKey(record);
      const existingIndex = key ? records.findIndex((item) => getRecordCombinationKey(item) === key) : -1;
      if (existingIndex >= 0) records.splice(existingIndex, 1, record);
      else records.push(record);
      return existingIndex >= 0;
    }
    function getCompletedCombinationKeys() {
      return new Set((state.records || []).map(getRecordCombinationKey).filter(Boolean));
    }
    function hasRequiredCombinationRecords() {
      const completed = getCompletedCombinationKeys();
      return ["1-1", "1-2", "2-1", "2-2"].every((key) => completed.has(key));
    }
    function renderCombinationProgress() {
      const completed = getCompletedCombinationKeys();
      const combinations = [[1, 1], [1, 2], [2, 1], [2, 2]];
      return `<div class="combination-progress">${combinations.map(([round, stage]) => {
        const key = getCombinationKey(round, stage);
        const done = completed.has(key);
        return `<div class="combination-progress-item ${done ? "is-complete" : ""}"><span>${getRoundLabel(round)} · ${getStageLabel(stage)} · ${escapeHtml(getAssignedStrategy(round, stage))}</span><strong>${done ? "已完成" : "待完成"}</strong></div>`;
      }).join("")}</div>`;
    }
    function renderEvidenceStep() {
      const attempts = Array.isArray(state.attemptHistory) ? state.attemptHistory : [];

    function renderStrategyRunResultCard(record, index) {

        const correct = responseIndex >= 0;
        if (correct) usedResponses.add(responseIndex);
        const response = correct ? responses[responseIndex] : (responses[itemIndex] || "未作答");

    function bindHeadbandModalEvents() {

      const modal = document.getElementById("headbandGuideModal");

      if (!open || !modal || !close) return;
      const hide = () => {
        modal.classList.remove("is-visible");
        lastHeadbandTrigger?.focus();
      };
      open.addEventListener("click", () => {
        lastHeadbandTrigger = open;
        modal.classList.add("is-visible");
        close.focus();
      });
      close.addEventListener("click", hide);
      modal.addEventListener("click", (event) => { if (event.target === modal) hide(); });
      modal.addEventListener("keydown", (event) => { if (event.key === "Escape") hide(); });

      const button = document.getElementById("reviewReportBtn");
      if (button) button.disabled = true;
      window.LearningBehaviorTracker?.markStageSubmitted(steps[state.currentStep].id);
      await Promise.resolve(window.LearningBehaviorTracker?.flush());

      if (result?.ok) window.BrainExperimentBridge.finishReport(activityType, result.submissionId || "");

        ["策略评分记录", [["学号","姓名","班级","小组","策略名称","答案准确性得分","策略利用率得分","记忆信心度得分","策略总分（满分15分）","记录时间"], ...(state.strategyScores || []).map((record)=>[record.studentId, record.studentName || "", record.className || "", record.groupName || record.groupId || "", record.strategyName, record.scoreAccuracy, record.scoreUse, record.scoreConfidence, getAdjustedScoreTotal(record), record.createdAt])]],
        ...getSurveySheets()
      ];
      const html = `<html><head><meta charset="utf-8"></head><body>${sheets.map(([title,rows])=>`<h2>${escapeHtml(title)}</h2><table border="1">${rows.map((row)=>`<tr>${row.map((cell)=>`<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</table><br>`).join("")}</body></html>`;
      const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `长时记忆策略_${state.groupId}_${state.studentId}.xls`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
    document.getElementById("homeBtn").addEventListener("click",()=>{ location.href = "index.html"; });
    document.getElementById("devModeBtn").addEventListener("click", enableDeveloperMode);
    const exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportExcel);
    document.getElementById("resetBtn").addEventListener("click",()=>{ if (!confirm("确定要清空本实验在当前浏览器中保存的数据吗？")) return; localStorage.removeItem(STORAGE_KEY); state = loadState(); session = null; clearTimers(); renderApp(); });
    renderApp();
